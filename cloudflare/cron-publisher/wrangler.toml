name = "zazoomtek-editorial-cron"
main = "src/index.js"
compatibility_date = "2026-10-31"
workers_dev = false

# Polling continuo: il Worker controlla ogni cinque minuti se il workflow
# precedente è terminato, quindi avvia un nuovo ciclo senza sovrapposizioni.
[triggers]
crons = ["*/5 * * * *"]

[vars]
GITHUB_REPO = "zazoomtek-coder/zazoomtek-site"
GITHUB_WORKFLOW = "editorial-publish.yml"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
persist = true
