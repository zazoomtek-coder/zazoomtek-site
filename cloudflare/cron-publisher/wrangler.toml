name = "zazoomtek-editorial-cron"
main = "src/index.js"
compatibility_date = "2026-10-31"
workers_dev = false

# Cloudflare Cron runs in UTC. Cover the complete daily intake window
# in both CET and CEST; the Worker converts every tick to Europe/Rome.
[triggers]
crons = ["*/5 7-18 * * *"]

[vars]
GITHUB_REPO = "zazoomtek-coder/zazoomtek-site"
GITHUB_WORKFLOW = "editorial-publish.yml"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
persist = true
