name = "zazoomtek-editorial-cron"
main = "src/index.js"
compatibility_date = "2026-10-31"
workers_dev = false

# Sei candidati UTC coprono i tre orari Europe/Rome sia in ora solare
# sia in ora legale. Il Worker accetta soltanto i tre orari locali esatti.
# Nessun polling, retry o finestra di recupero.
[triggers]
crons = ["30 10,11 * * *", "0 14,15 * * *", "30 17,18 * * *"]

[vars]
GITHUB_REPO = "zazoomtek-coder/zazoomtek-site"
GITHUB_WORKFLOW = "editorial-publish.yml"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
persist = true
