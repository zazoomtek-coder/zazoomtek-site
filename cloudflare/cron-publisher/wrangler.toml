name = "zazoomtek-editorial-cron"
main = "src/index.js"
compatibility_date = "2026-10-31"
workers_dev = false

# Trigger anticipati di 15 minuti rispetto agli slot Europe/Rome.
# Le coppie UTC coprono ora solare e legale; il Worker converte il preflight
# nello slot editoriale effettivo prima di inviare workflow_dispatch.
[triggers]
crons = ["15 10,11 * * *", "45 13,14 * * *", "15 17,18 * * *"]

[vars]
GITHUB_REPO = "zazoomtek-coder/zazoomtek-site"
GITHUB_WORKFLOW = "editorial-publish.yml"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
persist = true
