name = "zazoomtek-editorial-cron"
main = "src/index.js"
compatibility_date = "2026-10-31"
workers_dev = false

# YouTube collection runs every five minutes; publishing is separately gated to three Rome slots.
[triggers]
crons = ["*/5 * * * *"]

[vars]
GITHUB_REPO = "zazoomtek-coder/zazoomtek-site"
GITHUB_COLLECT_WORKFLOW = "editorial-collect.yml"
GITHUB_PUBLISH_WORKFLOW = "editorial-publish.yml"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
persist = true
