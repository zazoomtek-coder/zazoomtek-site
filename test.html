<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test | ZazoomTek</title>
  <meta name="description" content="Tutti i test di gadget, dispositivi e novità hi-tech provati da ZazoomTek.">
  <style>
    :root{--bg:#090a10;--text:#f7f7fb;--muted:#aeb2c4;--orange:#ff7600;--red:#ee255d}
    *{box-sizing:border-box} body{margin:0;color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.5;background:radial-gradient(circle at 85% 5%,rgba(56,140,255,.18),transparent 28rem),radial-gradient(circle at 10% 10%,rgba(238,37,93,.16),transparent 26rem),var(--bg)}
    a{color:inherit;text-decoration:none}.container{width:min(1180px,calc(100% - 40px));margin:auto}
    header{position:sticky;top:0;z-index:20;background:rgba(9,10,16,.86);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
    nav{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem}
    .logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#1677ff,#10162a 48%,#f2264c);border:2px solid rgba(255,255,255,.25)}
    .back{padding:10px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
    .hero{padding:62px 0 30px}.eyebrow{display:inline-block;padding:7px 12px;border-radius:999px;color:#ffd4b5;background:rgba(255,118,0,.12);border:1px solid rgba(255,118,0,.4);font-weight:700;font-size:.85rem}
    h1{font-size:clamp(2.3rem,6vw,4.4rem);margin:16px 0 10px;line-height:1}.lead{color:var(--muted);max-width:760px;margin:0}
    .video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:28px 0 72px}.video-card{border-radius:20px;overflow:hidden;background:linear-gradient(145deg,rgba(31,34,52,.98),rgba(15,16,25,.98));border:1px solid rgba(255,255,255,.09)}
    .video-wrap{position:relative;aspect-ratio:16/9;background:#000}.video-preview{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:#000;cursor:pointer}
    .video-preview img{width:100%;height:100%;object-fit:cover;display:block}.video-preview:after{content:"▶";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:66px;height:46px;display:grid;place-items:center;border-radius:12px;color:#fff;font-size:1.4rem;background:rgba(255,0,0,.93);box-shadow:0 8px 24px rgba(0,0,0,.45)}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.meta{padding:18px}.meta h2{font-size:1.12rem;margin:0 0 10px}
    .yt{display:inline-block;margin-top:6px;padding:10px 14px;border-radius:10px;font-weight:800;background:linear-gradient(120deg,var(--orange),var(--red))}
    footer{padding:28px 0;text-align:center;color:#9297aa;border-top:1px solid rgba(255,255,255,.08)}
    @media(max-width:900px){.video-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.video-grid{grid-template-columns:1fr}.hero{padding-top:42px}}
  </style>
</head>
<body>
<header><nav class="container"><a class="brand" href="index.html"><span class="logo">ZT</span><span>ZazoomTek</span></a><a class="back" href="index.html">← Torna alla Home</a></nav></header>
<main class="container">
  <section class="hero"><span class="eyebrow">🧪 TEST ZAZOOMTEK</span><h1>Tutti i Test</h1><p class="lead">Qui troverete tutti i test in ordine di pubblicazione.</p></section>
  <section class="video-grid">
    <article class="video-card">
      <div class="video-wrap"><button class="video-preview" type="button" data-video="sIVIpovtr6E" onclick="playVideo(this)" aria-label="Riproduci video Test ZazoomTek"><img src="https://i.ytimg.com/vi/sIVIpovtr6E/hqdefault.jpg" alt="Test ZazoomTek" loading="lazy"></button></div>
      <div class="meta"><h2>Ultimo video Test</h2><a class="yt" href="https://youtu.be/sIVIpovtr6E" target="_blank" rel="noopener">▶ Guarda su YouTube</a></div>
    </article>
  </section>
</main>
<footer>© 2026 ZazoomTek · Test.</footer>
<script>
function playVideo(button){const id=button.dataset.video;const iframe=document.createElement('iframe');iframe.src='https://www.youtube.com/embed/'+id+'?autoplay=1&playsinline=1&rel=0';iframe.title='Video ZazoomTek';iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.allowFullscreen=true;button.replaceWith(iframe)}
</script>
</body>
</html>
