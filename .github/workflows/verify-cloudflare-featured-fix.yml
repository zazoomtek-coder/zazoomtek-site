name: Verify Cloudflare featured Home source sync
on:
  push:
    branches: [fix-featured-home-cloudflare-20261016]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check and test exact six-card Homepage synchronization
        run: |
          python3 -m py_compile scripts/cloudflare-sync-featured-home.py scripts/test-cloudflare-featured-home.py
          python3 scripts/test-cloudflare-featured-home.py
          python3 scripts/cloudflare-sync-featured-home.py
          python3 scripts/cloudflare-sync-featured-home.py --check
      - name: Verify production Cloudflare packager includes the corrected grid
        run: |
          python3 scripts/cloudflare-build-site.py
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          home=Path('dist/index.html').read_text(encoding='utf-8')
          start=home.index('<!-- FEATURED_NEWS_START -->')
          end=home.index('<!-- FEATURED_NEWS_END -->')
          excerpt=home[start:end]
          cards=json.loads(Path('dist/featured-carousel.json').read_text(encoding='utf-8'))['items']
          assert [x['section'] for x in cards]==['tech']*5+['gaming']
          hrefs=re.findall(r'<a class="zt-feature-card[^"]*" href="([^"]+)"',excerpt)
          assert hrefs==[x['url'] for x in cards],(hrefs,cards)
          print("PASS: Cloudflare dist Home six cards match 5 Tech + 1 Gaming manifest")
          PY
