name: ZazoomTek - verifica sito online (nessun deploy)
on:
  push:
    branches: [main]
    paths: [tools/verify_site_live.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controlla URL ufficiale e ultime notizie senza pubblicare
        run: python3 tools/verify_site_live.py
