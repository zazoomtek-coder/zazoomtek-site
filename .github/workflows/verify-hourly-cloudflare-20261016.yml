name: Verify hourly Cloudflare budget and zero-change safety
on:
  push:
    branches: [cloudflare-hourly-noop-budget-20261016]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify scheduled hourly polling, YouTube cadence, trigger-only integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          release=Path(".github/workflows/cloudflare-controlled-release.yml").read_text()
          youtube=Path(".github/workflows/youtube-sync.yml").read_text()
          assert "cron: '13 * * * *'" in release
          assert "cron: '13 */2 * * *'" not in release
          assert "cron: '1-59/5 * * * *'" in youtube
          assert 'cloudflare-release-trigger.txt' in release
          print("PASS: YouTube every 5m; Cloudflare checks hourly; gated trigger unchanged.")
          PY
      - name: Verify real quota counter, emergency reserve and zero-build for no changes
        run: |
          python3 -m py_compile scripts/cloudflare-release-control.py
          python3 scripts/cloudflare-release-control.py --self-test
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          from unittest.mock import patch
          path=Path("scripts/cloudflare-release-control.py")
          spec=importlib.util.spec_from_file_location("zt_release",path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with patch.object(module,"git",return_value="sha1\nsha2\nsha3") as fake:
              assert module.build_count()==3
          changed=["news-one.html","news-two.html","news-three.html","news-four.html","news-five.html"]
          assert module.decide(changed,0)=="publish" # One batched release
          assert module.decide([],0)=="unchanged"  # Zero Pages build
          assert module.decide([],200)=="unchanged"
          assert module.decide(changed,449)=="publish"
          assert module.decide(changed,450)=="block-budget"
          assert module.decide(changed,450,urgent=True)=="publish"
          assert module.decide(changed,475,urgent=True)=="block-budget"
          assert not module.public("scripts/update-youtube-posts.py")
          assert module.public("news-imported-today.html")
          print("PASS: one build for five articles; none for unchanged, 450 scheduled cap, 475 urgent cap")
          print("Actual last-31d Git-trigger changes:",module.build_count())
          PY
