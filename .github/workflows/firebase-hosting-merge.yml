# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.json'
      - '*.xml'
      - '*.txt'
      - '*.png'
      - '*.jpg'
      - '*.webp'
      - 'assets/**'
      - 'scripts/zt_sidebar_mix.py'
      - 'scripts/build-related-content.py'
      - 'scripts/apply-site-design.py'
      - 'scripts/zt_footer.py'
      - '.github/workflows/firebase-hosting-merge.yml'
      - 'firebase.json'
permissions:
  contents: read
  actions: write
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    # Sync/trend/news bots already deploy their changes to Firebase. Do not
    # create a second identical release when those bots commit generated pages.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.event.head_commit.author.name != 'zazoomtek-bot' &&
       github.event.head_commit.author.name != 'github-actions[bot]' &&
       github.event.head_commit.author.name != 'ZazoomTek Editorial Publisher' &&
       github.event.head_commit.author.name != 'ZazoomTek Editorial Layout')
    runs-on: ubuntu-latest
    # Never perform a second independent Firebase release from an old checkout.
    # The canonical latest-main publisher normalizes and verifies all headers.
    steps:
      - name: Queue the single validated, serialized live publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site-live.yml --ref main --repo zazoomtek-coder/zazoomtek-site
