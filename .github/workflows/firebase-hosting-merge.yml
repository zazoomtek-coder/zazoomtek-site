# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.json'
      - '*.xml'
      - '*.txt'
      - '*.png'
      - '*.jpg'
      - '*.webp'
      - 'assets/**'
      - 'scripts/zt_sidebar_mix.py'
      - 'scripts/build-related-content.py'
      - 'scripts/apply-site-design.py'
      - 'scripts/zt_footer.py'
      - '.github/workflows/firebase-hosting-merge.yml'
      - 'firebase.json'
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    # Sync/trend/news bots already deploy their changes to Firebase. Do not
    # create a second identical release when those bots commit generated pages.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.event.head_commit.author.name != 'zazoomtek-bot' &&
       github.event.head_commit.author.name != 'github-actions[bot]' &&
       github.event.head_commit.author.name != 'ZazoomTek Editorial Publisher')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared editorial publishing scripts
        run: python3 -m py_compile scripts/apply-site-design.py scripts/zt_sidebar_mix.py scripts/build-related-content.py scripts/zt_footer.py
      - name: Apply shared layout to all pages
        run: python3 scripts/apply-site-design.py
      - name: Save generated editorial layout in source files
        run: |
          git config user.name "ZazoomTek Editorial Layout"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "layout: preserve canonical sidebars, related articles and Community banners"
            for attempt in 1 2 3; do
              if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                echo "::warning::Could not save layout changes to GitHub; validated Firebase deployment continues."
              fi
              sleep "$((attempt * 3))"
            done
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAZOMTEK }}
          channelId: live
          projectId: zazomtek
