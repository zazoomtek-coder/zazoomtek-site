name: SEO optimizer tests
on:
  push:
    branches:
      - seo-community-metadata
      - fix/strip-editorial-class-from-imported-titles
      - fix/seo-image-metadata-cwv-audit
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test-seo-optimizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile changed Python modules
        run: python -m py_compile tools/editorial_title.py tools/seo_editorial_optimizer.py tools/scheduled_editorial_import.py tools/build.py tools/seo.py tools/article_templates.py tools/editorial_slot_gate.py tools/media_dimensions.py tools/verify_seo.py tools/test_media_dimensions.py tools/web_editorial.py tools/audit_cover_dimensions.py
      - name: Run SEO optimizer unit tests
        working-directory: tools
        run: python -m unittest -v test_seo_editorial_optimizer test_media_dimensions
      - name: Build static site and run integrated SEO audit (no deployment)
        run: python tools/build.py
      - name: Report actual cover dimensions (non-blocking)
        run: python tools/audit_cover_dimensions.py
        continue-on-error: true
