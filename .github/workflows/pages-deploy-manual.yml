name: ZazoomTek - deploy manuale su zazoomtek.it
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  deployments: write
concurrency:
  group: zazoomtek-pages-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_PAGES_BRANCH: main
      CF_PAGES_URL: https://zazoomtek.it
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica configurazione credenziali
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Aggiungi CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nei repository Secrets."
            exit 1
          fi
      - name: Diagnostica e riattiva cron YouTube e pubblicazione se disabilitati
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          repo=os.environ["GH_REPO"]
          for filename in ("editorial-collect.yml","editorial-publish.yml"):
              url=f"https://api.github.com/repos/{repo}/actions/workflows/{filename}"
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=15) as response:
                      info=json.load(response)
                  state=info.get("state")
                  print("AUTOMATION:",filename,"id:",info.get("id"),"state:",state,flush=True)
                  if state in ("disabled_manually","disabled_inactivity"):
                      req=urllib.request.Request(url+"/enable",headers=headers,method="PUT")
                      with urllib.request.urlopen(req,timeout=15) as response:
                          print("REENABLED:",filename,"HTTP",response.status,flush=True)
                  elif state!="active":
                      print("ATTENZIONE: workflow non attivo o non registrato:",filename,flush=True)
              except Exception as exc:
                  print("IMPOSSIBILE VERIFICARE CRON:",filename,type(exc).__name__,str(exc)[:160],flush=True)
          PY
      - name: Backup automatico dell'ULTIMO sito funzionante prima del deploy manuale
        run: python3 tools/release_backup.py backup-manual
      - name: Archivio ZIP ripristinabile del sito precedente
        uses: actions/upload-artifact@v4
        with:
          name: ZazoomTek-BACKUP-PRIMA-DEPLOY-MANUALE
          path: ZazoomTek_WORKING_BACKUP_*.zip
          retention-days: 90
          if-no-files-found: error
      - name: Genera il sito ufficiale
        run: python3 tools/build.py
      - name: Controlla file indispensabili
        run: test -s dist/index.html && test -s dist/sitemap.xml && test -s dist/_routes.json
      - name: Pubblica su zazoomtek-site con Cloudflare Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zazoomtek-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Conferma nuova versione presente sul dominio reale
        run: python3 tools/verify_live_release.py
