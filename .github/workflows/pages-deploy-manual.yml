name: ZazoomTek - deploy manuale su zazoomtek.it
# Deploy the current main site only. Never enable or alter editorial workflows.
on:
  push:
    branches: [main]
    paths:
      - "functions/api/studio/**"
      - "assets/js/studio-v2.js"
      - "tools/studio_v2_build.py"
      - "tools/article_templates.py"
      - "tools/verify_studio_v2.py"
      - "tools/test_studio_api.mjs"
      - ".github/workflows/pages-deploy-manual.yml"
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: zazoomtek-pages-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_PAGES_BRANCH: main
      CF_PAGES_URL: https://zazoomtek.it
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica configurazione credenziali
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Mancano CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID nei repository Secrets."
            exit 1
          fi
      - name: Controlli sintattici e build del sito ufficiale
        run: |
          python3 -m compileall -q tools
          node --check assets/js/studio-v2.js
          node --input-type=module --check < 'functions/api/studio/[[path]].js'
          python3 tools/build.py
      - name: Controlla file indispensabili
        run: test -s dist/index.html && test -s dist/sitemap.xml && test -s dist/news-sitemap.xml && test -s dist/_routes.json
      - name: Pubblica su zazoomtek-site con Cloudflare Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zazoomtek-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verifica le pagine editoriali sul dominio pubblico
        run: python3 tools/verify_editorial_live.py
