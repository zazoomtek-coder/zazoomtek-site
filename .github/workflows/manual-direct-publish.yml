name: ZazoomTek MANUAL - direct main to Cloudflare
# Any owner/editorial commit to main deploys directly. The scheduled Master is not invoked.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zazoomtek-cloudflare-production-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'master:'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh YouTube Community and videos before publishing
        shell: bash
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ZT_FORCE_SYNC: 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          for script in update-youtube-posts.py update-youtube.py; do
            imported=0
            for attempt in 1 2 3; do
              if python3 "scripts/$script"; then imported=1; break; fi
              sleep $((attempt * 20))
            done
            if [ "$imported" -ne 1 ]; then
              echo "::error::YouTube $script failed all three import attempts; do not falsely report a completed update"
              exit 1
            fi
          done
      - name: Build latest main without invoking Master
        run: |
          git fetch origin main
          git checkout main
          ZT_YOUTUBE_LIVE_IMPORTED=1 ZT_RELEASE_SOURCE_SHA="$(git rev-parse HEAD)" python3 scripts/cloudflare-build-site.py
      - name: Deploy directly to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
      - name: Purge Cloudflare cache immediately after successful deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
        run: python3 scripts/cloudflare-purge-after-release.py
