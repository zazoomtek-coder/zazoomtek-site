name: Validate Home Guide and Extra three-card limit (staging only)
on:
  push:
    branches: [fix/home-guide-extra-three-cards-20261018]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exactly 1 big and 2 small items
        run: |
          node --check zt-home-graphic-layout-20261016.js
          python3 scripts/verify-home-layout-lock.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          js=Path('zt-home-graphic-layout-20261016.js').read_text()
          assert js.count('records.slice(1,3)')==1
          assert 'records.slice(1,4)' not in js
          assert js.count('Math.min(records.length,3)')==1
          assert 'Math.min(records.length,4)' not in js
          home=Path('index.html').read_text()
          source=Path('includes/home-guides-inset.html').read_text().strip()
          assert home.count(source)==1, 'Canonical Guide markup must not drift'
          assert source.count('class="zt-home-guide-primary"')==1
          assert source.count('class="zt-home-guide-next"')==2
          assert 'ztp-extra-cards' in Path('zt-home-live.js').read_text(), 'Home runtime must create Extra magazine'
          print('PASS: Home GUIDE/EXTRA exactly 3; unchanged static fallback and layout assets.')
          PY
          git diff --exit-code HEAD -- index.html zt-home-live.js zt-home-graphic-layout-20261016.css zt-home-gap-fix-20261014.css
      - name: Full Cloudflare offline test; no deploy
        run: |
          python3 scripts/cloudflare-build-site.py
          python3 scripts/verify-home-layout-lock.py --packaged
          node --check dist/zt-home-graphic-layout-20261016.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/zt-home-graphic-layout-20261016.js').read_text()
          assert 'records.slice(1,3)' in p and 'records.slice(1,4)' not in p
          assert 'Math.min(records.length,3)' in p and 'Math.min(records.length,4)' not in p
          print('PASS: packaged Cloudflare code publishes exactly 3 Guide/Extra cards.')
          PY
