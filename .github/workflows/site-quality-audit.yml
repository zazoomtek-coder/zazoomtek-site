name: ZazoomTek whole-site quality audit
on:
  workflow_dispatch:
  # Full quality audit stays available manually and on relevant changes.
  push:
    branches: [main]
    paths:
      - 'scripts/site-audit-safe.py'
      - '.github/workflows/site-quality-audit.yml'
      - '.github/workflows/**'
      - 'firebase.json'
      - 'scripts/test_deploy_architecture.py'
      - 'scripts/publish-approved-reviews.py'
      - 'scripts/test_scheduled_review_publication.py'
      - 'editorial/review-publication-queue.json'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify all internal links, local images, article streams and carousel
        run: python3 scripts/site-audit-safe.py
      - name: Guard Firebase architecture against direct deploy regressions
        run: python3 scripts/test_deploy_architecture.py
      - name: Verify importer safeguards without publishing
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/test_review_dedup.py
          python3 scripts/test_video_sync_reliability.py
          python3 scripts/test_community_freshness.py
          python3 scripts/test_scheduled_review_publication.py
          python3 scripts/publish-approved-reviews.py --dry-run
