name: ZazoomTek whole-site quality audit
on:
  workflow_dispatch:
  schedule:
    - cron: '27 12 * * *'
      timezone: 'Europe/Rome'
  push:
    branches: [main]
    paths:
      - 'scripts/site-audit-safe.py'
      - '.github/workflows/site-quality-audit.yml'
      - '.github/workflows/**'
      - 'firebase.json'
      - 'scripts/test_deploy_architecture.py'
      - 'scripts/publish-approved-reviews.py'
      - 'scripts/test_scheduled_review_publication.py'
      - 'editorial/review-publication-queue.json'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify all internal links, local images, article streams and carousel
        run: python3 scripts/site-audit-safe.py
      - name: Verify retired Firebase and direct-main Cloudflare Master
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          workflows=root/'.github/workflows'
          master=(workflows/'master-orchestrator-production.yml').read_text(encoding='utf-8')
          legacy=(workflows/'deploy-site-live.yml').read_text(encoding='utf-8')
          assert 'if: false # Firebase Hosting retired; production is Cloudflare Pages' in legacy
          assert '  push:' not in master.splitlines(), 'Production Master must not publish on push'
          for expected in (
              'workflow_dispatch:',
              "timezone: 'Europe/Rome'",
              "cron: '15 10,15,20 * * *'",
              "cron: '25,40 20 * * *'",
              'contents: write',
              'cancel-in-progress: false',
              'scripts/master-production-gateway.py --publish',
              'cloudflare/wrangler-action@v3',
              'pages deploy dist --project-name=',
              'scripts/verify-live-cloudflare.py',
          ):
              assert expected in master, 'Production Master missing '+expected
          assert not (workflows/'cloudflare-controlled-release.yml').exists()
          hosting=json.loads((root/'firebase.json').read_text(encoding='utf-8')).get('hosting',{})
          assert hosting.get('target')=='zazoomtek' and hosting.get('public')=='.'
          assert '.github/**' in hosting.get('ignore',[])
          print('PASS: Firebase disabled, Master on main and 20:15 recovery configured')
          PY
      - name: Verify importer safeguards without publishing
        run: |
          # The obsolete architecture test is superseded by the workflow check above.
          find scripts -maxdepth 1 -type f -name '*.py' ! -name 'test_deploy_architecture.py' -print0 | xargs -0 python3 -m py_compile
          python3 scripts/zt-import-transaction-guard.py --self-test
          python3 scripts/test_review_dedup.py
          python3 scripts/test_video_sync_reliability.py
          python3 scripts/test_community_freshness.py
          python3 scripts/test_scheduled_review_publication.py
          python3 scripts/publish-approved-reviews.py --dry-run
