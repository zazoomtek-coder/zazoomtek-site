name: ZazoomTek importer transaction reliability - staging only
on:
  push:
    branches: [zt-import-pipeline-reliability-20261018, fix/youtube-community-guard-20261019, fix/cloudflare-home-carousel-guard-20261019]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zt-import-staging
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test import ownership, deduplication and sections
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/zt-import-transaction-guard.py --self-test
          python3 scripts/test_review_dedup.py
          python3 scripts/test_community_category_routing.py
          python3 scripts/test_community_freshness.py
          python3 scripts/test_video_sync_reliability.py
          node scripts/test-home-news-categories.cjs
          python3 scripts/test-featured-today-yesterday.py
          python3 scripts/verify-home-layout-lock.py
      - name: Ensure the real carousel survives and a missing carousel blocks release
        run: |
          python3 scripts/protect-home-structure.py index.html
          python3 - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          import importlib.util
          spec=importlib.util.spec_from_file_location("zt_home_guard","scripts/protect-home-structure.py")
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          check=module.check
          with tempfile.TemporaryDirectory() as tmp:
              release=Path('cloudflare-release-trigger.txt').read_text()
              source=re.search(r'^source_commit=([a-f0-9]{40})
        run: |
          python3 scripts/cloudflare-build-site.py
          python3 scripts/verify-packaged-home.py --root dist
          python3 scripts/verify-home-layout-lock.py --packaged
      - name: Preserve staging snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zt-import-staging-snapshot
          path: dist/
          retention-days: 5
,release,re.M).group(1)
              old=subprocess.check_output(['git','show',source+':index.html']).decode()
              assert 'id="ztFeaturedGrid"' in old and 'id="newsSlider"' not in old
              p=Path(tmp)/'last-good-index.html'
              p.write_text(old)
              check(p)
              p.write_text(old.replace('id="ztFeaturedGrid"','id="newsSlider"',1))
              try: check(p)
              except SystemExit as exc:
                  assert 'news carousel' in str(exc)
              else: raise AssertionError('Missing the real carousel must block release')
          print('PASS: current and last-good Home use the real carousel; damaged Home is blocked')
          PY
      - name: Offline full Cloudflare-equivalent production build
        run: |
          python3 scripts/cloudflare-build-site.py
          python3 scripts/verify-packaged-home.py --root dist
          python3 scripts/verify-home-layout-lock.py --packaged
      - name: Preserve staging snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zt-import-staging-snapshot
          path: dist/
          retention-days: 5
