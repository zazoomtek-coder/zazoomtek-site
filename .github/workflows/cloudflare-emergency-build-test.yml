name: Cloudflare emergency package verification
on:
  push:
    branches: [cloudflare-emergency-final-20261016]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check protected release logic
        run: |
          python3 -m py_compile scripts/cloudflare-build-site.py scripts/build-cloudflare-pages.py scripts/cloudflare-release-control.py
          python3 scripts/cloudflare-release-control.py --self-test
          python3 scripts/test-cloudflare-quota-guard.py
      - name: Build full production-equivalent Cloudflare site
        run: python3 scripts/cloudflare-build-site.py
      - name: Verify public pages, video embeds, site styling, safe deployment boundaries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('dist')
          files=[p for p in root.rglob('*') if p.is_file()]
          size=sum(p.stat().st_size for p in files)
          assert len(files)>=200,(len(files),'Missing site archive')
          assert (root/'index.html').is_file()
          assert (root/'news.html').is_file()
          assert (root/'watch/index.html').is_file()
          assert (root/'zt-design.css').is_file()
          assert (root/'_headers').is_file()
          assert not (root/'scripts').exists()
          assert not (root/'functions').exists()
          assert not (root/'.github').exists()
          assert not (root/'comments.js').exists()
          assert not (root/'firebase.json').exists()
          assert not list(root.rglob('*.mp4'))
          carousel=json.loads((root/'featured-carousel.json').read_text(encoding='utf-8'))['items']
          assert len(carousel)==6
          assert len({x['url'] for x in carousel})==6
          for item in carousel:
              assert (root/item['url'].lstrip('/')).exists()
          print('SITE VALIDATION OK',len(files),'files',round(size/1024**2,2),'MiB')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zazoomtek-cloudflare-emergency-ready
          path: dist/
          retention-days: 3
