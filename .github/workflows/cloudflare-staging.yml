name: ZazoomTek safety staging - exact Cloudflare build, no deploy
on:
  push:
    branches:
      - zt-safety-gates-20261018
      - fix/editorial-boxes-strict-newest-20261018
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zazoomtek-safety-staging
  cancel-in-progress: true
jobs:
  validate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preliminary static and unit checks
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/test-editorial-recency.py
          node --check zt-sidebar-live.js
          python3 scripts/refresh-home-editorial-boxes.py --self-test
          python3 scripts/test-verify-packaged-home.py
          python3 scripts/test_deploy_architecture.py
          python3 scripts/test_review_dedup.py
          python3 scripts/test_community_category_routing.py
          python3 scripts/test_community_freshness.py
          python3 scripts/test_video_sync_reliability.py
          python3 scripts/verify-home-layout-lock.py
      - name: Build full production-equivalent site OFFLINE (no Cloudflare build)
        run: python3 scripts/cloudflare-build-site.py
      - name: Validate actual packaged home and locked layout
        run: |
          python3 scripts/verify-packaged-home.py --root dist
          python3 scripts/verify-home-layout-lock.py --packaged
          python3 scripts/site-audit-safe.py
      - name: Screenshots actual home desktop, tablet and mobile
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright>=1.51,<2'
          python3 -m playwright install --with-deps chromium
          python3 scripts/capture-staging-preview.py --root dist --output staging-screenshots
      - name: Store navigable full site and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zazoomtek-safety-staging-full-site
          path: |
            dist/
            staging-screenshots/
          retention-days: 7
