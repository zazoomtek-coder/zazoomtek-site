name: ZazoomTek - verifica Studio in coda e News Extra (NESSUN DEPLOY)
on:
  push:
    branches:
      - release/zazoomtek-20261029-1930
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica sintassi editor Studio e API
        run: |
          node --check assets/js/studio-v2.js
          node --check --input-type=module < 'functions/api/studio/[[path]].js'
          python3 -m py_compile tools/build.py tools/community_youtube.py tools/scheduled_editorial_import.py tools/studio_v2_build.py tools/editorial_slot_gate.py
      - name: Verifica riconoscimento NEWS EXTRA e pipeline Studio
        run: |
          python3 - <<'PY'
          import sys, pathlib
          sys.path.insert(0,"tools")
          from community_youtube import title_type
          from build import category_for_post
          title="News Extra: Carrera porta la Formula 1 sotto l’albero con nuovi set da corsa high-tech"
          assert title_type(title+"\n\nTesto editoriale")[1]=="news"
          assert category_for_post({"title":title,"type":"news","topic":"tech"})=="extra"
          parser=pathlib.Path("tools/scheduled_editorial_import.py").read_text()
          js=pathlib.Path("assets/js/studio-v2.js").read_text()
          api=pathlib.Path("functions/api/studio/[[path]].js").read_text()
          gate=pathlib.Path("tools/editorial_slot_gate.py").read_text()
          assert "sync_studio_publications()" in parser and "sync_studio_assets()" in parser
          assert "v2-pending" in api and "record,status:\"queued\"" in api
          assert "showArticlePreview(response.record)" in js
          assert "data/studio_posts.json" in gate and "assets/css/spotnews.css" in gate
          print("AUDIT PASS: Carrera EXTRA, Studio queue, live-safe preview, editorial gate")
          PY
      - name: Simula Pubblica e anteprima con API Studio isolata (NO DEPLOY)
        run: node tools/test_studio_queue_contract_20261029.mjs
      - name: Genera interamente il sito SOLO nel runner
        env:
          CF_PAGES_BRANCH: release/zazoomtek-20261029-1930
        run: |
          python3 tools/build.py
          test -s dist/index.html && test -s dist/sitemap.xml && test -s dist/_routes.json
          echo "BUILD E ANTEPRIMA OK; ZERO DEPLOY, ZERO PUSH"
