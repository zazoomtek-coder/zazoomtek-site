name: Staging faithful smaller header logo
on:
  push:
    branches:
      - seo/header-logo-payload-20261014
    paths:
      - 'scripts/seo_header_logo_safe.py'
      - 'scripts/test_seo_header_logo_safe.py'
      - '.github/workflows/perf-header-logo-stage.yml'
      - '.github/workflows/deploy-site-live.yml'
permissions:
  contents: write
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image comparison dependency for ONE-TIME logo creation
        run: python3 -m pip install -q 'Pillow>=10,<13'
      - name: Run only-header-logos regression tests
        run: python3 scripts/test_seo_header_logo_safe.py
      - name: Make small faithful original-color PNG for public header
        run: python3 scripts/seo_header_logo_safe.py --build-only
      - name: Verify no HTML files were edited and source logo remained unchanged
        run: |
          python3 scripts/seo_header_logo_safe.py --check
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import sys
          sys.path.insert(0,'scripts')
          from seo_header_logo_safe import asset_current
          root=Path('.').resolve()
          assert asset_current(root)
          a=root/'ChatGPT.png'
          b=root/'assets/zt-header-logo-128.png'
          assert b.stat().st_size < a.stat().st_size*0.6
          with Image.open(b) as im:
            assert im.width<=128 and im.height<=128
          assert (root/'index.html').read_text().count('src="ChatGPT.png"')>0
          print('PASS faithfully smaller header logo:',a.stat().st_size,'=>',b.stat().st_size,'bytes')
          PY
      - name: Commit only the derived logo and source fingerprint to staging branch
        run: |
          set -e
          git add -- assets/zt-header-logo-128.png assets/zt-header-logo-128.sha256
          if ! git diff --cached --quiet; then
            git config user.name "ZazoomTek SEO asset builder"
            git config user.email "seo-asset-builder@users.noreply.github.com"
            git commit -m "perf(asset): prebuild 128px header logo, original unchanged"
            git push origin HEAD:seo/header-logo-payload-20261014
          fi
          git status --short
