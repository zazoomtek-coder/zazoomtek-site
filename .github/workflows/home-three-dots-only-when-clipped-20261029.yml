name: Anteprima Home puntini corretti SOLO su titoli tagliati (NO DEPLOY)
on:
  push:
    branches:
      - fix/home-true-ellipsis-only-when-clipped-20261029
permissions:
  contents: read
jobs:
  verify-and-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-true-ellipsis-only-when-clipped-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript source and Python syntax
        run: |
          node --check assets/js/site.js
          python3 -m py_compile tools/build.py tools/test_home_three_dots_only_if_cut_20261029.py
      - name: Import actual editorial data only into preview runner
        run: |
          git fetch --no-tags origin editorial-queue
          python3 tools/scheduled_editorial_import.py
      - name: Build actual full site WITHOUT DEPLOY
        env:
          CF_PAGES_BRANCH: fix/home-true-ellipsis-only-when-clipped-20261029
        run: |
          python3 tools/build.py
          test -s dist/index.html && test -s dist/sitemap.xml
      - name: Real Chrome desktop/mobile verification of conditional literal three-dot ellipsis
        run: python3 tools/test_home_three_dots_only_if_cut_20261029.py
      - name: Package complete offline site, no nested ZIP
        run: |
          python3 tools/package_offline_preview.py
          mv ZazoomTek_SpotNews_Anteprima_Mobile_Footer_28-10-2026.zip ZazoomTek_HOME_3PUNTINI_SOLO_SE_TAGLIATO_29-10-2026.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('ZazoomTek_HOME_3PUNTINI_SOLO_SE_TAGLIATO_29-10-2026.zip')
          with zipfile.ZipFile(p,'a',compression=zipfile.ZIP_DEFLATED) as z:
           z.writestr('LEGGIMI_HOME_PUNTINI.txt',
            'ZAZOOMTEK HOME: massimo 2 righe per titolo, tre puntini ... soltanto sui titoli realmente troncati.\n'
            'I titoli completi non hanno puntini aggiunti; font e box editoriali invariati.\n'
            'Estrai tutto il file ZIP e apri index.html (o VISTA_SMARTPHONE.html).\n'
            'Nessun deploy effettuato. Le funzioni server di Studio non funzionano offline.\n')
          with zipfile.ZipFile(p) as z:
           names=set(z.namelist())
           assert len(names)>280,len(names)
           assert {'index.html','VISTA_SMARTPHONE.html','assets/js/site.js','assets/css/spotnews.css'}<=names
           assert 'fitHomeTitles' in z.read('assets/js/site.js').decode('utf-8')
           assert not any(n.endswith('.zip') for n in names)
           assert z.testzip() is None
          print('COMPLETE ZIP VERIFIED',len(names),'files;',p.stat().st_size,'bytes; ZERO DEPLOY')
          PY
      - name: Upload offline ZIP only
        uses: actions/upload-artifact@v4
        with:
          name: ZazoomTek-HOME-3PUNTINI-SOLO-TAGLIATI-29-10-2026
          path: ZazoomTek_HOME_3PUNTINI_SOLO_SE_TAGLIATO_29-10-2026.zip
          if-no-files-found: error
          retention-days: 30
