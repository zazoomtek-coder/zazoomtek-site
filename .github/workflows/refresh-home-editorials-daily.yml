name: Refresh ZazoomTek Home editorial boxes every three hours
on:
  schedule:
    - cron: '12 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-home-editorials-daily.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: zazoomtek-editorial-home-refresh
  cancel-in-progress: false
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run fully guarded automatic news refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/refresh-home-editorial-boxes.py
          git config user.name "ZazoomTek Editorial Publisher"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          updated=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/refresh-home-editorial-boxes.py --self-test
            python3 scripts/refresh-home-editorial-boxes.py
            git add index.html zt-home-live.js
            if git diff --cached --quiet; then
              echo "Editorial Home is already fresh for Italy's current date."
              exit 0
            fi
            git commit -m "Refresh published Home editorial boxes from real fresh articles"
            if git push origin HEAD:main; then
              echo "Published refreshed editorial data into canonical Home source."
              updated=1
              break
            fi
            echo "Concurrent edit happened; reconcile with current main and re-run."
            sleep 3
          done
          if [ "$updated" != 1 ]; then
            echo "::error::Unable to update Home without overwriting another workflow"
            exit 1
          fi
          gh workflow run deploy-site-live.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Queued serialized Firebase live deploy; site styles and video widgets unchanged."
