name: ZazoomTek - YouTube importazione e pubblicazione indipendente

# Pipeline separata dal Cloudflare Cron e dal workflow editorial-publish.yml.
# GitHub Scheduler avvia direttamente questa pipeline; il vecchio Worker
# non viene modificato e non è necessario per l'importazione/pubblicazione.
on:
  schedule:
    # Frequenza di controllo nelle finestre italiane (inverno + estate).
    # editorial_slot_gate.py autorizza esclusivamente 12:30, 16:00 e 19:30 Europe/Rome.
    - cron: "*/5 10,11,12,14,15,16,17,18,19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: zazoomtek-youtube-independent-production
  cancel-in-progress: false

jobs:
  youtube-import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_PAGES_BRANCH: main
      CF_PAGES_URL: https://zazoomtek.it
    steps:
      - name: Checkout esclusivo di main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ambiente Python e Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controlli sintattici prima dell'importazione
        run: |
          python3 -m compileall -q tools
          node --check assets/js/site.js
          node --check assets/js/studio-v2.js
          node --input-type=module --check < 'functions/api/studio/[[path]].js'

      - name: Recupera la coda editoriale senza renderla obbligatoria
        run: git fetch --no-tags origin editorial-queue || echo "Coda non disponibile: prosegue l'importazione diretta da YouTube"

      - name: IMPORTAZIONE YouTube video, Community e fonti RSS
        run: python3 tools/scheduled_editorial_import.py

      - name: Verifica se esistono aggiornamenti da pubblicare nello slot
        run: python3 tools/editorial_slot_gate.py prepare

      - name: Build del sito con i dati appena importati
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: python3 tools/build.py

      - name: Verifica integrità della build
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: |
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/news-sitemap.xml
          test -s dist/robots.txt
          test -s dist/_routes.json
          test -s dist/BingSiteAuth.xml
          cmp -s BingSiteAuth.xml dist/BingSiteAuth.xml

      - name: Autorizza esclusivamente lo slot italiano previsto
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: python3 tools/editorial_slot_gate.py authorize

      - name: Registra i dati importati su main senza avviare deploy automatici
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        run: |
          git add data/community_imported.json data/videos.json data/web.json data/studio_posts.json data/studio_overrides.json
          if test -d assets/uploads; then git add -A assets/uploads; fi
          if ! git diff --cached --quiet; then
            git config user.name "ZazoomTek YouTube Pipeline"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[CF-Pages-Skip] YouTube import indipendente - slot autorizzato"
            git push origin HEAD:main
          else
            echo "Nessuna modifica dati: prosegue la pubblicazione delle modifiche già presenti in main."
          fi

      - name: DEPLOY produzione Cloudflare Pages
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zazoomtek-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verifica online articoli Studio e post Community
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        run: python3 tools/verify_editorial_live.py

      - name: Registra la ricevuta solo dopo deploy e verifica riusciti
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        run: |
          python3 tools/editorial_slot_gate.py stamp
          git add data/editorial_release_state.json
          git config user.name "ZazoomTek YouTube Pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[CF-Pages-Skip] Ricevuta pipeline YouTube indipendente"
          git push origin HEAD:main
