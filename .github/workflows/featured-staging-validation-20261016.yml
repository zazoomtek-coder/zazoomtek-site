name: Temporary five-Tech featured staging validation
on:
  push:
    branches:
      - featured-5tech-1gaming-manual-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile scripts/trending-crosscheck.py scripts/featured-editor.py scripts/site-audit-safe.py scripts/apply-standard-news-featured.py
      - name: Check ordinary-news daily publisher leaves featured grid untouched
        run: python3 scripts/apply-standard-news-featured.py
      - name: Regression test 5 Tech 1 Gaming and manual pin policy
        run: |
          python3 scripts/trending-crosscheck.py --test
          python3 scripts/featured-editor.py --test
      - name: Test that editorial pins displace only the oldest Tech candidates
        run: |
          python3 - <<'PY'
          import importlib.util,json
          from pathlib import Path
          config=Path('featured-editorial-pins.json')
          original=config.read_text(encoding='utf-8')
          spec=importlib.util.spec_from_file_location('matcher',Path('scripts/trending-crosscheck.py'))
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          pinned=[
              {'section':'tech-impact',
               'url':'/tech-impact-la-via-francese-all-intelligenza-artificiale-parigi-punta-sull-asse-nvidia-mistral.html',
               'title':"La via francese all'Intelligenza Artificiale: Parigi punta sull'asse Nvidia-Mistral",
               'image':'/assets/special/tech-impact-la-via-francese-all-intelligenza-artificiale-parigi-punta-sull-asse-nvidia-mistral.webp'},
              {'section':'gaming-inside',
               'url':'/gaming-inside-steam-nuovo-record-storico-di-traffico-e-utenti-simultanei-nel-2026.html',
               'title':'Steam: nuovo record storico di traffico e utenti simultanei nel 2026',
               'image':'/assets/special/gaming-inside-steam-nuovo-record-storico-di-traffico-e-utenti-simultanei-nel-2026.webp'}
          ]
          candidates=m.matches(m.owned_candidates(),{'items':[]})
          try:
              for n in (0,1,2):
                  config.write_text(json.dumps({'items':pinned[:n]},ensure_ascii=False),encoding='utf-8')
                  chosen=m.pick(candidates)
                  assert [a['section'] for a in chosen]==['tech']*(5-n)+['gaming']+[a['section'] for a in pinned[:n]],(n,chosen)
                  assert len({a['url'] for a in chosen})==6
                  for pin in pinned[:n]:
                      assert sum(a['url']==pin['url'] for a in chosen)==1
                  print(f'PASS: {n} fixed special articles, {5-n} Tech, 1 Gaming')
          finally:
              config.write_text(original,encoding='utf-8')
          PY
      - name: Verify six published-card source references
        run: |
          python3 - <<'PY'
          import importlib.util,json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('matcher',Path('scripts/trending-crosscheck.py'))
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          selected=json.loads(Path('featured-carousel.json').read_text(encoding='utf-8'))['items']
          assert [x['section'] for x in selected]==['tech']*5+['gaming']
          assert len(set(x['url'] for x in selected))==6
          for item in selected:
              assert Path(item['url'].lstrip('/')).is_file()
              if item['image'].startswith('/'):
                  assert Path(item['image'].lstrip('/')).is_file()
          assert m.editorial_pins()==[]
          print('PASS: Six valid highlights, no automatic specials')
          PY
