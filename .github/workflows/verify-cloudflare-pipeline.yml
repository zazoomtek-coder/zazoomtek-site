name: Verify Cloudflare release pipeline (no deployment)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-controlled-release.yml'
      - '.github/workflows/verify-cloudflare-pipeline.yml'
      - 'scripts/cloudflare-release-control.py'
      - 'scripts/cloudflare-build-site.py'
      - 'scripts/verify-live-cloudflare.py'
      - 'scripts/build-cloudflare-pages.py'
  pull_request:
    paths:
      - '.github/workflows/cloudflare-controlled-release.yml'
      - 'scripts/cloudflare-release-control.py'
      - 'scripts/cloudflare-build-site.py'
      - 'scripts/verify-live-cloudflare.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Compile release scripts without creating any Pages build
        run: |
          python3 -m py_compile scripts/cloudflare-release-control.py \
            scripts/cloudflare-build-site.py scripts/build-cloudflare-pages.py \
            scripts/verify-live-cloudflare.py
          python3 scripts/cloudflare-release-control.py --self-test
          python3 scripts/verify-live-cloudflare.py --self-test
          echo "Release script syntax and budget guard validated; NO deployment requested."
