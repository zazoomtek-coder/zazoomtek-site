name: ZazoomTek structural source syntax
on:
  pull_request:
    paths:
      - 'services10/**'
      - 'studio/layouts.js'
      - 'zt-master-*.js'
      - '.github/workflows/zt-source-syntax.yml'
permissions:
  contents: read
jobs:
  source-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Python generation modules
        run: |
          python -m py_compile services10/01-community.py services10/03-home.py services10/04-in-evidenza.py services10/05-da-non-perdere.py services10/07-recensioni.py services10/15-master-structural.py
      - name: Parse shared JavaScript templates
        run: |
          node --check studio/layouts.js
          node --check zt-master-template.js
          node --check zt-release-menu.js
      - name: Build self-contained snapshot without Cloudflare
        run: |
          python3 services10/09-layout.py
          python3 services10/15-master-structural.py --module news
          python3 services10/15-master-structural.py --module home
          python3 services10/15-master-structural.py --module layout
      - name: Verify real rendered pages have menu and article related boxes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from re import search
          dist=Path("dist")
          assert (dist/"index.html").is_file()
          assert (dist/"ecoturismo.html").is_file()
          assert 'href="/ecoturismo.html"' in (dist/"index.html").read_text(encoding="utf-8")
          pages=[p for p in dist.glob("news-*.html") if p.is_file()]
          assert pages, "No real generated Community news to check"
          checked=0
          for path in pages[:8]:
              text=path.read_text(encoding="utf-8")
              assert "zt-master-header" in text, path
              assert "zt-master-rail" in text, path
              assert "ARTICOLI CORRELATI" in text, path
              assert "zt-master-card" in text, path
              checked+=1
          print("Real saved pages with Master menu and thumbnail related links:",checked)
          PY
