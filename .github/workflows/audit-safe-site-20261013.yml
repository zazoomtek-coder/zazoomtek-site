name: Read-only ZazoomTek whole-site audit
on:
  push:
    branches: [audit-safe-site-20261013]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run whole-site read-only audit
        run: python3 scripts/site-audit-safe.py
      - name: Regression test previously failed standard-news publisher
        run: |
          cp index.html /tmp/zazoomtek-home-before.html
          python3 scripts/apply-standard-news-featured.py
          cp index.html /tmp/zazoomtek-home-after.html
          python3 scripts/apply-standard-news-featured.py
          python3 - <<'PY'
          from pathlib import Path
          before=Path('/tmp/zazoomtek-home-before.html').read_text()
          after=Path('/tmp/zazoomtek-home-after.html').read_text()
          again=Path('index.html').read_text()
          def featured(s):return s.split('<!-- FEATURED_NEWS_START -->',1)[1].split('<!-- FEATURED_NEWS_END -->',1)[0]
          assert featured(before)==featured(after)==featured(again),'Carousel was changed!'
          assert after==again,'Publisher is not idempotent'
          assert after.count('<!-- ARTICLE_FEED_START -->')==1
          print('PASS: special 1+1 data accepted; original carousel unchanged; no duplicate Home news')
          PY
      - name: Test existing importers without publishing
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/test_review_dedup.py
          python3 scripts/test_video_sync_reliability.py
          python3 scripts/test_community_freshness.py
