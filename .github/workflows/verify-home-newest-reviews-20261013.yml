name: Verify newest real reviews on Home
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-home-newest-reviews-20261013.yml'
      - 'scripts/refresh-home-latest-reviews.py'
      - 'scripts/update-youtube-posts.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and regenerate five genuine review cards offline
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/update-youtube-posts.py scripts/refresh-home-latest-reviews.py
          python3 scripts/refresh-home-latest-reviews.py --check
          python3 - <<'PY'
          from pathlib import Path
          import re,html
          text=Path('index.html').read_text()
          reviews=text.split('<!-- HOME_LATEST_REVIEWS_MAIN_START -->',1)[1].split('<!-- HOME_LATEST_REVIEWS_MAIN_END -->',1)[0]
          cards=re.findall(r'<article class="video-card zt-review-card">.*?</article>',reviews,re.S)
          assert len(cards)==5,len(cards)
          urls=re.findall(r'<a class="video-thumb zt-review-thumb" href="([^"]+)"',reviews)
          assert len(urls)==5 and len(set(urls))==5,urls
          assert urls[0]=='/poly-fighter-recensione-pc.html',urls
          assert all(Path(u.lstrip('/')).is_file() for u in urls)
          assert all('<img src=' in c for c in cards)
          print('PASS Poly Fighter is first; five real clickable review cards, original Home structure intact')
          PY
      - name: Verify public deployed Home agrees with the approved newest-review source
        run: |
          python3 - <<'PY'
          import time,urllib.request,re
          url='https://zazoomtek.it/?newestreviews=20261013'
          for retry in range(24):
              try:
                  req=urllib.request.Request(url+'&r='+str(retry),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=20) as res: text=res.read().decode('utf-8','replace')
                  zone=text.split('<!-- HOME_LATEST_REVIEWS_MAIN_START -->',1)[1].split('<!-- HOME_LATEST_REVIEWS_MAIN_END -->',1)[0]
                  urls=re.findall(r'<a class="video-thumb zt-review-thumb" href="([^"]+)"',zone)
                  print('Public attempt',retry,'first latest review:',urls[0] if urls else None)
                  if len(urls)==5 and urls[0]=='/poly-fighter-recensione-pc.html':
                      print('PASS public Home newest reviews: Poly Fighter first, five links')
                      break
              except Exception as e:
                  print('Temporary deployment wait:',repr(e))
              if retry==23:raise AssertionError('Public Home has not deployed newest Poly Fighter review')
              time.sleep(5)
          PY
