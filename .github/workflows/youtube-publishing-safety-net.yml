name: YouTube publishing safety net
# Independent Firebase recovery: runs even when trend/related/analytics fail.
# Does not import, rewrite, approve, or commit YouTube content.
on:
  workflow_dispatch:
  schedule:
    - cron: '48 * * * *'
    # Independent 10-minute backstop for GitHub's sometimes-delayed */5 timer.
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: youtube-firebase-recovery
  cancel-in-progress: false
jobs:
  check-import-freshness:
    # Avoid unnecessary runs of the importer if its own timer worked recently.
    if: github.event_name == 'schedule' && github.event.schedule == '7,17,27,37,47,57 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger overdue YouTube Community import
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime,json,os,subprocess
          repo=os.environ['REPOSITORY']
          response=subprocess.run(
              ['gh','run','list','--repo',repo,'--workflow','youtube-sync.yml',
               '--limit','12','--json','createdAt,status,conclusion'],
              check=True,capture_output=True,text=True)
          runs=json.loads(response.stdout)
          now=datetime.datetime.now(datetime.timezone.utc)
          recent=False
          for entry in runs:
              stamp=datetime.datetime.fromisoformat(entry['createdAt'].replace('Z','+00:00'))
              if stamp>=now-datetime.timedelta(minutes=9):
                  recent=True
                  break
          if recent:
              print('Primary 5-minute YouTube import recently started: no duplicate dispatch.')
          else:
              print('YouTube import overdue: dispatching independent recovery sync now.')
              subprocess.run(
                  ['gh','workflow','run','youtube-sync.yml','--repo',repo,'--ref','main'],check=True)
          PY
  deploy-last-good:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '48 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Read newest committed site without running editorial builders
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Verify Community and video state before Firebase deployment
        run: |
          python3 scripts/validate-sync-output.py community
          python3 scripts/validate-sync-output.py videos
          python3 - <<'PY'
          from pathlib import Path
          index=Path("index.html").read_text(encoding="utf-8")
          assert '<!-- FEATURED_NEWS_START -->' in index
          assert '<!-- ARTICLE_FEED_START -->' in index
          assert '<!-- HOME_LATEST_REVIEWS_MAIN_START -->' in index
          print("Latest good import passes publication checks; redeploying untouched site.")
          PY
      - name: Queue recovery via the single live deployment pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site-live.yml --ref main
