name: YouTube publishing safety net
# Independent Firebase recovery: runs even when trend/related/analytics fail.
# Does not import, rewrite, approve, or commit YouTube content.
on:
  workflow_dispatch:
  schedule:
    - cron: '48 * * * *'
    # Independent 5-minute watchdog, offset two minutes from the primary */5 schedule.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: youtube-firebase-recovery
  cancel-in-progress: false
jobs:
  check-import-freshness:
    # Avoid unnecessary runs of the importer if its own timer worked recently.
    if: github.event_name == 'schedule' && github.event.schedule == '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger overdue YouTube Community import
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime,json,os,subprocess
          repo=os.environ['REPOSITORY']
          response=subprocess.run(
              ['gh','run','list','--repo',repo,'--workflow','youtube-sync.yml',
               '--limit','12','--json','createdAt,status,conclusion'],
              check=True,capture_output=True,text=True)
          runs=json.loads(response.stdout)
          now=datetime.datetime.now(datetime.timezone.utc)
          recent=False
          for entry in runs:
              stamp=datetime.datetime.fromisoformat(entry['createdAt'].replace('Z','+00:00'))
              age=(now-stamp).total_seconds()/60
              status=entry.get('status')
              conclusion=entry.get('conclusion')
              if status=='in_progress':
                  recent=True  # Never dispatch a competing importer while one is running.
                  break
              if age<8 and status in ('queued','pending','requested','waiting'):
                  recent=True  # Allow GitHub a short start-up window without duplicate dispatch.
                  break
              if age<7 and status=='completed' and conclusion=='success':
                  recent=True
                  break
          if recent:
              print('Healthy recent YouTube sync already exists; no extra dispatch.')
          else:
              print('No recent healthy YouTube sync (missing, failed or cancelled); retrying now.')
              subprocess.run(
                  ['gh','workflow','run','youtube-sync.yml','--repo',repo,'--ref','main'],check=True)
          PY
  verify-publication:
    # A green importer run does not prove that Firebase serves the new article.
    if: github.event_name == 'schedule' && github.event.schedule == '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check fresh article URLs against public Firebase and request recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import re,time,urllib.request,urllib.error,subprocess
          from pathlib import Path
          content=Path('index.html').read_text(encoding='utf-8')
          area=content.split('<!-- ARTICLE_FEED_START -->',1)[-1].split('<!-- ARTICLE_FEED_END -->',1)[0]
          recent=re.findall(r'<a href="(news-[^"]+\.html)"',area)[:3]
          if not recent:
              print('No archive links found for public freshness check.')
              raise SystemExit(1)
          missing=[]
          for path in recent:
              req=urllib.request.Request('https://zazoomtek.it/'+path,headers={'User-Agent':'ZazoomTek-publication-watchdog/1.0','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=12) as response:
                      body=response.read(4000)
                      if response.status!=200 or b'<html' not in body.lower():
                          missing.append(path)
              except (urllib.error.URLError,TimeoutError) as exc:
                  print('Public check failed:',path,str(exc))
                  missing.append(path)
          if not missing:
              print('PASS: latest three article URLs are available publicly.')
              raise SystemExit(0)
          print('::warning::Some committed news are not publicly reachable:',missing)
          runs=subprocess.run(['gh','run','list','--workflow','deploy-site-live.yml','--limit','5','--json','status','conclusion','createdAt'],check=True,capture_output=True,text=True)
          import json,datetime
          now=datetime.datetime.now(datetime.timezone.utc)
          for run in json.loads(runs.stdout):
              age=(now-datetime.datetime.fromisoformat(run['createdAt'].replace('Z','+00:00'))).total_seconds()/60
              if run['status'] in ('in_progress','queued','pending','waiting') and age<18:
                  print('Firebase deployment already underway; not dispatching a duplicate.')
                  raise SystemExit(0)
          subprocess.run(['gh','workflow','run','deploy-site-live.yml','--ref','main'],check=True)
          print('::warning::Recovery deploy queued for missing live news.')
          PY
  deploy-last-good:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '48 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Read newest committed site without running editorial builders
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Verify Community and video state before Firebase deployment
        run: |
          python3 scripts/validate-sync-output.py community
          python3 scripts/validate-sync-output.py videos
          python3 - <<'PY'
          from pathlib import Path
          index=Path("index.html").read_text(encoding="utf-8")
          assert '<!-- FEATURED_NEWS_START -->' in index
          assert '<!-- ARTICLE_FEED_START -->' in index
          assert '<!-- HOME_LATEST_REVIEWS_MAIN_START -->' in index
          print("Latest good import passes publication checks; redeploying untouched site.")
          PY
      - name: Queue recovery via the single live deployment pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site-live.yml --ref main
