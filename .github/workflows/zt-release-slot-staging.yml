name: Master release slots — scheduled and manual safety (staging only)
on:
  push:
    branches: [main]
    paths:
      - scripts/cloudflare-release-control.py
      - scripts/master-production-gateway.py
      - scripts/process-approved-release-queue.py
      - editorial/approved-release-queue.json
      - scripts/test_deploy_architecture.py
      - .github/workflows/master-orchestrator-production.yml
      - .github/workflows/zt-release-slot-staging.yml
  pull_request:
    paths:
      - scripts/cloudflare-release-control.py
      - scripts/master-production-gateway.py
      - scripts/process-approved-release-queue.py
      - editorial/approved-release-queue.json
      - scripts/test_deploy_architecture.py
      - .github/workflows/master-orchestrator-production.yml
      - .github/workflows/zt-release-slot-staging.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-slot-staging
  cancel-in-progress: true
jobs:
  verify-release-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Master scheduled release windows, manual dispatch, dedupe and budget guards
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare-release-control.py scripts/protect-home-structure.py scripts/verify-home-layout-lock.py
          python3 scripts/cloudflare-release-control.py --self-test
          python3 -m py_compile scripts/process-approved-release-queue.py scripts/master-json-renderer.py scripts/master-orchestrator.py
          python3 scripts/process-approved-release-queue.py --self-test
          python3 scripts/test_deploy_architecture.py
          python3 scripts/verify-live-cloudflare.py --self-test
          python3 scripts/protect-home-structure.py index.html
          python3 scripts/verify-home-layout-lock.py
          python3 - <<'PY'
          from pathlib import Path
          schedule=Path(".github/workflows/master-orchestrator-production.yml").read_text()
          gate=Path("scripts/cloudflare-release-control.py").read_text()
          gateway=Path("scripts/master-production-gateway.py").read_text()
          assert "workflow_dispatch:" in schedule
          assert "timezone: 'Europe/Rome'" in schedule
          assert "cron: '15 10,15,20 * * *'" in schedule
          assert "cron: '45 12 * * *'" in schedule and "cron: '45 17 * * *'" in schedule
          assert "cron: '25,40 20 * * *'" in schedule
          assert "2026-10-22" in schedule and "45 17 * * *" in schedule
          assert 'Owner postponed the 17:45 slot to 20:15' in schedule
          assert "cancel-in-progress: false" in schedule
          assert "zazoomtek-master-sole-repository-and-pages-writer" in schedule
          assert "contents: write" in schedule
          assert "master-production-gateway.py --publish" in schedule
          assert "master-production-gateway.py --publish --urgent" not in schedule
          assert 'steps.master_release.outputs.deploy == \'true\'' in schedule
          assert "steps.recovery.outputs.mode == 'retry_deploy'" in schedule
          assert "Cloudflare" in schedule and "cloudflare/wrangler-action@v3" in schedule
          assert "pages deploy dist --project-name=" in schedule
          assert "scripts/verify-live-cloudflare.py" in schedule
          assert "if current and len(expected)==40" in schedule
          assert 'mode=\'skip\'' in schedule
          assert 'mode=\'retry_deploy\'' in schedule
          assert 'gate = "--urgent" if urgent else "--scheduled-slot"' in gateway
          assert "scripts/cloudflare-release-control.py" in gateway
          assert "slot_utc=" in gate
          assert "RESERVE_SCHEDULED=450" in gate and "RESERVE_URGENT=475" in gate
          assert "already_released_in_slot" in gate
          assert not Path(".github/workflows/cloudflare-controlled-release.yml").exists()
          print("PASS: actual 5 Italian scheduled slots, postponed 17:45, conditional 20:15 recovery, direct deployment, Git serialization and verification")
          PY
      - name: Verify complete Cloudflare-equivalent production build offline
        run: |
          set -euo pipefail
          python3 scripts/cloudflare-build-site.py
          python3 scripts/verify-packaged-home.py --root dist
          python3 scripts/verify-home-layout-lock.py --packaged
          python3 scripts/protect-home-structure.py dist/index.html
      - name: Preserve staging snapshot without deploying
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-release-slots-staging
          path: dist/
          retention-days: 3
