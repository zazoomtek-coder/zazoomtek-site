name: Release slots — scheduled publication safety (staging only)
on:
  push:
    branches: [main, fix/cloudflare-fixed-publishing-slots-20261019]
    paths:
      - scripts/cloudflare-release-control.py
      - .github/workflows/cloudflare-controlled-release.yml
      - .github/workflows/zt-release-slot-staging.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-slot-staging
  cancel-in-progress: true
jobs:
  verify-release-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test scheduled two-hour release windows, dedupe and quota safeguards
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare-release-control.py scripts/protect-home-structure.py scripts/verify-home-layout-lock.py
          python3 scripts/cloudflare-release-control.py --self-test
          python3 scripts/verify-live-cloudflare.py --self-test
          python3 scripts/protect-home-structure.py index.html
          python3 scripts/verify-home-layout-lock.py
          python3 - <<'PY'
          from pathlib import Path
          schedule=Path(".github/workflows/cloudflare-controlled-release.yml").read_text()
          gate=Path("scripts/cloudflare-release-control.py").read_text()
          assert "cron: '17,47 * * * *'" in schedule
          assert "cloudflare-release-control.py --scheduled-slot" in schedule
          assert 'GITHUB_EVENT_NAME" = "schedule"' in schedule
          assert "cloudflare-release-control.py --urgent" in schedule
          assert "--dedupe-hour" not in schedule
          assert "COOLDOWN_MINUTES" not in gate
          assert "slot_utc=" in gate
          assert "RESERVE_SCHEDULED=450" in gate and "RESERVE_URGENT=475" in gate
          assert "python3 scripts/cloudflare-build-site.py" in schedule
          assert "scripts/protect-home-structure.py dist/index.html" in schedule
          assert "scripts/verify-live-cloudflare.py --source-commit" in schedule
          print("PASS: fixed release slot, retries, build budgets, Home protection and live verification")
          PY
      - name: Verify complete Cloudflare-equivalent production build offline
        run: |
          set -euo pipefail
          python3 scripts/cloudflare-build-site.py
          python3 scripts/verify-packaged-home.py --root dist
          python3 scripts/verify-home-layout-lock.py --packaged
          python3 scripts/protect-home-structure.py dist/index.html
      - name: Preserve staging snapshot without deploying
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-release-slots-staging
          path: dist/
          retention-days: 3
