name: Whole site SEO content analysis
on:
  push:
    branches:
      - seo/complete-site-metadata-20261014
    paths:
      - 'scripts/seo_whole_site_audit.py'
      - 'scripts/test_seo_whole_site_audit.py'
      - '.github/workflows/seo-whole-site-stage.yml'
      - '.github/workflows/deploy-site-live.yml'
      - 'scripts/seo_concise_metadata_safe.py'
      - 'scripts/test_seo_concise_metadata_safe.py'
      - 'scripts/seo_generic_article_headline_safe.py'
      - 'scripts/test_seo_generic_article_headline_safe.py'
      - 'scripts/seo_paginated_h1_safe.py'
      - 'scripts/test_seo_paginated_h1_safe.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Test SEO scanner with future nested category
        run: python3 scripts/test_seo_whole_site_audit.py
      - name: Audit current site without modification
        run: python3 scripts/seo_whole_site_audit.py --output "$RUNNER_TEMP/whole-seo.json"
      - name: Test metadata-only normalization and safety
        run: |
          python3 scripts/test_seo_concise_metadata_safe.py
          python3 scripts/seo_concise_metadata_safe.py --check
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from seo_concise_metadata_safe import build
          changes,stats=build(Path('.'))
          assert stats['pages']>=500 and stats['changed_pages']>300,stats
          for path,revised in changes.items():
              previous=path.read_text(encoding='utf-8',errors='replace')
              assert previous.split('</head>',1)[1]==revised.split('</head>',1)[1]
          print('PASS sitewide SEO condensed metadata without any body/layout changes:',stats)
          PY
      - name: Verify factual generic headlines without touching article paragraphs
        run: |
          python3 scripts/test_seo_generic_article_headline_safe.py
          python3 scripts/seo_generic_article_headline_safe.py --check
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from seo_generic_article_headline_safe import build
          changes,pages=build(Path('.'))
          assert pages>=500
          assert 15 <= len(changes) <= 45,len(changes)
          print('PASS unique truthful article H1 and metadata candidates:',len(changes))
          PY
      - name: Test and stage all proposed SEO changes without publishing
        run: |
          python3 scripts/test_seo_paginated_h1_safe.py
          python3 scripts/seo_paginated_h1_safe.py --check
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from seo_paginated_h1_safe import build
          changes=build(Path('.'))
          assert len(changes)==4,sorted(str(x) for x in changes)
          print('PASS semantic archive H1 upgraded with original homepage heading style',len(changes))
          PY
          python3 scripts/seo_generic_article_headline_safe.py
          python3 scripts/seo_paginated_h1_safe.py
          python3 scripts/seo_concise_metadata_safe.py
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from seo_whole_site_audit import audit
          data=audit(Path('.'))
          print('POST-SEO COUNTS',data['finding_counts'])
          print('HIGH PRIORITY',data['priority_findings'])
          print('BROKEN-LINK CANDIDATES',data['missing_targets'][:22])
          assert data['canonical_pages']>=540
          assert data['finding_counts'].get('h1_count',0)<=1
          assert data['finding_counts'].get('title_length',0)<70
          assert data['finding_counts'].get('description_length',0)<95
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: whole-site-seo-findings
          path: ${{ runner.temp }}/whole-seo.json
          retention-days: 7
