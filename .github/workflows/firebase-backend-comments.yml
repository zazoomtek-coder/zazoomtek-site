name: Deploy Firebase comments and private traffic counters

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      # Hosting-only changes do not require rebuilding the Docker image of commentsApi.
      # Deploy backend manually if its Firebase function configuration changes.
      - '.github/workflows/firebase-backend-comments.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-comments-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Functions dependencies
        run: npm install --prefix functions --omit=dev

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAZOMTEK }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Verify code then deploy comments and aggregate traffic functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          node --check functions/index.js
          npx firebase-tools@latest deploy --only functions:commentsApi,functions:trafficApi --project zazomtek --non-interactive
