name: Deploy Firebase comments backend

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-backend-comments.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firebase-comments-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Functions dependencies
        run: npm install --prefix functions --omit=dev

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAZOMTEK }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy comments API and Firestore rules
        id: deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        run: |
          set +e
          npx firebase-tools@latest deploy --only functions:commentsApi,firestore:rules --project zazomtek --non-interactive 2>&1 | tee firebase-comments-deploy.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save deploy diagnostics on failure
        if: steps.deploy.outputs.exit_code != '0'
        run: |
          git config user.name "zazoomtek-bot"
          git config user.email "actions@users.noreply.github.com"
          git add firebase-comments-deploy.log
          git commit -m "Save Firebase comments deploy diagnostics" || true
          git pull --rebase origin main
          git push

      - name: Fail workflow if deploy failed
        if: steps.deploy.outputs.exit_code != '0'
        run: exit 1
