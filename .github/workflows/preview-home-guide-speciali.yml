name: ZazoomTek - Home Guide Speciali ZIP completo (NO DEPLOY)
on:
  push:
    branches:
      - 'preview/home-guide-speciali-reale-20261103'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_PAGES_BRANCH: preview-home-guide-speciali-reale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica la sintassi del generatore e crea l'intero sito
        run: |
          python3 -m py_compile tools/build.py tools/package_seo_preview.py
          python3 tools/build.py
      - name: Verifica il nuovo layout reale
        run: |
          test -s dist/index.html
          grep -q 'guide-showcase-large' dist/index.html
          grep -q 'guide-showcase-small' dist/index.html
          grep -q 'SPECIALI' dist/index.html
          grep -q 'EXTRA' dist/index.html
      - name: Crea archivio navigabile con articoli e copertine veri
        run: python3 tools/package_seo_preview.py
      - name: Consegna anteprima completa senza alcun deploy
        uses: actions/upload-artifact@v4
        with:
          name: ZazoomTek-LIVE-PREVIEW-Guide-Speciali-03-11-2026
          path: ZazoomTek_Anteprima_Completa_SEO_31-10-2026.zip
          retention-days: 7
          if-no-files-found: error
