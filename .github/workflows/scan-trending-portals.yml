name: News in evidenza - griglia statica ogni due ore
on:
  push:
    branches: [main]
    paths:
      - 'scripts/trending-crosscheck.py'
      - 'scripts/publish-trending-originals.py'
      - '.github/workflows/scan-trending-portals.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# A newer scan supersedes a still-busy optional AI research run.
# The static grid is committed before optional research, so cancellation is safe.
concurrency:
  group: zazoomtek-trending-scan
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate trend matching and source privacy
        run: |
          python3 -m py_compile scripts/trending-crosscheck.py
          python3 scripts/trending-crosscheck.py --test
      - name: Scan sixteen Italian and international technology and gaming portals
        run: python3 scripts/trending-crosscheck.py --sources
      - name: Validate automated original reporting and safe cover generator
        run: |
          python3 -m py_compile scripts/publish-trending-originals.py scripts/build-special-covers.py scripts/check-special-sources.py scripts/auto-approve-special.py
          python3 scripts/publish-trending-originals.py --self-test
      - name: Install original cover renderer
        run: python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      # News in evidenza is refreshed and committed exclusively by the independent
      # refresh-static-news-in-evidenza.yml job. This optional AI job MUST NOT
      # race against that job for featured-carousel.json or trend metadata.
      - name: Research additional original articles when the model is available
        id: new_stories
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python3 scripts/publish-trending-originals.py
      - name: Record independent AI interruption without blocking the static news grid
        if: steps.new_stories.outcome == 'failure'
        run: |
          echo "::warning::Original article generation unavailable. Existing verified articles will continue updating News in evidenza."
          echo "### News in evidenza" >> "$GITHUB_STEP_SUMMARY"
          echo "The external article-generation provider failed; static news refresh remains operational." >> "$GITHUB_STEP_SUMMARY"
      # Unlike the independent static updater, this job may write ORIGINAL
      # independently verified article pages (not just rerender timestamps).
      # Staging only actual article/cover changes prevents a second, conflicting
      # commit to featured-carousel.json and trending-match-report.json.
      - name: Commit verified original articles only (no duplicate grid ownership)
        id: push_originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "zazoomtek-bot"
          git config user.email "actions@users.noreply.github.com"
          shopt -s nullglob
          article_files=(news-trend-*.html)
          cover_files=(assets/special/news-trend-*.webp)
          if (( ${#article_files[@]} > 0 )); then git add -- "${article_files[@]}"; fi
          if (( ${#cover_files[@]} > 0 )); then git add -- "${cover_files[@]}"; fi
          shopt -u nullglob
          if git diff --cached --quiet; then
            echo "No new verified original news pages or covers: static highlights are managed independently."
            exit 0
          fi
          git add -- manual-news.json
          if test -f featured-auto-news.json; then git add -- featured-auto-news.json; fi
          git commit -m "trends: publish only source-checked original ZazoomTek news"
          for attempt in 1 2 3 4; do
            git fetch origin main || { sleep "$((attempt*4))"; continue; }
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Cloudflare Pages batches published articles; no Firebase deployment."
              gh workflow run refresh-static-news-in-evidenza.yml --ref main --repo "$GITHUB_REPOSITORY"
              echo "Verified originals committed; independent static grid refresh queued."
              exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt*4))"
          done
          echo "::error::A concurrent edit prevented safe original-article synchronization. No existing site files overwritten."
          exit 1
