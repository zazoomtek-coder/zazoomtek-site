name: ZazoomTek Master Orchestrator - STAGING ONLY

on:
  pull_request:
    paths:
      - 'scripts/master-orchestrator.py'
      - 'scripts/master-json-renderer.py'
      - 'scripts/master-cutover-audit.py'
      - 'scripts/master-production-gateway.py'
      - 'scripts/cloudflare-build-site.py'
      - 'scripts/verify-home-layout-lock.py'
      - 'master-production-enabled.json'
      - '.github/workflows/master-orchestrator-production.yml'
      - 'scripts/trending-crosscheck.py'
      - 'scripts/refresh-home-editorial-boxes.py'
      - 'scripts/update-youtube-posts.py'
      - 'scripts/update-youtube.py'
      - 'featured-carousel.json'
      - '.github/workflows/master-orchestrator-staging.yml'
  workflow_dispatch:
    inputs:
      with_imports:
        description: 'Run YouTube/portal network imports only in temporary staging'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zazoomtek-master-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-master:
    name: Isolated pipeline / no production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout read-only source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image dependencies used by full news and special rendering
        run: python3 -m pip install --quiet 'Pillow>=10,<13'
      - name: Verify orchestrator source and five-slot logic
        run: |
          python3 -m py_compile scripts/master-orchestrator.py scripts/master-production-gateway.py
          python3 -m py_compile scripts/master-json-renderer.py scripts/refresh-home-editorial-boxes.py scripts/update-youtube-posts.py scripts/update-youtube.py scripts/trending-crosscheck.py
          python3 scripts/master-orchestrator.py --self-test
          python3 scripts/master-json-renderer.py --self-test
          python3 scripts/master-cutover-audit.py --self-test
          python3 scripts/master-production-gateway.py --self-test
          python3 scripts/verify-home-layout-lock.py --self-test
          python3 scripts/verify-home-layout-lock.py
          python3 scripts/trending-crosscheck.py --test
          python3 scripts/refresh-home-editorial-boxes.py --self-test
          python3 scripts/test_review_dedup.py
      - name: Run all modules in an isolated Git worktree
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          WITH_IMPORTS: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'cutover/master-20261019-safe') || (github.event_name == 'workflow_dispatch' && inputs.with_imports) || false }}
        run: |
          if [ "$WITH_IMPORTS" = 'true' ]; then
            python3 scripts/master-orchestrator.py --with-imports --simulate-production-render
          else
            python3 scripts/master-orchestrator.py --simulate-production-render
          fi
      - name: Inventory concurrent legacy writers (report only)
        if: always()
        run: python3 scripts/master-cutover-audit.py
      - name: Create visual preview of five cards (desktop / tablet / mobile)
        if: success()
        run: |
          python3 -m pip install --quiet 'playwright>=1.51,<2'
          python3 -m playwright install --with-deps chromium
          python3 scripts/capture-staging-preview.py \
            --root artifacts/master-orchestrator/preview-site \
            --output artifacts/master-orchestrator/screenshots
      - name: Write human-readable test summary
        if: always()
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('artifacts/master-orchestrator/report.json')
          lines=['## ZazoomTek Master staging', '']
          if p.exists():
              r=json.loads(p.read_text(encoding='utf-8'))
              lines += [f"**Esito:** {r['status']}", '',
                        '**Carosello:** 5 slot (4 Tech + 1 Gaming)', '',
                        '**Produzione:** non modificata', '',
                        '| Modulo | Risultato |', '|---|---|']
              for x in r.get('modules', []):
                  lines.append(f"| {x['module']} | {x['status']} |")
              inventory=Path('artifacts/master-orchestrator/cutover-audit.json')
              if inventory.exists():
                  audit=json.loads(inventory.read_text(encoding='utf-8'))
                  lines+=['',f"**Legacy writers:** {audit['legacy_writer_count']} workflow potenzialmente scriventi.",
                          f"**Pronto al cutover:** {audit['cutover_ready']}",
                          '**Merge:** NON ESEGUIRE finché tutti gli adattatori e il writer di produzione non sono verificati.']
              lines+=['', 'Le immagini desktop/tablet/mobile e il report JSON sono negli Artifacts del run.']
          else: lines.append('Nessun report: errore di avvio del processo.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')
          PY
      - name: Publish staging report + preview artifact (NEVER deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zazoomtek-master-staging-${{ github.run_id }}
          path: artifacts/master-orchestrator/
          if-no-files-found: warn
          retention-days: 7
