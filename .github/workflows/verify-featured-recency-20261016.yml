name: Verify no news older than yesterday in Cloudflare carousel
on:
  push:
    branches: [featured-today-yesterday-only-20261016]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run isolated freshness regression tests
        run: |
          python3 -m py_compile scripts/trending-crosscheck.py scripts/cloudflare-sync-featured-home.py scripts/cloudflare-build-site.py scripts/build-cloudflare-pages.py scripts/apply-standard-news-featured.py scripts/site-audit-safe.py scripts/featured-editor.py
          python3 scripts/test-featured-today-yesterday.py
          python3 scripts/trending-crosscheck.py --test
          python3 scripts/test-cloudflare-featured-home.py
      - name: Run complete production Cloudflare build with real published news
        run: |
          python3 scripts/cloudflare-build-site.py
          python3 - <<'PY'
          import datetime as dt,json,re
          from zoneinfo import ZoneInfo
          from pathlib import Path
          root=Path('dist')
          items=json.loads((root/'featured-carousel.json').read_text(encoding='utf-8'))['items']
          now=dt.datetime.now(ZoneInfo('Europe/Rome')).date()
          assert len(items)<=6
          assert len({x['url'] for x in items})==len(items)
          sections=[x['section'] for x in items]
          assert sections.count('tech')<=5 and sections.count('gaming')<=1
          assert len(sections)==sum(x in ('tech','gaming','tech-impact','gaming-inside') for x in sections)
          for item in items:
              if item['section'] in ('tech','gaming'):
                  pub=dt.date.fromisoformat(item['published_date'])
                  assert pub in (now,now-dt.timedelta(days=1)),(item['title'],pub)
              assert (root/item['url'].lstrip('/')).is_file()
          page=(root/'index.html').read_text(encoding='utf-8')
          region=page.split('<!-- FEATURED_NEWS_START -->',1)[1].split('<!-- FEATURED_NEWS_END -->',1)[0]
          links=re.findall(r'<a class="zt-feature-card[^"]*" href="([^"]+)"',region)
          assert links==[i['url'] for i in items],(links,items)
          assert not any('microsoft-surface-laptop-ultra' in x for x in links)
          assert not any('apple-welcome-home' in x for x in links)
          print('PASS: final site correct,',len(items),'dated cards:',[(i['section'],i['published_date']) for i in items])
          PY
