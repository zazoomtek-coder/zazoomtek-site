name: ZazoomTek read-only uptime monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: read
concurrency:
  group: zazoomtek-uptime-health
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify public site and key sections; never change hosting
        run: python3 scripts/check-public-uptime.py
