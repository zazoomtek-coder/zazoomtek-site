name: Probe actual published Home and script assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-published-home-20261013.yml'
permissions:
  contents: read
jobs:
  direct-site-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect domain page versions, response headers, and live JS source
        run: |
          python3 - <<'PY'
          import hashlib,re,urllib.request,datetime
          paths=['/','/index.html','/anteprima-home-produzione-validazione-20261013.html','/zt-home-live.js?v=20261013approved45-35-20b']
          for path in paths:
              try:
                  req=urllib.request.Request('https://zazoomtek.it'+path,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'Mozilla/5.0 (ZazoomTek audit)'})
                  with urllib.request.urlopen(req,timeout=22) as res:
                      raw=res.read()
                      data=raw.decode('utf-8','replace')
                      print('PROBE',path,'code',res.status,'bytes',len(raw),'sha',hashlib.sha256(raw).hexdigest()[:14],
                            'cache',res.headers.get('Cache-Control'),'age',res.headers.get('Age'),
                            'server',res.headers.get('Server'))
                      print('  LIVE SCRIPT',re.findall(r'zt-home-live[.]js[^" ]*',data)[:5],
                            'FINAL CSS',bool('ztp-live-editorial-fill' in data),
                            'TITLE',re.findall(r'<title>(.*?)</title>',data)[:1],
                            'CANONICAL ARTICLE',data.count('<!-- ARTICLE_FEED_START -->'),
                            'EDITORIAL JS',bool('const sidebarEditorials=' in data))
              except Exception as exc: print('PROBE ERROR',path,repr(exc))
          PY
