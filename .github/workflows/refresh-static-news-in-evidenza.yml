name: News in evidenza - aggiornamento statico indipendente
# This is the independent, provider-free six-slot updater. Existing
# AI research remains a separate, optional production flow.
on:
  workflow_dispatch:
  schedule:
    # Refresh independently every four hours, avoiding the top of the hour.
    - cron: '23 */4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-static-news-in-evidenza.yml'
      - 'scripts/trending-crosscheck.py'
      - 'featured-editorial-pins.json'
permissions:
  contents: write
  actions: write
concurrency:
  group: zazoomtek-static-featured-six-slots
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh up to six featured articles published today or yesterday
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "zazoomtek-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 -m py_compile scripts/trending-crosscheck.py
            python3 scripts/trending-crosscheck.py --test
            python3 scripts/trending-crosscheck.py --sources
            python3 scripts/trending-crosscheck.py --apply
            python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('featured-carousel.json').read_text(encoding='utf-8'))
          articles=state.get('items',[])
          assert isinstance(articles,list) and len(articles)<=6
          import importlib.util
          spec=importlib.util.spec_from_file_location('zt_trending',Path('scripts/trending-crosscheck.py'))
          zt=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(zt)
          assert zt.valid_featured_sections(articles)
          assert len({x['url'] for x in articles})==len(articles)
          assert all(zt.allowed_featured_date(a) for a in articles
                     if a['section'] in ('tech','gaming')), 'Older than yesterday in featured'
          # Category labels alone are insufficient: check the actual headlines.
          explicit=zt.community_explicit_categories()
          for article in articles:
              if article['section'] not in ('tech','gaming'):
                  continue
              actual=explicit.get(article['url']) or zt.classify(article['title'])
              assert actual == article['section'], (
                  'Wrong featured category: '+article['title'])
          assert zt.classify('WWE 2K26 incontra Street Fighter') == 'gaming'
          assert zt.classify('VAULTBREAKERS apre l’alpha test pubblico con modalità PvPvE') == 'gaming'
          for article in articles:
              local=Path(article['url'].lstrip('/'))
              assert local.is_file(),article['url']
              if article['image'].startswith('/'):
                  assert Path(article['image'].lstrip('/')).is_file(),article['image']
          print('STATIC FEATURED PASS: today first then yesterday only, max 5 Tech + 1 Gaming; optional manual special pins')
          PY
            git add -- featured-carousel.json trending-sources.json trending-match-report.json
            if git diff --cached --quiet; then
              echo "No change to available fresh featured articles or portal research."
              exit 0
            fi
            if git diff --cached --quiet -- featured-carousel.json; then
              grid_changed=false
            else
              grid_changed=true
            fi
            git commit -m "News in evidenza: independently update six verified static highlights"
            if git push origin HEAD:main; then
              if [ "$grid_changed" = true ]; then
                echo "Cloudflare Pages batches published articles; no Firebase deployment."
              fi
              echo "Static grid updated; AI availability does not block this workflow."
              exit 0
            fi
            echo "Concurrent editorial change: retry against fresh published main"
            sleep "$((attempt * 4))"
          done
          echo "::error::Could not safely update static News in evidenza"
          exit 1
