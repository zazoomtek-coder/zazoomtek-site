name: Serialized live site publishing
# This is the ONLY Firebase publisher for YouTube imports and editorial carousel.
# Neither news import nor trend discovery runs here: deploy a validated snapshot.
on:
  workflow_dispatch:
# Manual/queued dispatch ONLY. Pushes are routed through firebase-hosting-merge.yml.
# Eliminates double deploys of index.html from two independent triggers.
permissions:
  contents: read
  actions: write
concurrency:
  group: zazoomtek-firebase-live-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load newest committed source once
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Verify Tech and Gaming Home news classification
        run: node scripts/test-home-news-categories.cjs
      - name: Validate existing YouTube news, reviews and video pages
        run: |
          python3 scripts/validate-sync-output.py community
          python3 scripts/validate-sync-output.py videos
          python3 - <<'PY'
          from pathlib import Path
          import json
          index=Path('index.html').read_text(encoding='utf-8')
          assert '<!-- FEATURED_NEWS_START -->' in index
          assert '<!-- FEATURED_NEWS_END -->' in index
          assert '<!-- ARTICLE_FEED_START -->' in index
          carousel=Path('featured-carousel.json')
          if carousel.is_file():
              items=json.loads(carousel.read_text(encoding='utf-8')).get('items',[])
              assert len(items)==6 and len({x['url'] for x in items})==6
              assert [x['section'] for x in items]==['tech','tech','tech','gaming','tech-impact','gaming-inside']
          print('YouTube content validated, carousel independent and safe.')
          PY
      # Every live deployment MUST normalize all old and newly imported HTML.
      # Never serve an unstyled legacy article or mixed five/eight-button menu.
      # This runs after repository sync, without touching YouTube data or
      # committing any editorial changes.
      - name: Refresh five latest review cards from published site archive and Community
        run: |
          python3 -m py_compile scripts/refresh-home-latest-reviews.py scripts/update-youtube-posts.py
          python3 scripts/refresh-home-latest-reviews.py
      - name: Apply canonical site header and shared CSS to every HTML page
        run: |
          python3 -m py_compile scripts/apply-site-design.py scripts/zt_sidebar_mix.py scripts/build-related-content.py
          python3 scripts/apply-site-design.py
      # Owned YouTube video watch pages live in /watch/ only. No existing
      # graphics, content, navbar, sync importer, or homepage is modified.
      # Run after shared design normalization to avoid ~200 extra design passes.
      - name: Build verified video watch pages and archive directory (non-blocking)
        continue-on-error: true
        run: |
          python3 scripts/test_seo_watch_pages_safe.py
          python3 scripts/test_seo_video_archive_safe.py
          python3 scripts/seo_watch_pages_safe.py
      - name: Verify no unstyled or wrapping navigation reaches Firebase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          pages=[p for p in root.glob('*.html') if not p.name.startswith('preview-')]
          expected=['Home','News','Recensioni','Guide','Tech Impact','Gaming Inside','Community','Video']
          checked=0
          for path in pages:
              html=path.read_text(encoding='utf-8')
              if not re.search(r'<header\b',html,re.I):
                  continue
              if '/ChatGPT.png' not in html and 'ChatGPT.png' not in html:
                  continue
              if not re.search(r'<link\b[^>]*href=["\']/zt-design\.css\?v=20261012sidebarFix5',html,re.I):
                  raise RuntimeError(f'{path.name}: missing common CSS link')
              header=re.search(r'<header\b[^>]*>[\s\S]*?</header>',html,re.I)
              if not header:
                  raise RuntimeError(f'{path.name}: missing masthead')
              nav=re.search(r'<nav\b[^>]*class=["\'][^"\']*\b(?:zt-nav|nav)\b[^"\']*["\'][^>]*>[\s\S]*?</nav>',
                            header.group(),re.I)
              if not nav:
                  raise RuntimeError(f'{path.name}: no canonical navigation')
              labels=re.sub(r'<[^>]+>',' ',nav.group())
              for label in expected:
                  if label.lower() not in labels.lower():
                      raise RuntimeError(f'{path.name}: missing nav item {label}')
              checked+=1
          if checked<20:
              raise RuntimeError(f'Only {checked} styled pages; expected the whole site')
          css=(root/'zt-design.css').read_text(encoding='utf-8')
          assert 'ZAZOOMTEK UNIFIED HEADER v3' in css
          assert 'header .topbar nav.nav,.zt-header nav.zt-nav' in css
          assert 'flex-wrap:nowrap!important' in css
          thumbs=(root/'zt-thumbnails.css').read_text(encoding='utf-8')
          assert 'ZAZOOMTEK EDITORIAL THUMBNAILS — TEXT-PRIORITY COVER' in thumbs
          assert 'object-position:var(--zt-text-focal-point,50% 50%)!important' in thumbs
          assert 'TEXT-PRIORITY COVER 20261013' in thumbs
          assert 'object-fit:cover!important' in thumbs
          assert '.video-card > button img' in thumbs
          for page in pages:
              page_html=page.read_text(encoding='utf-8')
              if '</head>' in page_html.lower():
                  assert page_html.count('/zt-thumbnails.css?v=20261013textPriorityCover5')==1,(page.name,'center thumbnail CSS missing')

          assert 'font:800 13px/1.1 Arial,Helvetica,sans-serif!important' in css
          print('PASS:',checked,'Home-consistent headers; 8 buttons per page')
          PY
      - name: Verify editorial box thumbnails and typography on all article pages
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from importlib.util import spec_from_file_location, module_from_spec
          css=Path("zt-design.css").read_text(encoding="utf-8")
          assert "ZT EDITORIAL RIGHT-RAIL FINAL CONTRACT 20261012" in css
          assert "font:400 13px/1.35 Arial,Helvetica,sans-serif!important" in css
          spec=spec_from_file_location("related","scripts/build-related-content.py")
          mod=module_from_spec(spec)
          spec.loader.exec_module(mod)
          for name in (
              "tech-impact-flock-safety-270-uscite-privacy-2026.html",
              "gaming-inside-gta-vi-rockstar-licenziamenti-discord-2026.html",
              "tech-impact-norvegia-proposta-divieto-occhiali-intelligenza-artificiale.html",
          ):
              image=mod.image_of(Path(name).read_text(encoding="utf-8"))
              assert image and "ChatGPT.png" not in image,(name,image)
              print("Real news cover:",name, "=>",image[:95])
          count=0
          for page in Path(".").glob("*.html"):
              if page.name.startswith("preview-"):
                  continue
              html=page.read_text(encoding="utf-8")
              for match in re.finditer(r'<section\b[^>]*data-zt-auto="editorial"[^>]*>[\s\S]*?</section>',
                                       html,re.I):
                  box=match.group()
                  rows=re.findall(r'<a\s+class="zt-mix-editorial-row"[^>]*>[\s\S]*?</a>',box,re.I)
                  assert len(rows)>=2,(page.name,"Too few editorial suggestions",len(rows))
                  for row in rows:
                      img=re.search(r'<img\b[^>]*src="([^"]+)"',row,re.I)
                      assert img and img.group(1) and "ChatGPT.png" not in img.group(1),(
                          page.name,"Invalid editorial thumbnail")
                  count+=1
          assert count>=20, f"Only {count} verified editorial boxes"
          print("PASS:",count,"real-image editorial boxes, consistent compact typography")
          PY
      # Semantic main heading of the existing visible News in evidenza label.
      # Preserve identical computed mobile/desktop layout; never touch importers.
      - name: Apply accessible homepage H1 with preserved styling (non-blocking)
        continue-on-error: true
        run: |
          python3 scripts/test_seo_home_h1_safe.py
          python3 scripts/seo_home_h1_safe.py
      # Optimize only the 52px ZazoomTek header logo shown by all pages.
      # Full-resolution PNG remains for schema.org, OG, sharing and Discover.
      # Fingerprinted small PNG is prebuilt: Pillow only needed if original changes.
      - name: Serve compact faithful header logo site-wide (non-blocking)
        continue-on-error: true
        run: |
          python3 scripts/test_seo_header_logo_safe.py
          python3 - <<'PY'
          import sys,subprocess
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from seo_header_logo_safe import asset_current
          if not asset_current(Path('.').resolve()):
              subprocess.check_call([sys.executable,'-m','pip','install','--disable-pip-version-check','-q','Pillow>=10,<13'])
          PY
          python3 scripts/seo_header_logo_safe.py
      # Article metadata is enhanced only in the ephemeral release checkout.
      # It must never edit an importer, the site repository, or HTML bodies.
      - name: Enhance Search/Discover metadata (non-blocking)
        continue-on-error: true
        run: |
          python3 scripts/test_seo_head_safe.py
          python3 scripts/test_seo_media_safe.py
          python3 scripts/seo_head_safe.py
      # Verified cover OpenGraph metadata only, on temporary Firebase checkout.
      # Never touch layouts, imports, or already declared OG images.
      - name: Add verified article OpenGraph covers (non-blocking)
        continue-on-error: true
        run: |
          python3 scripts/test_seo_real_article_og_safe.py
          python3 scripts/seo_real_article_og_safe.py
      # SEO content quality for every old/new/future canonical HTML page.
      # Four protected fixes: unique real Community headline, semantic paginated
      # H1, concise search metadata, unique News-archive description. The
      # YouTube importers and CSS are NEVER modified. This runs in the release
      # checkout only and must NEVER gate Firebase publishing.
      - name: Normalize site-wide SEO titles descriptions and archive headings (non-blocking)
        continue-on-error: true
        run: |
          python3 scripts/test_seo_generic_article_headline_safe.py
          python3 scripts/test_seo_paginated_h1_safe.py
          python3 scripts/test_seo_concise_metadata_safe.py
          python3 scripts/test_seo_news_archive_descriptions.py
          python3 scripts/seo_generic_article_headline_safe.py
          python3 scripts/seo_paginated_h1_safe.py
          python3 scripts/seo_concise_metadata_safe.py
          python3 scripts/seo_news_archive_descriptions.py
      - name: Restore internal links to legacy Community articles (non-blocking)
        continue-on-error: true
        run: |
          python3 -m py_compile scripts/seo_link_legacy_news.py
          python3 scripts/seo_link_legacy_news.py
      - name: Prevent recurring News SEO metadata regressions
        run: |
          python3 -m py_compile scripts/seo_final_metadata_guard.py
          python3 scripts/seo_final_metadata_guard.py
      - name: Audit normalized whole-site SEO before Firebase publishing
        continue-on-error: true
        run: |
          python3 scripts/test_seo_whole_site_audit.py
          python3 scripts/seo_whole_site_audit.py --output "$RUNNER_TEMP/seo-release-audit.json"
      - name: Archive the whole-site SEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-release-audit
          path: ${{ runner.temp }}/seo-release-audit.json
          if-no-files-found: ignore
          retention-days: 14
      # Only enrich existing article JSON-LD with the verified, on-page hero.
      # Independent, non-blocking and applied in Firebase's ephemeral checkout.
      - name: Associate real article hero with existing Schema.org (non-blocking)
        continue-on-error: true
        run: |
          python3 scripts/test_seo_schema_image_safe.py
          python3 scripts/seo_schema_image_safe.py
      - name: Complete Schema.org identity and breadcrumbs (non-blocking)
        continue-on-error: true
        run: |
          python3 -m py_compile scripts/seo_schema_completion_safe.py
          python3 scripts/seo_schema_completion_safe.py
      # Optional, isolated: SEO must NEVER delay or block YouTube/Firebase publishing.
      # Build in the Firebase checkout only; the live repository and HTML remain untouched.
      - name: Generate verified SEO sitemap (required)
        run: |
          python3 scripts/test_seo_sitemap_safe.py
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          import sys
          import xml.etree.ElementTree as ET
          sys.path.insert(0,str(Path('scripts').resolve()))
          spec=importlib.util.spec_from_file_location('seo','scripts/seo_sitemap_safe.py')
          seo=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(seo)
          outputs,count=seo.build(Path('.'))
          old=Path('sitemap.xml')
          previous=len(ET.parse(old).getroot()) if old.exists() else 0
          minimum=max(500, int(previous*0.95))
          if count<minimum:
              raise RuntimeError(f'SEO sitemap guard: {count} canonical pages, expected >= {minimum}')
          changed=seo.publish(Path('.'),outputs)
          print(f'Optional SEO sitemap: {count} canonical pages; {len(changed)} regenerated files')
          PY
      - name: Verify published sitemap artifacts before deployment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root=ET.parse('sitemap.xml').getroot()
          urls=[e.text for e in root.findall('s:url/s:loc',ns)]
          txt=Path('sitemap.txt').read_text(encoding='utf-8').splitlines()
          assert len(urls)>=500, 'Sitemap URL count below safe minimum'
          assert len(urls)==len(set(urls)), 'Sitemap duplicates'
          assert urls==txt, 'Sitemap XML/TXT mismatch'
          assert Path('sitemap.xml').read_bytes()==Path('google-sitemap.xml').read_bytes(), 'Google sitemap mismatch'
          assert 'Sitemap: https://zazoomtek.it/sitemap.xml' in Path('robots.txt').read_text(encoding='utf-8'), 'robots.txt sitemap declaration missing'
          print('PASS:',len(urls),'canonical sitemap URLs validated before Firebase publish')
          PY
      - name: Generate two factual high-resolution Discover previews (non-blocking)
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check -q Pillow
          python3 -m py_compile scripts/seo_discover_two_covers.py
          python3 scripts/seo_discover_two_covers.py
      - name: Repair and verify readable Discover preview assets (non-blocking)
        continue-on-error: true
        run: |
          python3 -m py_compile scripts/seo_discover_remote_cards.py
          python3 scripts/seo_discover_remote_cards.py
      - name: Audit Google Discover covers and previews (read-only, non-blocking)
        continue-on-error: true
        run: |
          python3 -m py_compile scripts/seo_discover_readiness.py
          python3 -m pip install --disable-pip-version-check -q Pillow
          python3 scripts/seo_discover_readiness.py --output "$RUNNER_TEMP/zazoomtek-discover-audit.json"
      - name: Archive Google Discover image audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-discover-audit
          path: ${{ runner.temp }}/zazoomtek-discover-audit.json
          if-no-files-found: ignore
          retention-days: 14
      # Optional Google News sitemap: verified original dates from the last 48h.
      # Independent of protected YouTube sync, site layout and normal sitemap.
      - name: Generate recent editorial News sitemap (non-blocking)
        continue-on-error: true
        run: |
          python3 scripts/test_seo_news_sitemap.py
          python3 scripts/seo_news_sitemap.py
      # Video indexing is enabled only for verified prominent main-content embeds.
      # Never label a thumbnail, secondary article trailer or dynamic modal as a watch page.
      - name: Generate only genuinely eligible Video sitemap (non-blocking)
        continue-on-error: true
        run: |
          python3 scripts/test_seo_video_sitemap_safe.py
          python3 scripts/seo_video_sitemap_safe.py
      # Optional performance optimization for homepage Community card thumbnails.
      # Only the 1600px remote img/src of lazy cards is capped at 1200px;
      # no CSS, image layout, indexed article images or YouTube imports are touched.
      - name: Optimize lazy homepage Community thumbnail delivery (non-blocking)
        continue-on-error: true
        run: |
          python3 scripts/test_seo_thumbnail_payload_safe.py
          python3 scripts/seo_thumbnail_payload_safe.py --scope homepage
      - name: Prioritize measured Gaming Inside mobile LCP only
        run: |
          python3 -m py_compile scripts/seo_lcp_last_card_safe.py
          python3 scripts/seo_lcp_last_card_safe.py
          python3 scripts/seo_lcp_last_card_safe.py --check
      - name: Serve appropriately sized featured news images (non-blocking)
        continue-on-error: true
        run: |
          python3 -m py_compile scripts/seo_featured_srcset_safe.py
          python3 scripts/seo_featured_srcset_safe.py
          python3 scripts/seo_featured_srcset_safe.py --check
      # Prevent a queued job with an older checkout from overwriting a newer
      # successful release. Requeue a fresh validation instead of deploying stale HTML.
      - name: Refuse stale main snapshot just before deployment
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::warning::Newer main commit detected; this run will not deploy a stale snapshot."
            echo "current=false" >> "$GITHUB_OUTPUT"
            # Never self-dispatch: repeated repository changes can cause a dispatch storm.
            # The normal main push trigger schedules a fresh deployment.
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Extra homepage article links exist in deploy snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class ExtraLinks(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_list=False
                  self.depth=0
                  self.hrefs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="div" and a.get("id")=="extraList":
                      self.in_list=True
                      self.depth=1
                  elif self.in_list and tag=="div":
                      self.depth+=1
                  if self.in_list and tag=="a" and a.get("href","").startswith("/"):
                      self.hrefs.append(a["href"].split("?")[0])
              def handle_endtag(self,tag):
                  if self.in_list and tag=="div":
                      self.depth-=1
                      if self.depth==0:
                          self.in_list=False
          p=ExtraLinks()
          p.feed(Path("extra.html").read_text(encoding="utf-8"))
          paths=sorted(set(x for x in p.hrefs if x.endswith(".html")))
          missing=[x for x in paths if not Path(x.lstrip("/")).is_file()]
          if missing:
              raise SystemExit("Extra contains unpublished article links: "+", ".join(missing[:20]))
          print("PASS:",len(paths),"Extra article links present in Firebase snapshot.")
          PY
      - name: Deploy latest validated GitHub snapshot to Firebase
        if: steps.freshness.outputs.current == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAZOMTEK }}
          channelId: live
          projectId: zazomtek

      - name: Verify published Extra article URLs after deployment
        if: steps.freshness.outputs.current == 'true'
        run: |
          python3 - <<'PY'
          import urllib.request,time
          urls=[
            "https://zazoomtek.it/extra.html",
            "https://zazoomtek.it/extra-silki-sedia-3d-seta-riciclata-tracciabilita.html",
            "https://zazoomtek.it/extra-superlega-credem-banca-2026-27-vbtv-fantasy-game.html",
          ]
          for url in urls:
              last=""
              for attempt in range(6):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"ZazoomTek-deploy-healthcheck/1.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          if response.status==200 and b"<html" in response.read(1024).lower():
                              print("PASS",response.status,url)
                              break
                          last=f"Unexpected status: {response.status}"
                  except Exception as exc:
                      last=str(exc)
                  time.sleep(10)
              else:
                  raise SystemExit(f"Extra public URL failed: {url}: {last}")
          PY
