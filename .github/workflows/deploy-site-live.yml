name: Serialized live site publishing
# This is the ONLY Firebase publisher for YouTube imports and editorial carousel.
# Neither news import nor trend discovery runs here: deploy a validated snapshot.
on:
  workflow_dispatch:
# Manual/queued dispatch ONLY. Pushes are routed through firebase-hosting-merge.yml.
# Eliminates double deploys of index.html from two independent triggers.
permissions:
  contents: read
  actions: write
concurrency:
  group: zazoomtek-firebase-live-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load newest committed source once
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Validate existing YouTube news, reviews and video pages
        run: |
          python3 scripts/validate-sync-output.py community
          python3 scripts/validate-sync-output.py videos
          python3 - <<'PY'
          from pathlib import Path
          import json
          index=Path('index.html').read_text(encoding='utf-8')
          assert '<!-- FEATURED_NEWS_START -->' in index
          assert '<!-- FEATURED_NEWS_END -->' in index
          assert '<!-- ARTICLE_FEED_START -->' in index
          carousel=Path('featured-carousel.json')
          if carousel.is_file():
              items=json.loads(carousel.read_text(encoding='utf-8')).get('items',[])
              assert len(items)==6 and len({x['url'] for x in items})==6
              assert [x['section'] for x in items]==['tech','tech','gaming','gaming','tech-impact','gaming-inside']
          print('YouTube content validated, carousel independent and safe.')
          PY
      # Every live deployment MUST normalize all old and newly imported HTML.
      # Never serve an unstyled legacy article or mixed five/eight-button menu.
      # This runs after repository sync, without touching YouTube data or
      # committing any editorial changes.
      - name: Apply canonical site header and shared CSS to every HTML page
        run: |
          python3 -m py_compile scripts/apply-site-design.py scripts/zt_sidebar_mix.py scripts/build-related-content.py
          python3 scripts/apply-site-design.py
      - name: Verify no unstyled or wrapping navigation reaches Firebase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          pages=[p for p in root.glob('*.html') if not p.name.startswith('preview-')]
          expected=['Home','News','Recensioni','Guide','Tech Impact','Gaming Inside','Community','Video']
          checked=0
          for path in pages:
              html=path.read_text(encoding='utf-8')
              if not re.search(r'<header\b',html,re.I):
                  continue
              if '/ChatGPT.png' not in html and 'ChatGPT.png' not in html:
                  continue
              if not re.search(r'<link\b[^>]*href=["\']/zt-design\.css\?v=20261012sidebarFix5',html,re.I):
                  raise RuntimeError(f'{path.name}: missing common CSS link')
              header=re.search(r'<header\b[^>]*>[\s\S]*?</header>',html,re.I)
              if not header:
                  raise RuntimeError(f'{path.name}: missing masthead')
              nav=re.search(r'<nav\b[^>]*class=["\'][^"\']*\b(?:zt-nav|nav)\b[^"\']*["\'][^>]*>[\s\S]*?</nav>',
                            header.group(),re.I)
              if not nav:
                  raise RuntimeError(f'{path.name}: no canonical navigation')
              labels=re.sub(r'<[^>]+>',' ',nav.group())
              for label in expected:
                  if label.lower() not in labels.lower():
                      raise RuntimeError(f'{path.name}: missing nav item {label}')
              checked+=1
          if checked<20:
              raise RuntimeError(f'Only {checked} styled pages; expected the whole site')
          css=(root/'zt-design.css').read_text(encoding='utf-8')
          assert 'ZAZOOMTEK UNIFIED HEADER v3' in css
          assert 'header .topbar nav.nav,.zt-header nav.zt-nav' in css
          assert 'flex-wrap:nowrap!important' in css
          thumbs=(root/'zt-thumbnails.css').read_text(encoding='utf-8')
          assert 'ZAZOOMTEK GLOBAL CENTERED THUMBNAILS' in thumbs
          assert 'object-position: 50% 50% !important' in thumbs
          for page in pages:
              page_html=page.read_text(encoding='utf-8')
              if '</head>' in page_html.lower():
                  assert page_html.count('/zt-thumbnails.css?v=20261013centerThumbsAll')==1,(page.name,'center thumbnail CSS missing')

          assert 'font:800 13px/1.1 Arial,Helvetica,sans-serif!important' in css
          print('PASS:',checked,'Home-consistent headers; 8 buttons per page')
          PY
      - name: Verify editorial box thumbnails and typography on all article pages
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from importlib.util import spec_from_file_location, module_from_spec
          css=Path("zt-design.css").read_text(encoding="utf-8")
          assert "ZT EDITORIAL RIGHT-RAIL FINAL CONTRACT 20261012" in css
          assert "font:400 13px/1.35 Arial,Helvetica,sans-serif!important" in css
          spec=spec_from_file_location("related","scripts/build-related-content.py")
          mod=module_from_spec(spec)
          spec.loader.exec_module(mod)
          for name in (
              "tech-impact-flock-safety-270-uscite-privacy-2026.html",
              "gaming-inside-gta-vi-rockstar-licenziamenti-discord-2026.html",
              "tech-impact-norvegia-proposta-divieto-occhiali-intelligenza-artificiale.html",
          ):
              image=mod.image_of(Path(name).read_text(encoding="utf-8"))
              assert image and "ChatGPT.png" not in image,(name,image)
              print("Real news cover:",name, "=>",image[:95])
          count=0
          for page in Path(".").glob("*.html"):
              if page.name.startswith("preview-"):
                  continue
              html=page.read_text(encoding="utf-8")
              for match in re.finditer(r'<section\b[^>]*data-zt-auto="editorial"[^>]*>[\s\S]*?</section>',
                                       html,re.I):
                  box=match.group()
                  rows=re.findall(r'<a\s+class="zt-mix-editorial-row"[^>]*>[\s\S]*?</a>',box,re.I)
                  assert len(rows)>=2,(page.name,"Too few editorial suggestions",len(rows))
                  for row in rows:
                      img=re.search(r'<img\b[^>]*src="([^"]+)"',row,re.I)
                      assert img and img.group(1) and "ChatGPT.png" not in img.group(1),(
                          page.name,"Invalid editorial thumbnail")
                  count+=1
          assert count>=20, f"Only {count} verified editorial boxes"
          print("PASS:",count,"real-image editorial boxes, consistent compact typography")
          PY
      # Prevent a queued job with an older checkout from overwriting a newer
      # successful release. Requeue a fresh validation instead of deploying stale HTML.
      - name: Refuse stale main snapshot just before deployment
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::Newer main commit detected after validation; queueing a fresh build."
            echo "current=false" >> "$GITHUB_OUTPUT"
            gh workflow run deploy-site-live.yml --ref main --repo "$GITHUB_REPOSITORY"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy latest validated GitHub snapshot to Firebase
        if: steps.freshness.outputs.current == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAZOMTEK }}
          channelId: live
          projectId: zazomtek
