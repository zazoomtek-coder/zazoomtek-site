name: Publish approved scheduled reviews
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'editorial/review-publication-queue.json'
      - 'scripts/publish-approved-reviews.py'
      - 'scripts/test_scheduled_review_publication.py'
      - '.github/workflows/publish-approved-reviews.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: zazoomtek-editorial-reviewed-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate publisher and approval queue
        run: |
          python3 -m py_compile scripts/publish-approved-reviews.py scripts/test_scheduled_review_publication.py
          python3 scripts/test_scheduled_review_publication.py
          python3 scripts/publish-approved-reviews.py --dry-run
      - name: Publish due reviews with conflict-safe retry
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'ZazoomTek Scheduled Reviews'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -B publish-current origin/main
            python3 scripts/publish-approved-reviews.py
            git add -- index.html recensioni-scritte.html sitemap.xml google-sitemap.xml
            python3 - <<'PY'
          import json,subprocess
          items=json.load(open('editorial/review-publication-queue.json',encoding='utf-8'))['items']
          for item in items:
              if item['status']=='approved' and __import__('pathlib').Path(item['target']).exists():
                  subprocess.run(['git','add','--',item['target']],check=True)
          PY
            if git diff --cached --quiet; then
              echo 'published=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m 'Publish approved scheduled editorial reviews'
            if git push origin HEAD:main; then
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$((attempt*3))"
          done
          echo '::error::Scheduled editorial reviews could not be committed after four attempts.'
          exit 1
      - name: Deploy approved article through canonical Firebase publisher
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site-live.yml --ref main --repo "$GITHUB_REPOSITORY"
