name: Continuous SEO audit - read only
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - seo/continuous-audit-20261014
      - seo/audit-fragment-exclusions-20261014
    paths:
      - 'scripts/seo_continuous_audit.py'
      - 'scripts/test_seo_continuous_audit.py'
      - 'scripts/seo_paths_safe.py'
      - '.github/workflows/seo-continuous-audit.yml'
      - 'scripts/seo_whole_site_audit.py'
      - 'scripts/test_seo_whole_site_audit.py'
permissions:
  contents: read
concurrency:
  group: seo-read-only-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify audit itself against future section fixtures
        run: python3 scripts/test_seo_continuous_audit.py
      - name: Inspect existing, current and newly published pages without writing anything
        run: python3 scripts/seo_continuous_audit.py
      - name: Assess titles descriptions H1 and local links for all published sections
        continue-on-error: true
        run: |
          python3 scripts/test_seo_whole_site_audit.py
          # Mirror live SEO normalization in this disposable runner only.
          # Never commit these generated changes or publish a site from here.
          python3 scripts/seo_home_h1_safe.py
          python3 scripts/seo_generic_article_headline_safe.py
          python3 scripts/seo_paginated_h1_safe.py
          python3 scripts/seo_concise_metadata_safe.py
          python3 scripts/seo_news_archive_descriptions.py
          # The live Firebase deployment repairs legacy Community inbound links.
          # Mirror that correction in the disposable runner before auditing,
          # otherwise the read-only report falsely lists 18 orphan pages.
          python3 scripts/seo_link_legacy_news.py
          python3 scripts/seo_whole_site_audit.py --output "$RUNNER_TEMP/seo-metadata-and-links.json"
      - name: Archive read-only SEO quality findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-metadata-and-links
          path: ${{ runner.temp }}/seo-metadata-and-links.json
          if-no-files-found: ignore
          retention-days: 14
