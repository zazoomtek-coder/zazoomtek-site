name: Studio layout checks
on:
  push:
    paths:
      - 'studio/**'
      - 'scripts/test-studio-layouts.cjs'
      - '.github/workflows/studio-layout-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check studio/layouts.js
          node --check studio/publisher.js
      - name: Check approved layouts and safety
        run: node scripts/test-studio-layouts.cjs
