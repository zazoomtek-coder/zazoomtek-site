name: Validate mobile LCP and metadata guard
on:
  push:
    branches:
      - perf/mobile-lcp-priority-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile safe transformations
        run: python3 -m py_compile scripts/seo_mobile_lcp_priority_safe.py scripts/seo_final_metadata_guard.py
      - name: Verify six image priority attributes and transformation idempotence
        run: |
          python3 - <<'PY'
          import sys,re
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import seo_mobile_lcp_priority_safe as m
          from seo_final_metadata_guard import build
          text=Path('index.html').read_text()
          modified=m.transform(text)
          assert modified==m.transform(modified)
          a=modified.index(m.START)+len(m.START)
          b=modified.index(m.END,a)
          tags=m.IMG.findall(modified[a:b])
          assert len(tags)==6
          assert 'fetchpriority="high"' in tags[0]
          assert 'srcset=' in tags[0]
          assert all('loading="lazy"' in t and 'fetchpriority="high"' not in t for t in tags[1:])
          assert text[:a]==modified[:a] and text[b:]==modified[modified.index(m.END,a):]
          print('PASS mobile cover loading, high-priority and source bounds')
          PY
      - name: Ensure existing deploy metadata normalization no longer fails
        run: |
          python3 scripts/seo_concise_metadata_safe.py
          python3 scripts/seo_final_metadata_guard.py
          python3 scripts/seo_final_metadata_guard.py --check
