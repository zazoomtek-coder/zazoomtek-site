name: Zazoom Unstoppable Sync & Deploy

on:
  schedule:
    # 10:15 Italiana (08:15 UTC)
    - cron: '15 8 * * *'
    # 12:45 Italiana (10:45 UTC)
    - cron: '45 10 * * *'
    # 15:15 Italiana (13:15 UTC)
    - cron: '15 13 * * *'
    # 17:45 Italiana (15:45 UTC)
    - cron: '45 15 * * *'
    # 20:15 Italiana (18:15 UTC)
    - cron: '15 18 * * *'
  workflow_dispatch:

jobs:
  deploy-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Scarica repository completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Installa dipendenze
        run: npm install

      - name: 🔄 Sincronizzazione Contenuti & YouTube (Blindata)
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if npm run | grep -q "sync"; then
            npm run sync || echo "Sync completato con avvisi, proseguo la pubblicazione forzata."
          else
            echo "Nessuno script di sync dedicato, procedo."
          fi

      - name: ⚡ Compilazione Totale (Grafica, Layout e Asset)
        run: npm run build

      - name: 🚀 Pubblicazione Forzata su Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zazoomtek-site-main
