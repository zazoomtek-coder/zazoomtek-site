name: ZazoomTek aggregate traffic report
on:
  schedule:
    - cron: '27 7 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/traffic-logging-check.yml'
      - 'scripts/report-hosting-traffic.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAZOMTEK }}'
          project_id: zazomtek

      - name: Generate aggregated cookie-free Hosting page-request report
        id: report
        shell: bash
        run: |
          python3 -m pip install --quiet google-auth requests
          python3 -m py_compile scripts/report-hosting-traffic.py
          python3 scripts/report-hosting-traffic.py
          if [ -f zazoomtek-pagine-hosting-30gg.csv ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive CSV of daily aggregate totals only
        if: steps.report.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ZazoomTek-Hosting-requests-last-30-days
          path: zazoomtek-pagine-hosting-30gg.csv
          retention-days: 30
