name: Deploy ZazoomTek editorial scheduler

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/cron-publisher/**"
      - ".github/workflows/deploy-editorial-cron.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zazoomtek-editorial-cron-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Deploy Cloudflare editorial Cron Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare/cron-publisher/wrangler.toml
