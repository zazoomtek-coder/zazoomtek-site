name: SpotNews preview diagnostic
on:
  push:
    branches:
      - feature/spotnews-clean-rebuild
jobs:
  python-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q tools
      - name: Build complete test site
        run: python tools/build.py
