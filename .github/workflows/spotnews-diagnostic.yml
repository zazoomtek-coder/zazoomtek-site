name: SpotNews diagnostic (temporary)
on:
  push:
    branches: [feature/spotnews-clean-rebuild]
jobs:
  check-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q tools
      - name: Build entire SpotNews preview
        run: python tools/build.py
