name: SpotNews Studio diagnostic
on:
  push:
    branches: [feature/spotnews-clean-rebuild]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q tools
      - name: Build and audit all site pages
        run: python tools/build.py
