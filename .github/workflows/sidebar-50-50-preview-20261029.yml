name: Preview sidebar short long halves with Amazon - NO DEPLOY
on:
  push:
    branches: [feature/article-sidebar-short-long-50-50-20261029]
permissions:
  contents: read
jobs:
  full-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/article-sidebar-short-long-50-50-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          node --check assets/js/site.js
          python3 -m py_compile tools/build.py tools/test_sidebar_short_long_split_20261029.py
      - name: Import editorial queue into ephemeral runner without publishing
        run: |
          git fetch --no-tags origin editorial-queue
          python3 tools/scheduled_editorial_import.py
      - name: Build complete real site NO DEPLOY
        env:
          CF_PAGES_BRANCH: feature/article-sidebar-short-long-50-50-20261029
        run: |
          python3 tools/build.py
          test -s dist/index.html && test -s dist/sitemap.xml
      - name: Test real browser long 50:50, short one box, Amazon preserved
        run: python3 tools/test_sidebar_short_long_split_20261029.py
      - name: Complete offline ZIP preview
        run: |
          python3 tools/package_offline_preview.py
          mv ZazoomTek_SpotNews_Anteprima_Mobile_Footer_28-10-2026.zip ZazoomTek_SIDEBAR_50_50_ANTEPRIMA_29-10-2026.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('ZazoomTek_SIDEBAR_50_50_ANTEPRIMA_29-10-2026.zip')
          with zipfile.ZipFile(p,'a',compression=zipfile.ZIP_DEFLATED) as z:
           z.writestr('LEGGIMI_ANTEPRIMA_SIDEBAR.txt',
            'ZAZOOMTEK - ANTEPRIMA COMPLETA NON ONLINE\\n'
            'News brevi: SOLO Ultime recensioni. Altre pagine brevi: SOLO Ultime news.\\n'
            'Articoli e recensioni lunghi: primo 50% Ultime news; secondo 50% Dalla redazione.\\n'
            'Articoli correlati a sinistra e Amazon a destra in fondo: INVARIATI. Home invariata.\\n'
            'Estrai tutto ZIP e apri index.html. Studio richiede servizi online. Nessun deploy.\\n')
          with zipfile.ZipFile(p) as z:
           files=set(z.namelist())
           assert len(files)>285,len(files)
           assert {'index.html','VISTA_SMARTPHONE.html','assets/js/site.js','assets/css/spotnews.css'}<=files
           assert not any(x.endswith('.zip') for x in files)
           assert z.testzip() is None
           assert 'data-rail-mode="split"' in ''.join(z.read(x).decode('utf-8') for x in z.namelist() if 'recensione' in x and x.endswith('.html') and x!='recensioni.html') 
          print('COMPLETE SIDEBAR ZIP VERIFIED',len(files),'files',p.stat().st_size,'bytes; NO DEPLOY',flush=True)
          PY
      - name: Upload complete offline ZIP preview
        uses: actions/upload-artifact@v4
        with:
          name: ZazoomTek-SIDEBAR-50-50-ANTEPRIMA-29-10-2026
          path: ZazoomTek_SIDEBAR_50_50_ANTEPRIMA_29-10-2026.zip
          if-no-files-found: error
          retention-days: 30
