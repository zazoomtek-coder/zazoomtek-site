name: One-time Firebase news preview cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-firebase-news-previews-once.yml'
permissions:
  contents: read
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAZOMTEK }}'
          project_id: zazomtek
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.33.0
      - name: Delete superseded PR16-PR22 preview channels only
        shell: bash
        run: |
          set -euo pipefail
          firebase hosting:channel:list --project zazomtek --json > "$RUNNER_TEMP/news-preview-channels.json"
          python3 - <<'PY'
          import json,os,subprocess
          path=os.path.join(os.environ['RUNNER_TEMP'],'news-preview-channels.json')
          with open(path,encoding='utf-8') as f: response=json.load(f)
          if isinstance(response,dict) and response.get('status')=='error': raise RuntimeError('Cannot list Firebase channels')
          channels=[]
          def scan(value):
              if isinstance(value,dict):
                  name=value.get('name')
                  if isinstance(name,str) and '/channels/' in name: channels.append(name.rsplit('/',1)[-1])
                  for nested in value.values(): scan(nested)
              elif isinstance(value,list):
                  for nested in value: scan(nested)
          scan(response)
          print('Firebase channels listed:',len(channels),flush=True)
          print('Temporary PR channels:',sorted(x for x in channels if x.startswith('pr'))[:50],flush=True)
          prefixes=tuple(f'pr{i}-' for i in range(16,23))
          chosen=sorted(set(x for x in channels if x.startswith(prefixes)))
          print('Superseded news-preview channels found:',len(chosen),flush=True)
          for name in chosen:
              print('Deleting temporary channel:',name,flush=True)
              subprocess.run(['firebase','hosting:channel:delete',name,'--project','zazomtek','--force'],check=True)
          print('Cleanup complete; live channel was not touched',flush=True)
          PY

      - name: Delete only Firebase Hosting versions already EXPIRED
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import collections
          from google.auth import default
          from google.auth.transport.requests import AuthorizedSession
          credentials,_=default(scopes=["https://www.googleapis.com/auth/cloud-platform"])
          session=AuthorizedSession(credentials)
          base="https://firebasehosting.googleapis.com/v1beta1"
          for site in ("zazoomtek","zazomtek"):
              versions=[]
              token=""
              for page in range(12):
                  params={"pageSize":"100"}
                  if token: params["pageToken"]=token
                  response=session.get(f"{base}/sites/{site}/versions",params=params,timeout=30)
                  if not response.ok:
                      print("Cannot inspect",site,response.status_code,response.text[:200],flush=True)
                      break
                  payload=response.json()
                  versions.extend(payload.get("versions",[]))
                  token=payload.get("nextPageToken","")
                  if not token:break
              counts=collections.Counter(v.get("status","?") for v in versions)
              print("Hosting versions",site,len(versions),dict(counts),flush=True)
              expired=[v for v in versions if v.get("status")=="EXPIRED"]
              for version in expired[:1000]:
                  name=version["name"]
                  if not name.startswith(f"sites/{site}/versions/"):continue
                  reply=session.delete(f"{base}/{name}",timeout=30)
                  print("Delete expired version",name,"status",reply.status_code,flush=True)
              print("Only EXPIRED versions targeted; live FINALIZED versions untouched.",flush=True)
          PY

      - name: Deploy restored photos after expired-version cleanup
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAZOMTEK }}
          channelId: live
          projectId: zazomtek
