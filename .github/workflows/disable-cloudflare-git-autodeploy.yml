name: ZazoomTek - blocca deploy Git Cloudflare (configurazione una tantum)
on:
  push:
    branches: [main]
    paths: [tools/disable_git_autodeploy.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Disabilita soltanto gli auto-deploy Git, senza pubblicare contenuti
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/disable_git_autodeploy.py
