name: Test targeted Gaming Inside LCP
on:
  push:
    branches:
      - perf/fix-gaming-inside-lcp-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate safe LCP image transformation
        run: |
          python3 -m py_compile scripts/seo_lcp_last_card_safe.py
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import seo_lcp_last_card_safe as m
          before=Path('index.html').read_text(encoding='utf-8')
          after=m.transform(before)
          assert after==m.transform(after)
          a=before.index(m.START)+len(m.START)
          b=before.index(m.END,a)
          c=after.index(m.END,a)
          assert before[:a]==after[:a]
          assert before[b:]==after[c:]
          old=m.IMAGE.findall(before[a:b])
          new=m.IMAGE.findall(after[a:c])
          assert len(old)==len(new)==6
          assert old[:5]==new[:5]
          assert 'loading="eager"' in new[5] and 'fetchpriority="high"' in new[5]
          assert '/assets/special/gaming-inside-' in new[5]
          print('PASS only sixth in-viewport card loading attributes changed')
          PY
