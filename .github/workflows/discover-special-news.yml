name: Automatic verified Tech Impact and Gaming Inside
# Verified unattended reporting. Manual dispatch remains available.
# A one-time marker push triggers the first run; the two daily checks respect
# the daily five-article maximum and do not manufacture unverified stories.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7,14 * * *'
  push:
    branches: [main]
    paths:
      - '.github/special-editorial-run.trigger'
      - 'scripts/discover-special-news.py'
permissions:
  contents: write
  actions: write
concurrency:
  group: special-editorial-publishing
  cancel-in-progress: false
jobs:
  verify-and-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test strict editorial automation
        run: |
          python3 -m py_compile scripts/discover-special-news.py scripts/generate-special-drafts.py scripts/check-special-sources.py scripts/write-special-articles.py scripts/auto-approve-special.py scripts/publish-special-news.py
          python3 scripts/auto-approve-special.py --self-test
          python3 -m json.tool approved-special-articles.json >/dev/null
          python3 scripts/discover-special-news.py --self-test
      - name: Discover relevant current public news
        id: discover
        run: |
          python3 scripts/discover-special-news.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path("special-candidates.json").read_text(encoding="utf-8"))
          available=bool(report.get("items"))
          errors=len(report.get("errors",[]))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"has_leads={str(available).lower()}\n")
          if not available:
              print(f"::warning::News discovery returned no candidates ({errors} feed errors). No articles generated or published; existing site preserved.")
          PY
      - name: Research titles without treating RSS headlines as evidence
        if: steps.discover.outputs.has_leads == 'true'
        id: research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY missing, automatic publication safely disabled"
            exit 1
          fi
          python3 scripts/generate-special-drafts.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("special-drafts-review.json")
          n=len(json.loads(p.read_text(encoding="utf-8")).get("drafts",[])) if p.exists() else 0
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"has_drafts={str(n>0).lower()}\n")
          if n==0:
              print("::warning::No fact-checkable editorial proposals. Safely keeping current articles and carousel.")
          PY
      - name: Resolve real publishers and retrieve source material
        if: steps.research.outputs.has_drafts == 'true'
        run: python3 scripts/check-special-sources.py
      - name: Draft original source-grounded articles
        if: steps.research.outputs.has_drafts == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python3 scripts/write-special-articles.py
      - name: Audit every paragraph and approve verified stories
        if: steps.research.outputs.has_drafts == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python3 scripts/auto-approve-special.py
      - name: Explain approval outcome in workflow summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('special-auto-report.json')
          lines = ['### Tech Impact e Gaming Inside: esito del controllo']
          if p.exists():
              report = json.loads(p.read_text(encoding='utf-8'))
              reviewed = report.get('review', [])
              approved = report.get('approved_count', 0)
              lines += [f'- Notizie controllate: **{len(reviewed)}**',
                        f'- Nuovi articoli verificati: **{approved}**',
                        f'- Scartate: **{sum(x.get("status")=="rejected" for x in reviewed)}**']
              if not approved:
                  lines += ['- **Nessuna nuova pubblicazione:** nessuna bozza ha superato tutti i controlli.',
                            '- Le motivazioni dettagliate sono nell’artefatto privato di audit.']
              else:
                  lines += ['- Gli articoli verificati saranno pubblicati soltanto dopo il commit.']
          else:
              lines += ['- **Controllo non concluso:** nessun rapporto di approvazione.',
                        '- Consultare i passaggi precedenti per errori di rete o di ricerca.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n'.join(lines)+'\n')
          PY
      - name: Preserve private audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: special-auto-audit-${{ github.run_id }}
          path: |
            special-candidates.json
            special-drafts-review.json
            special-source-evidence.json
            special-full-articles-review.json
            special-auto-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit verified news to the repository
        if: steps.research.outputs.has_drafts == 'true'
        id: publish_commit
        run: |
          git config user.name "ZazoomTek Verified Editorial Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add approved-special-articles.json
          if git diff --cached --quiet; then
            echo "No stories passed the publication safety gate."
            exit 0
          fi
          git commit -m "content: auto-approve verified Tech Impact and Gaming Inside"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "Verified articles committed. Dispatching publisher next."
              exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt * 5))"
          done
          echo "::error::Could not safely synchronize approved articles"
          exit 1
      - name: Build and deploy the approved news
        if: steps.publish_commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push made with GITHUB_TOKEN does not trigger other Actions workflows.
          # workflow_dispatch explicitly starts the separate publishing pipeline.
          gh workflow run publish-special-news.yml --ref main
