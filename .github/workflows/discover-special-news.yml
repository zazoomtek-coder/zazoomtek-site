name: Discover Tech Impact and Gaming Inside leads
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: special-editorial-discovery
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Research worldwide news (no automatic publication)
        run: python3 scripts/discover-special-news.py
      - name: Commit leads only when changed
        run: |
          if ! git diff --quiet -- special-candidates.json; then
            git config user.name "ZazoomTek Editorial Research Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- special-candidates.json
            git commit -m "chore: refresh special news research leads"
            git push
          elif [ -n "$(git ls-files --others --exclude-standard -- special-candidates.json)" ]; then
            git config user.name "ZazoomTek Editorial Research Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- special-candidates.json
            git commit -m "chore: initialize special news research leads"
            git push
          else
            echo "No new research data"
          fi
