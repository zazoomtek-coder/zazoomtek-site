name: Automatic verified Tech Impact and Gaming Inside
on:
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/featured_article_layout.py'
      - 'scripts/auto-approve-special.py'
      - 'scripts/write-special-articles.py'
      - '.github/workflows/discover-special-news.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: special-editorial-publishing
  cancel-in-progress: false
jobs:
  verify-and-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test strict editorial automation
        run: |
          python3 -m py_compile scripts/discover-special-news.py scripts/generate-special-drafts.py scripts/check-special-sources.py scripts/write-special-articles.py scripts/auto-approve-special.py scripts/publish-special-news.py
          python3 scripts/auto-approve-special.py --self-test
          python3 -m json.tool approved-special-articles.json >/dev/null
      - name: Discover relevant current public news
        run: python3 scripts/discover-special-news.py
      - name: Research titles without treating RSS headlines as evidence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY missing, automatic publication safely disabled"
            exit 1
          fi
          python3 scripts/generate-special-drafts.py
      - name: Resolve real publishers and retrieve source material
        run: python3 scripts/check-special-sources.py
      - name: Draft original source-grounded articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python3 scripts/write-special-articles.py
      - name: Audit every paragraph and approve verified stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python3 scripts/auto-approve-special.py
      - name: Preserve private audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: special-auto-audit-${{ github.run_id }}
          path: |
            special-candidates.json
            special-drafts-review.json
            special-source-evidence.json
            special-full-articles-review.json
            special-auto-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit verified news to the repository
        id: publish_commit
        run: |
          git config user.name "ZazoomTek Verified Editorial Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add approved-special-articles.json
          if git diff --cached --quiet; then
            echo "No stories passed the publication safety gate."
            exit 0
          fi
          git commit -m "content: auto-approve verified Tech Impact and Gaming Inside"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "Verified articles committed. Dispatching publisher next."
              exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt * 5))"
          done
          echo "::error::Could not safely synchronize approved articles"
          exit 1
      - name: Build and deploy the approved news
        if: steps.publish_commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push made with GITHUB_TOKEN does not trigger other Actions workflows.
          # workflow_dispatch explicitly starts the separate publishing pipeline.
          gh workflow run publish-special-news.yml --ref main
