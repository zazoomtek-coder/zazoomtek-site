name: Browser-check centered thumbnails on every site section
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-centered-thumbnails-20261013.yml'
permissions:
  contents: read
jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Prepare Chrome
        run: |
          command -v google-chrome
          mkdir -p /tmp/zt-thumbnails-audit
          cd /tmp/zt-thumbnails-audit
          npm install --silent --no-save playwright-core@1.56.0
      - name: Verify live stylesheet and centered thumbnails on desktop and mobile
        env:
          NODE_PATH: /tmp/zt-thumbnails-audit/node_modules
        run: |
          cat > /tmp/zt-thumbnails-audit/check.js <<'JS'
          const {chromium}=require("playwright-core");
          const pages=[
           {path:"/",label:"Home",selector:".ztp-news-tech .article-image"},
           {path:"/news.html",label:"News",selector:".news-row img"},
           {path:"/recensioni.html",label:"Recensioni",selector:"main img"},
           {path:"/guide.html",label:"Guide",selector:".news-row img"},
           {path:"/tech-today.html",label:"Tech Impact",selector:".news-row img"},
           {path:"/gaming-today.html",label:"Gaming Inside",selector:".news-row img"}
          ];
          async function run(){
           const browser=await chromium.launch({headless:true,executablePath:"/usr/bin/google-chrome",args:["--no-sandbox","--disable-dev-shm-usage"]});
           try {
            for (const view of [{label:"desktop",width:1500,height:940},{label:"mobile",width:390,height:820}]){
             for(const entry of pages){
              let verified=false;let report=null;
              const p=await browser.newPage({viewport:{width:view.width,height:view.height}});
              for(let attempt=0;attempt<7;attempt++){
               const response=await p.goto("https://zazoomtek.it"+entry.path+"?thumbcentercheck="+attempt,{waitUntil:"domcontentloaded",timeout:45000});
               await p.waitForTimeout(500);
               report=await p.evaluate(selector=>{
                const link=document.querySelector('link[data-zt-thumbnails="center"]');
                const arr=[...document.querySelectorAll(selector)];
                const relevant=arr.filter(el=>!el.hasAttribute("data-zt-focus")).slice(0,14);
                return {
                 stylesheet:link?.getAttribute("href")||null,
                 images:arr.length,
                 positions:relevant.map(img=>getComputedStyle(img).objectPosition),
                 fit:relevant.map(img=>getComputedStyle(img).objectFit),
                 srcDimensions:relevant.map(img=>({nw:img.naturalWidth,nh:img.naturalHeight,w:img.getBoundingClientRect().width,h:img.getBoundingClientRect().height})),
                 dimensions:relevant.map(img=>({width:img.getBoundingClientRect().width,height:img.getBoundingClientRect().height})),
                 overflow:document.documentElement.scrollWidth-window.innerWidth,
                 homeCSSPresent:!!document.querySelector("#ztp-final-balanced-live-20261013"),
                };
               },entry.selector);
               if(response.status()===200 && report.stylesheet?.includes("20261013uncroppedAllSections4") && report.images>0 && report.positions.every(x=>x==="50% 50%") && report.fit.every(x=>x==="contain") && report.overflow<=8){verified=true;break;}
               if(attempt<6)await p.waitForTimeout(1800);
              }
              console.log("THUMBNAIL",view.label,entry.label,JSON.stringify(report));
              if(!verified)throw Error("Thumbnail alignment failed for "+entry.label+" "+view.label);
              if(view.label==="desktop"&&entry.label==="Home"){
               await p.screenshot({path:"/tmp/zt-thumbnails-audit/home-desktop.png",fullPage:false});
              }
              await p.close();
             }
            }
            console.log("PASS: all 6 site categories, desktop/mobile, centered thumbnail focal points and no overflow");
           }finally{await browser.close();}
          }
          run().catch(e=>{console.error("FAIL",e);process.exit(1)});
          JS
          node /tmp/zt-thumbnails-audit/check.js
      - name: Keep browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-thumbnail-centering-evidence
          path: /tmp/zt-thumbnails-audit/*.png
          if-no-files-found: ignore
