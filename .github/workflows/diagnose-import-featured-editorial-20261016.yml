name: Diagnose ZazoomTek YouTube imports and featured cards
on:
  push:
    branches: [repair-youtube-featured-editorial-20261016]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect today and yesterday verified imported news (read only)
        run: |
          python3 - <<'PY'
          import datetime,json,importlib.util
          from pathlib import Path
          from zoneinfo import ZoneInfo
          s=importlib.util.spec_from_file_location('zt','scripts/trending-crosscheck.py')
          mod=importlib.util.module_from_spec(s);s.loader.exec_module(mod)
          posts=json.loads(Path('.youtube-posts.json').read_text(encoding='utf-8'))
          titles={}
          for post in posts:
            if not isinstance(post,dict):continue
            title=(post.get('text') or '').splitlines()[0][:125] if post.get('text') else ''
            titles['/news-'+str(post.get('id'))+'.html']=title
          today=datetime.datetime.now(ZoneInfo('Europe/Rome')).date()
          print('Source Community post count:',len(posts),'today',today)
          articles=mod.owned_candidates()
          for p in articles:
            d=mod.local_publication_date(p)
            if d in (today,today-datetime.timedelta(days=1)) and p.get('url','').startswith('/news-'):
              print('CANDIDATE',json.dumps({'date':str(d),'category':p['section'],'inferred':mod.classify(p['title']),'heading':p['title'],'original':titles.get(p['url'],'')[:105],'url':p['url']},ensure_ascii=False))
          proposed=mod.pick(mod.matches(articles,{'items':[]}))
          print('SELECTED count:',len(proposed))
          for p in proposed:print('SELECTED',p.get('section'),p.get('published_date'),p['title'])
          PY
      - name: Editorial boxes dry run with latest Community import (read only)
        run: |
          python3 scripts/refresh-home-editorial-boxes.py --self-test
          python3 scripts/refresh-home-editorial-boxes.py --dry-run
      - name: Regression against real categories, dates, and exact published hours
        run: |
          python3 -m py_compile scripts/trending-crosscheck.py scripts/cloudflare-sync-featured-home.py scripts/test-featured-today-yesterday.py
          python3 scripts/test-featured-today-yesterday.py
          python3 scripts/test-cloudflare-featured-home.py
          python3 scripts/trending-crosscheck.py --test
      - name: Full Cloudflare production site dry run, without a Cloudflare build
        run: |
          python3 scripts/cloudflare-build-site.py
          python3 - <<'PY'
          import datetime,json,re
          from pathlib import Path
          from zoneinfo import ZoneInfo
          root=Path('dist')
          data=json.loads((root/'featured-carousel.json').read_text(encoding='utf-8'))
          items=data['items']
          assert len(items)==6,items
          assert len({x['url'] for x in items})==6
          day=datetime.datetime.now(ZoneInfo('Europe/Rome')).date()
          home=(root/'index.html').read_text(encoding='utf-8')
          region=home.split('<!-- FEATURED_NEWS_START -->')[1].split('<!-- FEATURED_NEWS_END -->')[0]
          actual=re.findall(r'<a class="zt-feature-card[^"]*" href="([^"]+)"',region)
          assert actual==[x['url'] for x in items],(actual,items)
          posts=json.loads(Path('.youtube-posts.json').read_text(encoding='utf-8'))
          original={'/news-'+p['id']+'.html':(p.get('text') or '').splitlines()[0]
                    for p in posts if isinstance(p,dict) and p.get('id')}
          for x in items:
            page=root/x['url'].lstrip('/')
            assert page.is_file(),x
            body=page.read_text(encoding='utf-8')
            meta=re.search(r'<meta property="article:published_time" content="([^"]+)"',body)
            assert meta,x
            real=datetime.datetime.fromisoformat(meta.group(1).replace('Z','+00:00')).astimezone(ZoneInfo('Europe/Rome')).date()
            assert real in (day,day-datetime.timedelta(days=1)),(x,real)
            assert x['published_date']==real.isoformat(),(x,real)
            heading=original.get(x['url'],'').lower()
            if heading.startswith('news gaming:'):
              assert x['section']=='gaming',x
            if heading.startswith('news tech:'):
              assert x['section']=='tech',x
          print('PASS: six visible, verified, fresh and correctly classified cards:')
          for i,x in enumerate(items,1):
            print(i,x['published_date'],x['section'],x['title'])
          PY
      - name: Validate recently imported Community and video pages
        run: |
          python3 scripts/validate-sync-output.py community
          python3 scripts/validate-sync-output.py videos
