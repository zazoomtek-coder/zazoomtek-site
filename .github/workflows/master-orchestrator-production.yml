name: ZazoomTek MASTER - direct main publisher
# Publication directly from main: no PR queue, approval step or staging branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 10,15,20 * * *'
      timezone: 'Europe/Rome'
    # Recover any 20:15 release missed or delayed by the scheduler.
    - cron: '25,40 20 * * *'
      timezone: 'Europe/Rome'
    - cron: '45 12 * * *'
      timezone: 'Europe/Rome'
    - cron: '45 17 * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: write

concurrency:
  group: zazoomtek-master-sole-repository-and-pages-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Respect owner hold - 22 Oct 17:45 moved to 20:15
        id: editorial_slot
        env:
          ZT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [[ "$(TZ=Europe/Rome date +%F)" == "2026-10-22" && "$ZT_SCHEDULE" == "45 17 * * *" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Owner postponed the 17:45 slot to 20:15 (Europe/Rome) on 22 Oct 2026."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.editorial_slot.outputs.publish == 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Check if 20:15 recovery is actually necessary
        id: recovery
        if: steps.editorial_slot.outputs.publish == 'true'
        env:
          ZT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime,json,os,pathlib,urllib.request,subprocess
          from zoneinfo import ZoneInfo
          mode='normal'
          source=''
          # Never attempt to 'recover' a previously skipped 17:45 release.
          if os.environ.get('ZT_SCHEDULE')=='25,40 20 * * *':
              metadata=dict(line.split('=',1) for line in pathlib.Path('cloudflare-release-trigger.txt').read_text().splitlines() if '=' in line)
              slot=metadata.get('slot_utc','')
              expected=metadata.get('source_commit','')
              try:
                  when=datetime.datetime.fromisoformat(slot.replace('Z','+00:00')).astimezone(ZoneInfo('Europe/Rome'))
                  now=datetime.datetime.now(ZoneInfo('Europe/Rome'))
                  current=(when.date()==now.date() and (when.hour,when.minute)==(20,15))
              except (ValueError,TypeError): current=False
              if current and len(expected)==40:
                  source=expected
                  try:
                      request=urllib.request.Request('https://zazoomtek.it/zt-release-status.json',headers={'Cache-Control':'no-cache, no-store','User-Agent':'ZazoomTek-Evening-Release-Recovery/1.0'})
                      with urllib.request.urlopen(request,timeout=12) as response:
                          receipt=json.load(response)
                      current_sha=subprocess.run(['git','rev-parse','HEAD'],capture_output=True,text=True,check=True).stdout.strip()
                      if receipt.get('validated') is True and receipt.get('source_commit') in (expected,current_sha):
                          mode='skip'
                      else: mode='retry_deploy'
                  except Exception: mode='retry_deploy'
          print('mode='+mode)
          print('source='+source)
          print('Evening publication decision:',mode,file=__import__('sys').stderr)
          PY
      - uses: actions/setup-python@v5
        if: steps.editorial_slot.outputs.publish == 'true' && steps.recovery.outputs.mode != 'skip'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.editorial_slot.outputs.publish == 'true' && steps.recovery.outputs.mode != 'skip'
        with:
          node-version: '22'
      - name: Install rendering dependency
        if: steps.editorial_slot.outputs.publish == 'true' && steps.recovery.outputs.mode != 'skip'
        run: python3 -m pip install --quiet pillow
      - name: Import and commit directly to main
        id: master_release
        if: steps.editorial_slot.outputs.publish == 'true' && steps.recovery.outputs.mode == 'normal' && github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ZT_CLOUDFLARE_DIRECT_DEPLOY: '1'
        run: |
          git config user.name "ZazoomTek Master"
          git config user.email "actions@users.noreply.github.com"
          set -o pipefail
          python3 scripts/master-production-gateway.py --publish | tee "$RUNNER_TEMP/zt-master-result.log"
          python3 - "$RUNNER_TEMP/zt-master-result.log" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          data=None
          for line in reversed(open(sys.argv[1],encoding="utf-8").read().splitlines()):
              try: value=json.loads(line)
              except (ValueError,TypeError): continue
              if isinstance(value,dict) and value.get("success") is True and "release_requested" in value:
                  data=value
                  break
          if data is None: raise SystemExit("Master did not confirm its release decision")
          deploy=bool(data["release_requested"])
          source=str(data.get("source_commit") or "")
          if deploy and (len(source)!=40 or any(c not in "0123456789abcdef" for c in source)):
              raise SystemExit("Release requested without a valid source commit SHA")
          print("deploy="+str(deploy).lower())
          print("source="+source)
          PY
      - name: Build latest main for Cloudflare Pages
        id: release_build
        if: steps.editorial_slot.outputs.publish == 'true' && steps.recovery.outputs.mode != 'skip'
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          CURRENT_SHA="$(git rev-parse HEAD)"
          echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          ZT_RELEASE_SOURCE_SHA="$CURRENT_SHA" python3 scripts/cloudflare-build-site.py
      - name: Publish directly to Cloudflare Pages
        id: cloudflare_release
        if: steps.editorial_slot.outputs.publish == 'true' && steps.recovery.outputs.mode != 'skip'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main

      - name: Purge Cloudflare cache after successful Pages deployment
        if: steps.editorial_slot.outputs.publish == 'true' && steps.recovery.outputs.mode != 'skip' && steps.cloudflare_release.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
        run: python3 scripts/cloudflare-purge-after-release.py

      - name: Verify public release receipt
        if: ${{ always() && steps.editorial_slot.outputs.publish == 'true' && steps.recovery.outputs.mode != 'skip' && steps.cloudflare_release.outcome == 'success' }}
        run: |
          python3 scripts/verify-live-cloudflare.py \
            --source-commit "${{ steps.release_build.outputs.sha }}" \
            --timeout-seconds 300
