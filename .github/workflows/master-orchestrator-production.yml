name: ZazoomTek MASTER - sole production writer (CUTOVER GATED)
# Enabled only by the one-commit atomic cutover, gated by master-production-enabled.json.
# One concurrency group serializes both 5-minute JSON-only polls and the
# five fixed daytime Cloudflare release windows. Any competing legacy writer blocks the run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish_pending = release approved site changes now; publish = import and release; poll = JSON only'
        required: true
        type: choice
        options: [publish_pending, publish, poll]
        default: publish_pending
  schedule:
    # Italian local time, with automatic DST. No overnight scheduled polls.
    # Exact editorial releases: 10:15 12:45 15:15 17:45 20:15.
    - cron: '15 10,15,20 * * *'
      timezone: 'Europe/Rome'
    - cron: '45 12,17 * * *'
      timezone: 'Europe/Rome'
    # Five-minute import-only checks after first and before last release.
    - cron: '20-55/5 10 * * *'
      timezone: 'Europe/Rome'
    - cron: '2-57/5 11-19 * * *'
      timezone: 'Europe/Rome'
    - cron: '2,7,12 20 * * *'
      timezone: 'Europe/Rome'
  push:
    branches: [main]
    paths:
      - 'master-production-enabled.json'
      - 'cloudflare-manual-release-request.json'  # explicit release signal; no secrets

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: zazoomtek-master-sole-repository-and-pages-writer
  cancel-in-progress: false
  # Preserve every pending request; scheduled polls must not cancel a manual release.
  queue: max

jobs:
  master:
    if: github.ref == 'refs/heads/main'
    name: Verified editorial JSON to Cloudflare release gate
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare existing image and rendering dependencies
        run: python3 -m pip install --quiet pillow
      - name: Verify exclusive writer ownership; block if not cut over
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 scripts/master-production-gateway.py --check-cutover
      - name: Merge due editorial queue independently of other releases
        env:
          GH_TOKEN: ${{ github.token }}
          ZT_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ZT_DISPATCH_MODE: ${{ inputs.mode }}
          ZT_PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            if [ "${ZT_EVENT_SCHEDULE}" = "15 10,15,20 * * *" ] || [ "${ZT_EVENT_SCHEDULE}" = "45 12,17 * * *" ]; then
              python3 scripts/process-approved-release-queue.py --cron "${ZT_EVENT_SCHEDULE}"
            else
              echo "Import-only poll: approved PR queue untouched."
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${ZT_DISPATCH_MODE:-publish_pending}" != "poll" ]; then
            python3 scripts/process-approved-release-queue.py --cron manual-approved
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${ZT_PUSH_COMMIT_MESSAGE:-}" == "zt: manual Cloudflare release"* ]]; then
            python3 scripts/process-approved-release-queue.py --cron manual-approved
          fi
      - name: JSON-only poll or controlled publication
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ZT_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ZT_DISPATCH_MODE: ${{ inputs.mode }}
          ZT_PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          urgent=0
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            if [ "${ZT_EVENT_SCHEDULE}" = "15 10,15,20 * * *" ] || [ "${ZT_EVENT_SCHEDULE}" = "45 12,17 * * *" ]; then
              # Imports already run in serialized five-minute polls.
              # A release slot publishes validated pending content without
              # waiting for live YouTube/network imports or their timeouts.
              mode=publish_pending
            else
              mode=poll
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            mode="${ZT_DISPATCH_MODE:-publish_pending}"
            if [ "${mode}" != "poll" ]; then urgent=1; fi
          else
            mode=publish
            # ChatGPT can write the manual request file via the GitHub connector.
            # The deliberately named commit is an explicit publication request.
            if [[ "${ZT_PUSH_COMMIT_MESSAGE:-}" == "zt: manual Cloudflare release"* ]]; then
              mode=publish_pending
              urgent=1
            fi
          fi
          if [ "${mode}" != "poll" ] && [ "${mode}" != "publish" ] && [ "${mode}" != "publish_pending" ]; then
            echo "::error::Unsupported Master mode"; exit 1
          fi
          if [ "${urgent}" = 1 ]; then echo "FORCE_PUBLISH=True; publish_mode=immediate; approved pending content only"; fi
          echo "ZT Master mode: ${mode}"
          if [ "${mode}" = "publish_pending" ]; then
            if [ "${urgent}" = 1 ]; then
              echo "Manual immediate release of validated pending content."
              python3 scripts/master-production-gateway.py --publish-pending --urgent
            else
              echo "Scheduled release of validated pending content at editorial slot."
              python3 scripts/master-production-gateway.py --publish-pending
            fi
          elif [ "${urgent}" = 1 ]; then
            echo "User-approved import and release: all safety gates still apply."
            python3 scripts/master-production-gateway.py --publish --urgent
          else
            python3 scripts/master-production-gateway.py "--${mode}"
          fi
