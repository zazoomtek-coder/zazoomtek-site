name: ZazoomTek MASTER - sole production writer (CUTOVER GATED)
# DO NOT add a schedule or activate this workflow until the existing 14
# potential writers are retired in the SAME reviewed atomic cutover.
# During staging, manual dispatch is blocked by master-production-enabled.json.

on:
  schedule:
    - cron: '1-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'master-production-enabled.json'
  workflow_dispatch:
    inputs:
      urgent:
        description: 'Explicit emergency release (counts against reserved Cloudflare builds)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: zazoomtek-master-sole-repository-and-pages-writer
  cancel-in-progress: false

jobs:
  master:
    if: github.ref == 'refs/heads/main'
    name: Verified editorial JSON to Cloudflare release gate
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare existing image and rendering dependencies
        run: python3 -m pip install --quiet pillow
      - name: Validate YouTube secret interpolation without exposing it
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 -c 'import os,sys; key=os.environ.get("YOUTUBE_API_KEY", ""); sys.exit("Missing/malformed YouTube secret") if not key or key.startswith(chr(92)) or ("$"+"{{") in key else print("PASS: YouTube secret resolved")'
      - name: Verify exclusive writer ownership; block if not cut over
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 scripts/master-production-gateway.py --check-cutover
      - name: Validate and publish only via single Git + Pages gateway
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ZT_MASTER_URGENT: ${{ github.event_name == 'workflow_dispatch' && inputs.urgent || false }}
        run: |
          python3 scripts/master-production-gateway.py --publish
