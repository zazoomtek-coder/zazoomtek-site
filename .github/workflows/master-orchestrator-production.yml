name: ZazoomTek - pubblicazione automatica semplice
# No Master gateway, staging approvals or publication-slot veto.
# The build reads approved editorial JSON and queued reviews.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 10,15,20 * * *'
      timezone: 'Europe/Rome'
    - cron: '45 12,17 * * *'
      timezone: 'Europe/Rome'
    # Recovery after missed evening slots; keeps due content eligible.
    - cron: '30 21 * * *'
      timezone: 'Europe/Rome'
permissions:
  contents: read
concurrency:
  group: zazoomtek-cloudflare-production-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build latest approved editorial content (retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if ZT_RELEASE_SOURCE_SHA="$(git rev-parse HEAD)" python3 scripts/cloudflare-build-site.py; then
              echo "Editorial build succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Editorial build failed three times, preserving last live site"
              exit 1
            fi
            sleep $((attempt * 45))
          done
      - name: Deploy latest approved content (retry)
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_PROJECT"
          for attempt in 1 2 3; do
            if npx --yes wrangler@3 pages deploy dist --project-name="$CLOUDFLARE_PROJECT" --branch=main; then
              echo "Cloudflare deploy succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Cloudflare deploy failed three times"
              exit 1
            fi
            sleep $((attempt * 45))
          done
      - name: Purge Cloudflare cache (retry)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/cloudflare-purge-after-release.py; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then
              echo "::warning::Deploy succeeded, purge failed; next publish will retry"
              exit 0
            fi
            sleep $((attempt * 30))
          done
