name: ZazoomTek MASTER - sole production writer (CUTOVER GATED)
# Enabled only by the one-commit atomic cutover, gated by master-production-enabled.json.
# One concurrency group serializes both 5-minute JSON-only polls and the
# 2-hour Cloudflare release. Any competing legacy writer blocks the run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'poll = only verified JSON / publish = controlled full release'
        required: true
        type: choice
        options: [poll, publish]
        default: publish
  schedule:
    # Preserve the five-minute YouTube polling cadence without full rebuilds.
    - cron: '1-59/5 * * * *'
    # Publication only once per two-hour release window, budget checked.
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'master-production-enabled.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: zazoomtek-master-sole-repository-and-pages-writer
  cancel-in-progress: false

jobs:
  master:
    if: github.ref == 'refs/heads/main'
    name: Verified editorial JSON to Cloudflare release gate
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare existing image and rendering dependencies
        run: python3 -m pip install --quiet pillow
      - name: Verify exclusive writer ownership; block if not cut over
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 scripts/master-production-gateway.py --check-cutover
      - name: JSON-only poll or controlled publication
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ZT_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ZT_DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            if [ "${ZT_EVENT_SCHEDULE}" = "17 */2 * * *" ]; then
              mode=publish
            else
              mode=poll
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            mode="${ZT_DISPATCH_MODE:-publish}"
          else
            mode=publish
          fi
          if [ "${mode}" != "poll" ] && [ "${mode}" != "publish" ]; then
            echo "::error::Unsupported Master mode"; exit 1
          fi
          echo "ZT Master mode: ${mode}"
          python3 scripts/master-production-gateway.py "--${mode}"
