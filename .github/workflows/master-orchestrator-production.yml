name: ZazoomTek MASTER - direct main publisher
# Publication directly from main: no PR queue, approval step or staging branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 10,15,20 * * *'
      timezone: 'Europe/Rome'
    - cron: '45 12,17 * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: write

concurrency:
  group: zazoomtek-master-sole-repository-and-pages-writer
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rendering dependency
        run: python3 -m pip install --quiet pillow
      - name: Import and commit directly to main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ZT_CLOUDFLARE_DIRECT_DEPLOY: '1'
        run: |
          git config user.name "ZazoomTek Master"
          git config user.email "actions@users.noreply.github.com"
          python3 scripts/master-production-gateway.py --publish --urgent
      - name: Build latest main for Cloudflare Pages
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python3 scripts/cloudflare-build-site.py
      - name: Publish directly to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
