name: ZazoomTek MASTER - sole production writer (CUTOVER GATED)
# Enabled only by the one-commit atomic cutover, gated by master-production-enabled.json.
# One concurrency group serializes both 5-minute JSON-only polls and the
# five fixed daytime Cloudflare release windows. Any competing legacy writer blocks the run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'poll = only verified JSON / publish = controlled full release'
        required: true
        type: choice
        options: [poll, publish]
        default: publish
  schedule:
    # Italian local time, with automatic DST. No overnight scheduled polls.
    # Exact editorial releases: 10:15 12:45 15:15 17:45 20:15.
    - cron: '15 10,15,20 * * *'
      timezone: 'Europe/Rome'
    - cron: '45 12,17 * * *'
      timezone: 'Europe/Rome'
    # Five-minute import-only checks after first and before last release.
    - cron: '20-55/5 10 * * *'
      timezone: 'Europe/Rome'
    - cron: '2-57/5 11-19 * * *'
      timezone: 'Europe/Rome'
    - cron: '2,7,12 20 * * *'
      timezone: 'Europe/Rome'
  push:
    branches: [main]
    paths:
      - 'master-production-enabled.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: zazoomtek-master-sole-repository-and-pages-writer
  cancel-in-progress: false

jobs:
  master:
    if: github.ref == 'refs/heads/main'
    name: Verified editorial JSON to Cloudflare release gate
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare existing image and rendering dependencies
        run: python3 -m pip install --quiet pillow
      # The gateway performs the identical fail-closed preflight immediately
      # before work; do not repeat its expensive subprocess checks here.
      - name: JSON-only poll or controlled publication
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ZT_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ZT_DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            if [ "${ZT_EVENT_SCHEDULE}" = "15 10,15,20 * * *" ] || [ "${ZT_EVENT_SCHEDULE}" = "45 12,17 * * *" ]; then
              mode=publish
            else
              mode=poll
            fi
            # One final production push is requested tonight. Today's scheduled
            # 20:15 release must NOT issue another Cloudflare build.
            if [ "$(TZ=Europe/Rome date +%Y-%m-%d)" = "2026-10-19" ]; then
              mode=poll
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            mode="${ZT_DISPATCH_MODE:-publish}"
          else
            mode=publish
          fi
          if [ "${mode}" != "poll" ] && [ "${mode}" != "publish" ]; then
            echo "::error::Unsupported Master mode"; exit 1
          fi
          echo "ZT Master mode: ${mode}"
          python3 scripts/master-production-gateway.py "--${mode}"
