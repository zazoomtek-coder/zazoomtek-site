name: Verify live rotating sidebars
on:
  push:
    branches: [main]
    paths:
      - 'scripts/zt_sidebar_mix.py'
      - 'scripts/apply-site-design.py'
      - 'scripts/build-related-content.py'
      - 'zt-sidebar-live.js'
      - '.github/workflows/verify-rotating-sidebars.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python and browser script syntax
        run: |
          python3 -m py_compile scripts/zt_sidebar_mix.py scripts/apply-site-design.py scripts/build-related-content.py
          node --check zt-sidebar-live.js
      - name: Build and check only verified real sidebar feeds
        shell: bash
        run: |
          python3 scripts/zt_sidebar_mix.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          import sys
          sys.path.insert(0,'scripts')
          from zt_sidebar_mix import rotated
          feed=json.loads(Path('zt-sidebar-feed.json').read_text(encoding='utf-8'))
          for group in ('news','reviews','tech','gaming','editorial'):
              items=feed.get(group,[])
              if not items:
                  raise SystemExit('Empty verified feed: '+group)
              for x in items:
                  target=x['url'].lstrip('/')
                  if not Path(target).is_file():
                      raise SystemExit('Broken sidebar link: '+target)
                  if target.startswith('news-') and x['title'].lower().startswith('news extra:'):
                      raise SystemExit('EXTRA appears outside dedicated Extra archive')
          if len(feed['news'])>1:
              a=rotated(feed['news'],'news-UgkxExample.html','featured',bucket=0)[0]['url']
              b=rotated(feed['news'],'news-UgkxExample.html','featured',bucket=1)[0]['url']
              if a==b:
                  raise SystemExit('Rotation did not change across two-hour periods')
          print('Sidebar VERIFIED:',{k:len(v) for k,v in feed.items() if k!='videos'})
          PY
      - name: Publish verified live sidebar feed alongside the website
        shell: bash
        run: |
          git config user.name "zazoomtek-bot"
          git config user.email "actions@users.noreply.github.com"
          git add zt-sidebar-feed.json
          if git diff --cached --quiet; then
            echo "Sidebar data already up to date in the live repository."
            exit 0
          fi
          git commit -m "Refresh verified rotating editorial sidebar feed"
          # The test rebuilds hundreds of temporary HTML pages. Only publish
          # the validated JSON: discard unstaged build products before rebase.
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Source changed while building feed; not pushing a stale snapshot."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published verified JSON on main; Firebase can serve it."
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "::error::Could not publish the verified sidebar feed."
          exit 1
      - name: Queue Firebase deployment of verified sidebar data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site-live.yml --ref main
