name: ZazoomTek - pubblicazione diretta da Studio 2
on:
  push:
    branches: [main]
    paths:
      - "functions/api/studio/[[path]].js"
      - "assets/js/studio-v2.js"
      - "tools/studio_v2_build.py"
      - "tools/article_templates.py"
      - "tools/verify_studio_v2.py"
      - ".github/workflows/studio-publish.yml"
  workflow_dispatch:
    inputs:
      slug:
        description: "Articolo approvato da Studio 2"
        required: false
        type: string
permissions:
  contents: read
  deployments: write
concurrency:
  group: zazoomtek-pages-production
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_PAGES_BRANCH: main
      CF_PAGES_URL: https://zazoomtek.it
    steps:
      - name: Carica i contenuti salvati da Studio 2
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica credenziali Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Manca CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Manca CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Controlli sintattici senza eseguire importazioni
        run: |
          python3 -m compileall -q tools
          node --check assets/js/studio-v2.js
          node --input-type=module --check < 'functions/api/studio/[[path]].js'
      - name: Genera il sito dai contenuti approvati su main
        run: python3 tools/build.py
      - name: Verifica file essenziali
        run: |
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/news-sitemap.xml
          test -s dist/_routes.json
      - name: Verifica che l'articolo richiesto sia presente nella build
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/news-sitemap.xml
          test -s dist/_routes.json
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from article_routes import build_article_url
          slug=os.environ["INPUT_SLUG"]
          found=None
          for name,key in (("studio_posts.json","posts"),("studio_overrides.json","overrides")):
              data=json.loads((Path("data")/name).read_text(encoding="utf-8"))[key]
              rows=data if isinstance(data,list) else data.values()
              for row in rows:
                  if row.get("slug")==slug:
                      found=row
          if not found:
              raise SystemExit("Articolo Studio non trovato su main: "+slug)
          route=build_article_url(found)
          page=Path("dist")/(route.lstrip("/")+".html")
          if not page.is_file():
              raise SystemExit("Pagina non generata: "+str(page))
          print("BUILD VERIFIED:",route)
          PY
      - name: Pubblica su Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zazoomtek-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verifica la pagina richiesta sul dominio pubblico
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          from pathlib import Path
          sys.path.insert(0, "tools")
          from article_routes import build_article_url
          slug=os.environ["INPUT_SLUG"]
          found=None
          for name,key in (("studio_posts.json","posts"),("studio_overrides.json","overrides")):
              data=json.loads((Path("data")/name).read_text(encoding="utf-8"))[key]
              rows=data if isinstance(data,list) else data.values()
              for row in rows:
                  if row.get("slug")==slug:
                      found=row
          if not found:
              raise SystemExit("Articolo Studio non trovato su main: "+slug)
          url="https://zazoomtek.it"+build_article_url(found)
          title=str(found.get("title") or "")
          for attempt in range(1,7):
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"ZazoomTek-Studio-Publish/1.0","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      body=response.read().decode("utf-8",errors="replace")
                      if response.status==200 and title[:45] in body:
                          print("LIVE VERIFIED:",url)
                          break
                  raise RuntimeError("pagina non confermata")
              except Exception as exc:
                  if attempt==6:
                      raise SystemExit("PUBBLICAZIONE NON CONFERMATA: "+url+" "+str(exc))
                  print("Verifica",attempt,"non ancora disponibile:",str(exc)[:160])
                  time.sleep(10)
          PY

      - name: Verifica gli articoli editoriali dopo il deploy del codice Studio
        if: github.event_name == 'push'
        run: python3 tools/verify_editorial_live.py
