name: ZazoomTek - raccolta YouTube ogni cinque minuti
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zazoomtek-editorial-queue
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Carica codice e dati editoriali aggiornati da main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ripristina la coda persistente senza usare il codice obsoleto del ramo queue
        run: |
          git fetch --no-tags origin editorial-queue
          mkdir -p data
          git show origin/editorial-queue:data/queue_videos.json > data/queue_videos.json || printf '{"videos":[]}\n' > data/queue_videos.json
          git show origin/editorial-queue:data/queue_community.json > data/queue_community.json || printf '{"posts":[]}\n' > data/queue_community.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for filename, key in (("queue_videos.json", "videos"), ("queue_community.json", "posts")):
              path = Path("data") / filename
              raw = path.read_text(encoding="utf-8")
              if not raw.strip():
                  path.write_text(json.dumps({key: []}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  continue
              payload = json.loads(raw)
              if not isinstance(payload, dict) or not isinstance(payload.get(key), list):
                  raise RuntimeError("Invalid persistent YouTube queue: " + filename)
          PY
      - name: Importa video e post Community da YouTube
        run: python3 tools/queue_collect.py
      - name: Conserva la coda aggiornata sul ramo editoriale senza pubblicare il sito
        run: |
          cp data/queue_videos.json /tmp/queue_videos.json
          cp data/queue_community.json /tmp/queue_community.json
          rm -f data/queue_videos.json data/queue_community.json
          git checkout -B editorial-queue origin/editorial-queue
          cp /tmp/queue_videos.json data/queue_videos.json
          cp /tmp/queue_community.json data/queue_community.json
          git add data/queue_videos.json data/queue_community.json
          if ! git diff --cached --quiet; then
            git config user.name "ZazoomTek Queue Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Import YouTube video e Community in coda (non pubblicato)"
            git push origin HEAD:editorial-queue
          else
            echo "Nessun nuovo contenuto da accodare"
          fi
