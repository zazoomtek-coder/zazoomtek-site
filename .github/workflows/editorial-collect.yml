name: ZazoomTek - raccogli YouTube in coda
on:
  schedule:
    # Solo raccolta su editorial-queue: NESSUN deploy Cloudflare da questa esecuzione.
    # UTC: 07:00-18:59 copre sia il fuso CET sia CEST.
    # Il collector limita autonomamente la raccolta alle ore editoriali di Roma.
    - cron: '*/5 7-18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zazoomtek-editorial-queue
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial-queue
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Raccogli video e Community (09:00-12:20, 12:31-19:20, Roma)
        run: python3 tools/queue_collect.py
      - name: Memorizza nuove acquisizioni senza pubblicare il sito
        run: |
          git add data/queue_videos.json data/queue_community.json
          if ! git diff --cached --quiet; then
            git config user.name "ZazoomTek Queue Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Import YouTube in coda (non pubblicato)"
            git push origin HEAD:editorial-queue
          else
            echo "Nessun nuovo contenuto da accodare"
          fi
