name: Approved review queue watchdog for Cloudflare Pages
# Reviews are generated in Cloudflare's build workspace, NOT committed as
# HTML to GitHub main. Audit the real live article and ask the sole Master
# publisher to recover overdue approved content if needed.
on:
  # Run a live review audit when the watchdog or approved queue changes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-review-watchdog.yml'
      - 'editorial/review-publication-queue.json'
  schedule:
    # Hourly recovery; supplementary checks 20 minutes after editorial slots.
    - cron: '33 10-20 * * *'
      timezone: 'Europe/Rome'
    - cron: '35 10,15,20 * * *'
      timezone: 'Europe/Rome'
    - cron: '5 13,18 * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: zazoomtek-approved-review-live-watchdog
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved due reviews on LIVE Cloudflare and recover via sole Master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          import json,os,subprocess,time

          data=json.loads(Path('editorial/review-publication-queue.json').read_text(encoding='utf-8'))
          now=datetime.now(timezone.utc)
          # Give a scheduled run 20 minutes for its GitHub queue + Cloudflare build.
          overdue=[x for x in data.get('items',[]) if x.get('status')=='approved'
                   and datetime.fromisoformat(x['publish_at'].replace('Z','+00:00'))+timedelta(minutes=20)<=now]
          if not overdue:
              print('No reviews overdue by 20 minutes; nothing to recover.')
              raise SystemExit(0)
          missing=[]
          for item in overdue:
              path=item['target']
              url='https://zazoomtek.it/'+path
              try:
                  request=Request(url,headers={'User-Agent':'ZazoomTek-Publication-Watchdog/1.0',
                                               'Cache-Control':'no-cache'})
                  with urlopen(request,timeout=18) as response:
                      body=response.read().decode('utf-8','replace')
                      status=response.status
                  if (status==200 and '<article' in body.lower() and '<h1' in body.lower()
                          and url in body):
                      print('LIVE REVIEW OK:',url)
                      continue
                  missing.append(path)
                  print('::warning::Review missing/invalid on live:',url,'status',status)
              except HTTPError as exc:
                  if exc.code==404:
                      missing.append(path)
                      print('::warning::Review not found on live (404):',url)
                  else:
                      raise RuntimeError(f'Live status {exc.code} for {url}; do not dispatch blind build')
              except (URLError,TimeoutError) as exc:
                  raise RuntimeError(f'Cannot audit live {url}: {exc}; do not dispatch blind build')
          if missing:
              print('::warning::Overdue approved reviews require Cloudflare publication:',missing)
              # A receipt may update before article paths finish propagating.
              # Always report the source currently served on Cloudflare.
              try:
                  req=Request('https://zazoomtek.it/zt-release-status.json',
                              headers={'User-Agent':'ZazoomTek-Publication-Watchdog/1.0',
                                       'Cache-Control':'no-cache'})
                  with urlopen(req,timeout=18) as response:
                      receipt=json.loads(response.read().decode('utf-8','replace'))
                  print('CLOUDFLARE PUBLIC RECEIPT source_commit:',
                        receipt.get('source_commit'),'validated:',receipt.get('validated'))
              except (HTTPError,URLError,TimeoutError,ValueError) as exc:
                  print('::warning::Could not read public receipt:',str(exc))
              # An already running manual/urgent Master will finish or fail and
              # report its own outcome. Don't flood the concurrency queue.
              cmd=['gh','run','list','--repo',os.environ['GITHUB_REPOSITORY'],
                   '--workflow','master-orchestrator-production.yml',
                   '--limit','30','--json','status,event,displayTitle']
              active=json.loads(subprocess.run(
                  cmd,check=True,capture_output=True,text=True,timeout=30).stdout)
              pending=[x for x in active
                       if x.get('status') in ('queued','pending','in_progress','waiting','requested')
                       and (x.get('event')=='workflow_dispatch'
                            or (x.get('event')=='push' and
                                'manual Cloudflare release' in (x.get('displayTitle') or '')))]
              if pending:
                  print('MASTER RELEASE ALREADY QUEUED/RUNNING: no duplicate dispatch.',len(pending))
              else:
                  # Retired publish-approved-reviews.yml must NEVER be called.
                  subprocess.run(['gh','workflow','run','master-orchestrator-production.yml',
                                  '--repo',os.environ['GITHUB_REPOSITORY'],'--ref','main',
                                  '--field','mode=publish_pending'],check=True,timeout=30)
                  print('DISPATCHED: sole Master --publish-pending. This is a request, not proof of live deployment.')
          else:
              print('PASS: every overdue review is on Cloudflare.')
          PY
