name: Approved review queue watchdog for Cloudflare Pages
# This validates the editorial source, never bypasses the scheduled Pages deploy.
on:
  schedule:
    - cron: '33 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Make sure due approved reviews exist in GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from datetime import datetime,timezone
          import json,os,subprocess
          from pathlib import Path
          queue=Path('editorial/review-publication-queue.json')
          data=json.loads(queue.read_text(encoding='utf-8'))
          now=datetime.now(timezone.utc)
          due=[x for x in data.get('items',[])
               if x.get('status')=='approved' and
                  datetime.fromisoformat(x['publish_at'].replace('Z','+00:00'))<=now]
          missing=[x['target'] for x in due if not Path(x['target']).is_file()]
          if missing:
              print('::warning::Approved reviews awaiting GitHub source publishing:',missing)
              subprocess.run(['gh','workflow','run','publish-approved-reviews.yml',
                              '--repo',os.environ['GITHUB_REPOSITORY'],'--ref','main'],check=True)
          else:
              print('Approved reviews are present in GitHub; Cloudflare publishes them in the next batched release.')
          PY
