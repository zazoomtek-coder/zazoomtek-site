name: ZazoomTek services10 production schedule
# Five Europe/Rome slots. A failed/unknown video source must not block
# Community imports or deployment of previously verified content.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * *'
      timezone: 'Europe/Rome'
    - cron: '45 12 * * *'
      timezone: 'Europe/Rome'
    - cron: '15 15 * * *'
      timezone: 'Europe/Rome'
    - cron: '45 17 * * *'
      timezone: 'Europe/Rome'
    - cron: '15 20 * * *'
      timezone: 'Europe/Rome'
permissions:
  contents: write
jobs:
  community:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 services10/state.py restore community
      - name: Read Community posts
        run: python3 services10/01-community.py
      - name: Save Community archive
        run: python3 services10/state.py save community
      - uses: actions/upload-artifact@v4
        with:
          name: community-data
          path: services10-data/community.json
          if-no-files-found: ignore
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Official YouTube Data API v3: no extractor, browser cookies or scraping.
      - run: python3 services10/state.py restore videos
      - run: python3 services10/state.py restore pending
      - name: Collect all public YouTube uploads with preserved metadata
        env:
          ZT_YOUTUBE_CHANNEL_ID: UCJs0ZT10hUiPRD0UZtUpI1Q
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ZT_CONFIRMED_16X9_IDS: ${{ vars.ZT_CONFIRMED_16X9_IDS }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
        run: python3 services10/02-video-16x9.py
        continue-on-error: true
      - name: Restore formerly pending public YouTube uploads
        run: python3 services10/13-pending-public.py
      - name: Save imported public video archive
        run: python3 services10/state.py save videos
      - name: Save pending orientation-review queue
        run: python3 services10/state.py save pending
      - uses: actions/upload-artifact@v4
        with:
          name: video-data
          path: |
            services10-data/videos.json
            services10-data/pending-videos.json
          if-no-files-found: ignore
  snapshot-preview:
    concurrency:
      group: zazoomtek-cloudflare-production-release
      cancel-in-progress: false
    needs: [community, video]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore latest Community archive from this run
        if: needs.community.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: community-data
          path: services10-data
      - name: Reuse Community backup if the source was unavailable
        if: needs.community.result != 'success'
        run: python3 services10/state.py restore community
      - name: Restore verified videos when video collector succeeds
        if: needs.video.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: video-data
          path: services10-data
      - name: Retain archived videos when video collector is unavailable
        if: needs.video.result != 'success'
        run: python3 services10/state.py restore videos
      - name: Generate Watch pages independently from archived YouTube data
        run: python3 services10/02-video-pages.py
      - name: Generate written Community news independently
        run: python3 services10/03-home.py
      - name: Update featured Tech and Gaming
        run: python3 services10/04-in-evidenza.py
      - name: Update five Tech cards
        run: python3 services10/05-da-non-perdere.py
      - name: Update independent Web news
        run: python3 services10/06-notizie-web.py
      - name: Refresh independent review lists
        run: python3 services10/07-recensioni.py
      - name: Restore Studio edit link to interior pages
        run: python3 services10/08-studio.py
      - name: Refresh dates, chronological lists and editorial sidebars
        run: python3 services10/11-editorial-consistency.py
      - name: Apply unified A900 review layout and full-length thumbnail editorials
        run: python3 services10/12-unified-editorial.py
      - name: Unify site navigation and remove empty layout areas
        run: python3 services10/14-release-layout.py
      - name: Assemble static Cloudflare snapshot without Master
        run: python3 services10/09-layout.py
      - name: Apply global master: deduplicate snapshot, newest Home, shared menu and sidebars
        run: python3 services10/15-master-structural.py
      - name: Deploy published content to Cloudflare at scheduled slot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: python3 services10/10-cloudflare-publish.py --branch main --production
      - name: Purge Cloudflare production cache after successful deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
        run: python3 scripts/cloudflare-purge-after-release.py
