name: ZazoomTek services10 isolated schedule candidate
# This workflow exists ONLY in the review branch. Scheduled GitHub Actions
# run from the default branch, so these timers cannot publish production yet.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * *'
      timezone: 'Europe/Rome'
    - cron: '45 12 * * *'
      timezone: 'Europe/Rome'
    - cron: '15 15 * * *'
      timezone: 'Europe/Rome'
    - cron: '45 17 * * *'
      timezone: 'Europe/Rome'
    - cron: '15 20 * * *'
      timezone: 'Europe/Rome'
permissions:
  contents: write
jobs:
  community:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 services10/state.py restore community
      - name: Read Community posts
        run: python3 services10/01-community.py
      - name: Save Community archive
        run: python3 services10/state.py save community
      - uses: actions/upload-artifact@v4
        with:
          name: community-data
          path: services10-data/community.json
          if-no-files-found: ignore
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Official YouTube Data API v3: no extractor, browser cookies or scraping.
      - run: python3 services10/state.py restore videos
      - run: python3 services10/state.py restore pending
      - name: Enforce >180 seconds AND source 16:9 (owner OAuth or validated registry)
        env:
          ZT_YOUTUBE_CHANNEL_ID: UCJs0ZT10hUiPRD0UZtUpI1Q
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ZT_CONFIRMED_16X9_IDS: ${{ vars.ZT_CONFIRMED_16X9_IDS }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
        run: python3 services10/02-video-16x9.py
      - name: Save confirmed video archive
        run: python3 services10/state.py save videos
      - name: Save pending orientation-review queue
        run: python3 services10/state.py save pending
      - uses: actions/upload-artifact@v4
        with:
          name: video-data
          path: |
            services10-data/videos.json
            services10-data/pending-videos.json
          if-no-files-found: ignore
  snapshot-preview:
    needs: [community, video]
    if: needs.community.result == 'success' && needs.video.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true
      - name: Generate Community news and 16:9 Watch pages
        run: python3 services10/03-home.py
      - name: Update featured Tech and Gaming
        run: python3 services10/04-in-evidenza.py
      - name: Update five Tech cards
        run: python3 services10/05-da-non-perdere.py
      - name: Update independent Web news
        run: python3 services10/06-notizie-web.py
      - name: Refresh independent review lists
        run: python3 services10/07-recensioni.py
      - name: Restore Studio edit link to interior pages
        run: python3 services10/08-studio.py
      - name: Assemble static Cloudflare snapshot without Master
        run: python3 services10/09-layout.py
      - name: Audit generated HTML snapshot
        run: python3 services10/audit-generated-site.py --dist dist
      - name: Preview-only Cloudflare deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: python3 services10/10-cloudflare-publish.py --branch zt-services10-review
