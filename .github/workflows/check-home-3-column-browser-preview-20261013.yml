name: Check corrected 3-column Home preview in browser
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-home-3-column-browser-preview-20261013.yml'
permissions:
  contents: read
jobs:
  chrome-check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install browser test helper
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser
          mkdir -p /tmp/zt-verify
          cd /tmp/zt-verify
          npm install --no-save --silent playwright-core@1.56.0
      - name: Check public preview desktop and mobile after JS renders
        env:
          NODE_PATH: /tmp/zt-verify/node_modules
        run: |
          cat > /tmp/zt-verify/test.js <<'JS'
          const {chromium}=require("playwright-core");
          (async()=>{
           let browser;
           try{
            const chrome=process.env.CHROME_PATH||"/usr/bin/google-chrome";
            browser=await chromium.launch({headless:true,executablePath:chrome,args:["--no-sandbox","--disable-dev-shm-usage"]});
            const url="https://zazoomtek.it/anteprima-home-video-recensioni-45-35-20-20261013.html?browsercheck=three-reviews";
            for(const size of [{width:1600,height:1000,label:"desktop"},{width:1100,height:900,label:"tablet"},{width:390,height:844,label:"mobile"}]){
             const page=await browser.newPage({viewport:{width:size.width,height:size.height},deviceScaleFactor:1});
             const messages=[];
             page.on("pageerror",e=>messages.push(e.message));
             for(let attempt=0;attempt<24;attempt++){
               await page.goto(url+"&check="+attempt,{waitUntil:"domcontentloaded",timeout:45000});
               if(await page.locator(".ztp-news-rail #zt-popular-box").count())break;
               if(attempt===23)throw Error("New preview not yet served from public site");
               await page.waitForTimeout(4000);
             }
             await page.locator(".ztp-review-videos .ztp-review-card").first().waitFor({timeout:12000});
             const v=await page.evaluate(()=>{
              const box=sel=>{let el=document.querySelector(sel);if(!el)return null;let r=el.getBoundingClientRect();return {x:r.left,y:r.top,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};
              return {
               title:document.title,
               tech:box(".ztp-news-tech"),gaming:box(".ztp-news-gaming"),rail:box(".ztp-news-rail"),
               top:box(".ztp-top"),guide:box("#ztHomeGuide"),news:box(".ztp-news-area"),
               leftVideo:box(".ztp-top-videos"),
               popularMoved:!!document.querySelector(".ztp-news-rail #zt-popular-box"),
               gamingInsideMoved:!!document.querySelector(".ztp-news-rail .zt-special-box[data-special-section='gaming']"),
               articleCount:document.querySelectorAll(".ztp-news-item").length,
               videos:document.querySelectorAll(".ztp-review-videos .ztp-review-card").length,
               reviewTitle:document.querySelector(".ztp-review-videos>h2")?.textContent.trim(),
               reviewVideoIds:[...document.querySelectorAll(".ztp-review-videos .ztp-review-card a")].map(a=>new URL(a.href).searchParams.get("v")),
               reviewYoutubeLinks:[...document.querySelectorAll(".ztp-review-videos .ztp-review-card a")].every(a=>a.href.startsWith("https://www.youtube.com/watch?v=")),
               completeVideos:!!document.querySelector(".ztp-news-rail .zt-video-stack #ztStackList"),
               fullVideoCards:document.querySelectorAll(".ztp-news-rail .zt-video-stack #ztStackList .zt-stack-card").length,
               videoAfterInside:(()=>{const a=document.querySelector(".ztp-news-rail .zt-special-box[data-special-section='gaming']");const b=document.querySelector(".ztp-news-rail .zt-video-stack");return !!a&&!!b&&!!(a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING)})(),
               scrollWidth:document.documentElement.scrollWidth,viewportWidth:window.innerWidth,
               gridCols:getComputedStyle(document.querySelector(".ztp-three-columns")).gridTemplateColumns,
               availableGridWidth:document.querySelector(".ztp-three-columns").getBoundingClientRect().width-32,
               cardImages:[...document.querySelectorAll(".ztp-news-tech .article-image")].slice(0,3).map(img=>({w:img.getBoundingClientRect().width,h:img.getBoundingClientRect().height})),
               editorialHeading:!!document.querySelector(".ztp-news-rail .ztp-editorial-heading"),
               impactMoved:!!document.querySelector(".ztp-news-rail .zt-special-box[data-special-section='tech']"),
               gamingLabels:document.querySelectorAll(".ztp-news-gaming .ztp-gaming-kind").length,
              }
             });
             console.log(size.label,JSON.stringify(v));
             if(!v.tech||!v.gaming||!v.rail||!v.popularMoved||!v.gamingInsideMoved||!v.impactMoved||!v.editorialHeading||v.gamingLabels!==7||v.articleCount!==15||v.videos!==3||!v.top||!v.guide||!v.news)throw Error("Missing sections or three latest video reviews on "+size.label);
             if(v.reviewTitle!=="ULTIME VIDEO RECENSIONI"||!v.reviewYoutubeLinks)throw Error("Video reviews must have correct title and direct YouTube links");
             if(!v.completeVideos||v.fullVideoCards<5||!v.videoAfterInside)throw Error("ULTIMI VIDEO module must remain whole, after Gaming Inside");
             if(v.reviewVideoIds[0]!=="WwGAaKGfoGY")throw Error("Most recent review should be Sesame Street");
             if(size.label!=="mobile" && Math.abs(v.top.bottom-v.leftVideo.bottom)>5)throw Error("Whitespace below latest videos: "+(v.top.bottom-v.leftVideo.bottom)+"px");
             if(v.news.y < v.guide.y)throw Error("News rendered above Guide on "+size.label);
             const precedingBottom=size.label==="desktop"?v.guide.bottom:v.top.bottom;
             if(v.news.y-precedingBottom > 100)throw Error("Empty gap before news: "+(v.news.y-precedingBottom)+"px on "+size.label);
             if(size.label==="mobile" && Math.abs(v.leftVideo.y-v.guide.bottom)>40)throw Error("Video section leaves blank gap after Guide");
             if(size.label==="desktop"){
              if(!(v.tech.x<v.gaming.x && v.gaming.x<v.rail.x && Math.abs(v.tech.y-v.rail.y)<4))throw Error("Not three side-by-side columns");
              const actual=[v.tech.w,v.gaming.w,v.rail.w].map(w=>w/v.availableGridWidth);
              const expected=[.45,.35,.20];
              if(actual.some((x,i)=>Math.abs(x-expected[i])>.012))throw Error("Wrong desktop ratios "+JSON.stringify(actual));
              if(v.cardImages[0].w<v.tech.w*.8)throw Error("Featured Tech image is not large enough");
              if(v.leftVideo.h<v.guide.bottom-v.top.y-6)throw Error("Review video column does not align with Guide");
             }else if(size.label==="tablet"){
              if(!(v.tech.x<v.gaming.x&&v.rail.y>v.tech.y))throw Error("Tablet must use two columns with editorial boxes below");
             }else{
              if(!(v.tech.y<v.gaming.y && v.gaming.y<v.rail.y))throw Error("Mobile cards not stacked");
              if(v.scrollWidth>v.viewportWidth+8)throw Error("Horizontal mobile overflow "+v.scrollWidth+"px");
             }
             await page.screenshot({path:"/tmp/zt-verify/"+size.label+".png",fullPage:false});
             console.log("PASS "+size.label+": 3-column responsive structure and real Home widgets intact");
             await page.close();
            }
           }finally{if(browser)await browser.close()}
          })().catch(e=>{console.error("FAIL",e);process.exit(1)})
          JS
          node /tmp/zt-verify/test.js
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zazoomtek-3col-preview-desktop-mobile-20261013
          path: /tmp/zt-verify/*.png
          if-no-files-found: ignore
