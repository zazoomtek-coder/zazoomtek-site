name: Test YouTube Community extractor
on:
  pull_request:
    paths:
      - "tools/community_youtube.py"
      - "tools/test_community_youtube.py"
      - "tools/sync_videos.py"
      - "tools/emergency_sync.py"
      - "tools/scheduled_editorial_import.py"
      - "tools/test_sync_videos.py"
      - "tools/test_scheduled_editorial_import.py"
      - "tools/test_emergency_sync.py"
      - "tools/queue_collect.py"
      - "tools/test_youtube_community_import.py"
      - ".github/workflows/community-extractor-tests.yml"
  push:
    branches:
      - "fix/youtube-community-full-text"
    paths:
      - "tools/community_youtube.py"
      - "tools/test_community_youtube.py"
      - "tools/sync_videos.py"
      - "tools/emergency_sync.py"
      - "tools/scheduled_editorial_import.py"
      - "tools/test_sync_videos.py"
      - "tools/test_scheduled_editorial_import.py"
      - "tools/test_emergency_sync.py"
      - ".github/workflows/community-extractor-tests.yml"
permissions:
  contents: read
jobs:
  community-extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifica sintassi estrattore e test
        run: |
          python3 -m py_compile tools/community_youtube.py tools/sync_videos.py tools/emergency_sync.py tools/scheduled_editorial_import.py tools/queue_collect.py
          python3 tools/test_community_youtube.py
          python3 tools/test_sync_videos.py
          python3 tools/test_scheduled_editorial_import.py
          python3 tools/test_emergency_sync.py
          python3 tools/test_youtube_community_import.py
