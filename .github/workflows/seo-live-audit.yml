name: ZazoomTek - SEO sito online (sola lettura, nessun deploy)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate audit Python syntax
        run: python3 -m py_compile tools/seo_live_audit.py
      - name: Read public site SEO responses
        run: python3 tools/seo_live_audit.py --json seo-live-audit.json
      - name: Save audit report even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZazoomTek-Live-SEO-Audit
          path: seo-live-audit.json
          if-no-files-found: warn
          retention-days: 14
