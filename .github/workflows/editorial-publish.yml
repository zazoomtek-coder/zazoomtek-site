name: ZazoomTek - pubblicazione richiesta da Cloudflare Cron (Roma)
# YouTube collection runs separately every five minutes. This workflow can publish only in the three Rome slots.
on:
  # UTC candidates cover CET and CEST. A delayed GitHub schedule may still release up to 55 minutes late; the Rome guard rejects the adjacent one-hour alternative.
  schedule:
    - cron: "30 10,11 * * *"
    - cron: "0 14,15 * * *"
    - cron: "30 17,18 * * *"
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Pubblica subito contenuti editoriali (avvio manuale esplicito del proprietario)"
        required: false
        type: boolean
        default: false
      release_slot:
        description: "Slot di pubblicazione Europe/Rome: 12:30, 16:00 o 19:30"
        required: false
        type: string
permissions:
  contents: write
  deployments: write
concurrency:
  group: zazoomtek-pages-production
  cancel-in-progress: false
jobs:
  rome-slot-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_slot != 'poll' }}
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      slot: ${{ steps.check.outputs.slot }}
    steps:
      - name: Valida esclusivamente i tre slot editoriali Europe/Rome
        id: check
        shell: bash
        env:
          REQUESTED_SLOT: ${{ inputs.release_slot }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            now_epoch="$(TZ=Europe/Rome date +%s)"
            REQUESTED_SLOT=""
            for candidate in "12:30" "16:00" "19:30"; do
              target_epoch="$(TZ=Europe/Rome date -d "$(TZ=Europe/Rome date +%F) $candidate" +%s)"
              delta=$((now_epoch - target_epoch))
              if [ "$delta" -ge 0 ] && [ "$delta" -le 3300 ]; then
                REQUESTED_SLOT="$candidate"
                break
              fi
            done
          fi
          echo "slot=$REQUESTED_SLOT" >> "$GITHUB_OUTPUT"
          case "$REQUESTED_SLOT" in
            "12:30"|"16:00"|"19:30") ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "STOP: slot richiesto '$REQUESTED_SLOT' non valido."
              exit 0
              ;;
          esac
          now_epoch="$(TZ=Europe/Rome date +%s)"
          target_epoch="$(TZ=Europe/Rome date -d "$(TZ=Europe/Rome date +%F) $REQUESTED_SLOT" +%s)"
          delta=$((now_epoch - target_epoch))
          if [ "$delta" -lt 0 ] || [ "$delta" -gt 3300 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "STOP: dispatch anticipato o oltre 55 minuti dallo slot $REQUESTED_SLOT (scarto ${delta}s)."
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "OK: slot $REQUESTED_SLOT Europe/Rome accettato con ritardo ${delta}s (finestra 0-3300s)."
  import-and-publish:
    needs: rome-slot-guard
    if: ${{ inputs.publish_now == true || needs.rome-slot-guard.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CF_PAGES_BRANCH: main
      CF_PAGES_URL: https://zazoomtek.it
      EDITORIAL_FORCE_RELEASE: ${{ inputs.publish_now }}
      EDITORIAL_REQUESTED_SLOT: ${{ needs.rome-slot-guard.outputs.slot }}
      EDITORIAL_SLOT_GATE_PASSED: ${{ needs.rome-slot-guard.outputs.allowed }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ZAZOOMTEK_SEO_MODEL: gpt-4o-mini
    steps:
      - name: Carica la versione ufficiale di main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parsing Python e JavaScript prima di qualsiasi pubblicazione
        run: |
          python3 -m compileall -q tools
          python3 -m py_compile tools/audit_trace.py
          node --check assets/js/site.js
          node --check assets/js/studio-v2.js
          node --input-type=module --check < 'functions/api/studio/[[path]].js'
          node --input-type=module --check < cloudflare/cron-publisher/src/index.js
      - name: Recupera eventuale coda YouTube senza bloccare il caricamento diretto
        run: git fetch --no-tags origin editorial-queue || echo "Coda non raggiungibile; importazione diretta ancora disponibile"
      - name: IMPORTA ORA i nuovi post Community, video YouTube e notizie RSS
        run: python3 tools/scheduled_editorial_import.py
      - name: Verifica che entrambe le sorgenti YouTube siano state importate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('.editorial-import-manifest.json').read_text(encoding='utf-8'))
          status = manifest.get('source_status', {})
          failed = [name for name in ('videos', 'community') if status.get(name) is not True]
          if failed:
              raise SystemExit('Pubblicazione sospesa: importazione YouTube incompleta: ' + ', '.join(failed) + '. La coda resta disponibile per il prossimo slot.')
          print('Entrambe le sorgenti YouTube verificate:', status)
          PY
      - name: Confronta i dati reali con l'ultima pubblicazione riuscita
        run: python3 tools/editorial_slot_gate.py prepare
      - name: Rigenera il sito SpotNews con le notizie appena importate
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: python3 tools/build.py
      - name: Verifica presenza dei file editoriali generati
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: test -s dist/index.html && test -s dist/sitemap.xml && test -s dist/news-sitemap.xml && test -s dist/robots.txt && test -s dist/_routes.json && test -s dist/BingSiteAuth.xml && test -s build-trace-audit.json && cmp -s BingSiteAuth.xml dist/BingSiteAuth.xml
      - name: Autorizza la pubblicazione nello slot o su richiesta manuale del proprietario
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: python3 tools/editorial_slot_gate.py authorize
      - name: Salva i dati verificati in main solo dopo l'autorizzazione
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        run: |
          git add data/community_imported.json data/videos.json data/web.json data/studio_posts.json data/studio_overrides.json
          if test -d assets/uploads; then git add -A assets/uploads; fi
          if ! git diff --cached --quiet; then
            git config user.name "ZazoomTek Scheduled Import"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[CF-Pages-Skip] Importa contenuti editoriali verificati"
            git push origin HEAD:main
          else
            echo "Nessuna modifica editoriale da salvare."
          fi
      - name: Pubblica i nuovi dati su Cloudflare Pages zazoomtek.it
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zazoomtek-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verifica sul sito pubblico articoli Community e video YouTube
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        run: python3 tools/verify_editorial_live.py
      - name: Memorizza conferma del deploy editoriale
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        run: |
          python3 tools/editorial_slot_gate.py stamp
          git add data/editorial_release_state.json
          git config user.name "ZazoomTek Release Receipt"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[CF-Pages-Skip] Conferma deploy editoriale"
          git push origin HEAD:main
      - name: Verifica l'esito reale delle importazioni YouTube
        if: always()
        run: |
          if [ ! -s .editorial-import-manifest.json ]; then
            echo "Manifest YouTube assente: importazione non avviata o preflight interrotto."
            exit 0
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path(".editorial-import-manifest.json").read_text(encoding="utf-8"))
          status = manifest.get("source_status", {})
          failed = [name for name in ("videos", "community") if status.get(name) is not True]
          if failed:
              print("AVVISO: importazione YouTube parziale:", ", ".join(failed),
                    "- pubblicazione dei contenuti disponibili completata; il prossimo ciclo riproverà.")
          else:
              print("YOUTUBE IMPORT VERIFIED:", status)
          PY
