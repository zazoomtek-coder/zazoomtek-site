name: ZazoomTek - slot pubblicazione Roma
on:
  schedule:
    # Un solo avvio automatico per ciascuno dei due slot quotidiani.
    - cron: '30 12,19 * * *'
      timezone: Europe/Rome
  workflow_dispatch:
permissions:
  contents: write
  deployments: write
concurrency:
  group: zazoomtek-pages-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_PAGES_BRANCH: main
      CF_PAGES_URL: https://zazoomtek.it
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Blocca esecuzioni tardive o fuori dagli slot 12:30 e 19:30
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo("Europe/Rome"))
          slot=""
          for h in (12,19):
              target=now.replace(hour=h,minute=30,second=0,microsecond=0)
              if timedelta(0)<=now-target<=timedelta(minutes=5):
                  slot=f"{h:02d}:30"
                  break
          with open(os.environ["GITHUB_ENV"],"a") as output:
              output.write("EDITORIAL_SLOT="+slot+"\n")
          print("Ora Roma:",now.isoformat(),"slot autorizzato:",slot or "nessuno")
          PY
      - name: Acquisisci la coda senza modificare editorial-queue
        if: env.EDITORIAL_SLOT != ''
        run: git fetch --no-tags --depth=1 origin editorial-queue
      - name: Applica gli articoli e video in un solo blocco
        if: env.EDITORIAL_SLOT != ''
        run: python3 tools/queue_publish.py
      - name: Pubblica su main solo nuovi contenuti o configurazioni già approvate
        if: env.EDITORIAL_SLOT != ''
        run: |
          git add data/videos.json data/community_imported.json data/studio_posts.json data/studio_overrides.json
          if [ -f .github/STUDIO_PENDING_PRODUCTION_DEPLOY ]; then
            git rm .github/STUDIO_PENDING_PRODUCTION_DEPLOY
            echo "Rilascio Studio V2: sessione Production pronta per lo slot autorizzato"
          fi
          if ! git diff --cached --quiet; then
            git config user.name "ZazoomTek Publish Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[CF-Pages-Skip] Slot ${EDITORIAL_SLOT} Europe/Rome: aggiorna coda ZazoomTek"
            git push origin HEAD:main
            echo "DID_PUBLISH=true" >> "$GITHUB_ENV"
          else
            echo "Slot senza nuovi contenuti, nessun deploy"
          fi
      - name: Genera il sito dal nuovo snapshot editoriale
        if: env.DID_PUBLISH == 'true'
        run: python3 tools/build.py
      - name: Controlla i file di produzione
        if: env.DID_PUBLISH == 'true'
        run: test -s dist/index.html && test -s dist/_routes.json && test -s dist/sitemap.xml
      - name: Pubblica direttamente su Cloudflare Pages, senza integrazione Git
        if: env.DID_PUBLISH == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zazoomtek-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
