name: ZazoomTek - 2 slot importazione e pubblicazione (Roma)
on:
  schedule:
    # UTC puro per ri-registrare il cron anche su runner con scheduler locale
    # non affidabile. 10/17 UTC in estate, 11/18 UTC in inverno.
    # La guardia Europe/Rome decide: soltanto 12:30 e 19:30 locali,
    # e un solo deploy per slot. Le altre invocazioni terminano senza deploy.
    - cron: '20,25,30,34,39 10,11,17,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
  deployments: write
concurrency:
  group: zazoomtek-pages-production
  cancel-in-progress: false
jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CF_PAGES_BRANCH: main
      CF_PAGES_URL: https://zazoomtek.it
    steps:
      - name: Carica la versione ufficiale di main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 1. IMPORTAZIONE REALE in data/, mai soltanto il vecchio JSON.
      # La coda editoriale e' una riserva, non un prerequisito.
      - name: Recupera eventuale coda YouTube senza bloccare il caricamento diretto
        run: git fetch --no-tags origin editorial-queue || echo "Coda non raggiungibile; importazione diretta ancora disponibile"
      - name: IMPORTA ORA i nuovi post Community, video YouTube e notizie RSS
        run: python3 tools/scheduled_editorial_import.py
      - name: Confronta i dati reali con l'ultima pubblicazione riuscita
        run: python3 tools/editorial_slot_gate.py prepare

      # Preserve exact previously VERIFIED production version, before any
      # modification or deployment. Recovery via Git backup branch and ZIP.
      - name: Salva prima la versione funzionante in un branch BACKUP e ZIP verificato
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: python3 tools/release_backup.py backup
      - name: Conserva ZIP ripristinabile del sito precedente su GitHub Actions
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ZazoomTek-BACKUP-ULTIMO-SITO-FUNZIONANTE
          path: ZazoomTek_WORKING_BACKUP_*.zip
          retention-days: 90
          if-no-files-found: error
      - name: Registra risultato fonti YouTube, senza bloccare modifiche approvate
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: |
          if test -f import_source_status.json; then
            cat import_source_status.json
          else
            echo "::warning::Importer did not produce its required source status"
          fi

      # Nessun aggiornamento? NESSUN deploy, nessun file grafico toccato.
      - name: Salva le news e le pubblicazioni Studio in main prima del deploy
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: |
          git add data/community_imported.json data/videos.json data/web.json data/studio_posts.json data/studio_overrides.json
          if test -d assets/uploads; then git add -A assets/uploads; fi
          if ! git diff --cached --quiet; then
            git config user.name "ZazoomTek Scheduled Import"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[CF-Pages-Skip] Importa YouTube, RSS e pubblicazioni approvate Studio prima del deploy"
            git push origin HEAD:main
          else
            echo "Nessun nuovo elemento da scrivere: verificare eventuale deploy precedente incompleto."
          fi
      - name: Rigenera il sito SpotNews con le notizie appena importate
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: python3 tools/build.py
      - name: Verifica presenza dei file editoriali generati
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: test -s dist/index.html && test -s dist/sitemap.xml && test -s dist/_routes.json

      # 2. PUBBLICAZIONE SOLO NEI DUE SLOT. Nessun trigger cron
      # puo' bypassare il controllo temporale.
      - name: Attendi l'ora esatta e impedisci deploy fuori dalle 12:30/19:30
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: python3 tools/editorial_slot_gate.py authorize
      - name: Pubblica i nuovi dati su Cloudflare Pages zazoomtek.it
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zazoomtek-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verifica DOMINIO PUBBLICO e CSS effettivamente online (no falsa conferma)
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        run: python3 tools/verify_live_release.py
      - name: Memorizza conferma del deploy riuscito ed evita doppioni nello slot
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        run: |
          python3 tools/editorial_slot_gate.py stamp
          git add data/editorial_release_state.json
          git config user.name "ZazoomTek Release Receipt"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[CF-Pages-Skip] Conferma deploy editoriale dello slot ${EDITORIAL_TARGET}"
          git push origin HEAD:main
