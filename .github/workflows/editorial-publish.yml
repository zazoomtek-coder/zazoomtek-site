name: ZazoomTek - slot pubblicazione Roma
on:
  schedule:
    - cron: '30,40,50 10,11,17,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zazoomtek-production-editorial
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica finestra 12:30 o 19:30 Europe/Rome
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo("Europe/Rome"))
          slot=""
          for h in (12,19):
              target=now.replace(hour=h,minute=30,second=0,microsecond=0)
              if timedelta(0)<=now-target<=timedelta(minutes=45):
                  slot=f"{h:02d}:30"
                  break
          with open(os.environ["GITHUB_ENV"],"a") as output:
              output.write("EDITORIAL_SLOT="+slot+"\n")
          print("Ora Roma:",now.isoformat(),"slot autorizzato:",slot or "nessuno")
          PY
      - name: Acquisisci la coda senza modificare editorial-queue
        if: env.EDITORIAL_SLOT != ''
        run: git fetch --no-tags --depth=1 origin editorial-queue
      - name: Applica gli articoli e video in un solo blocco
        if: env.EDITORIAL_SLOT != ''
        run: python3 tools/queue_publish.py
      - name: Pubblica su main solo se ci sono variazioni editoriali
        if: env.EDITORIAL_SLOT != ''
        run: |
          git add data/videos.json data/community_imported.json data/studio_posts.json data/studio_overrides.json
          if ! git diff --cached --quiet; then
            git config user.name "ZazoomTek Publish Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Slot ${EDITORIAL_SLOT} Europe/Rome: pubblica coda ZazoomTek"
            git push origin HEAD:main
          else
            echo "Slot senza nuovi contenuti, nessun deploy"
          fi
