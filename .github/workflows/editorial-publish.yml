name: ZazoomTek - pubblicazione richiesta da Cloudflare Cron (Roma)
# Scheduler exclusively Cloudflare Workers; GitHub remains execution engine.
on:
  workflow_dispatch:
permissions:
  contents: write
  deployments: write
concurrency:
  group: zazoomtek-pages-production
  cancel-in-progress: false
jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CF_PAGES_BRANCH: main
      CF_PAGES_URL: https://zazoomtek.it
    steps:
      - name: Carica la versione ufficiale di main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parsing Python e JavaScript prima di qualsiasi pubblicazione
        run: |
          python3 -m compileall -q tools
          node --check assets/js/site.js
          node --check assets/js/studio-v2.js
          node --input-type=module --check < 'functions/api/studio/[[path]].js'
          node --input-type=module --check < cloudflare/cron-publisher/src/index.js

      # 1. IMPORTAZIONE REALE in data/, mai soltanto il vecchio JSON.
      # La coda editoriale e' una riserva, non un prerequisito.
      - name: Recupera eventuale coda YouTube senza bloccare il caricamento diretto
        run: git fetch --no-tags origin editorial-queue || echo "Coda non raggiungibile; importazione diretta ancora disponibile"
      - name: IMPORTA ORA i nuovi post Community, video YouTube e notizie RSS
        run: python3 tools/scheduled_editorial_import.py
      - name: Confronta i dati reali con l'ultima pubblicazione riuscita
        run: python3 tools/editorial_slot_gate.py prepare

      # Validate the generated site before writing imported data to main.
      - name: Rigenera il sito SpotNews con le notizie appena importate
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: python3 tools/build.py
      - name: Verifica presenza dei file editoriali generati
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: test -s dist/index.html && test -s dist/sitemap.xml && test -s dist/news-sitemap.xml && test -s dist/robots.txt && test -s dist/_routes.json && test -s dist/BingSiteAuth.xml && cmp -s BingSiteAuth.xml dist/BingSiteAuth.xml

      # 2. PUBBLICAZIONE SOLO NEI TRE SLOT. Nessun trigger cron
      # puo' bypassare il controllo temporale.
      - name: Attendi lo slot italiano e impedisci deploy fuori dalle tre finestre
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: python3 tools/editorial_slot_gate.py authorize
      - name: Salva i dati verificati in main solo dopo l'autorizzazione dello slot
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        run: |
          git add data/community_imported.json data/videos.json data/web.json data/studio_posts.json data/studio_overrides.json
          if test -d assets/uploads; then git add -A assets/uploads; fi
          if ! git diff --cached --quiet; then
            git config user.name "ZazoomTek Scheduled Import"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[CF-Pages-Skip] Importa contenuti verificati nello slot autorizzato"
            git push origin HEAD:main
          else
            echo "Nessuna modifica editoriale da salvare."
          fi
      - name: Pubblica i nuovi dati su Cloudflare Pages zazoomtek.it
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zazoomtek-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Memorizza conferma del deploy riuscito ed evita doppioni nello slot
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        run: |
          python3 tools/editorial_slot_gate.py stamp
          git add data/editorial_release_state.json
          git config user.name "ZazoomTek Release Receipt"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[CF-Pages-Skip] Conferma deploy editoriale dello slot ${EDITORIAL_TARGET}"
          git push origin HEAD:main
