name: ZazoomTek - pubblicazione richiesta da Cloudflare Cron (Roma)
# Cloudflare may dispatch this workflow frequently; the first job is a strict Europe/Rome slot gate.
# Manual publish_now remains an explicit owner-only override.
on:
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Pubblica subito contenuti editoriali (avvio manuale esplicito del proprietario)"
        required: false
        type: boolean
        default: false
      release_slot:
        description: "Slot Europe/Rome richiesto dal Worker"
        required: false
        type: string
permissions:
  contents: write
  deployments: write
concurrency:
  group: zazoomtek-pages-production
  cancel-in-progress: false
jobs:
  rome-slot-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Blocca immediatamente ogni chiamata fuori dagli slot italiani
        id: check
        shell: bash
        env:
          REQUESTED_SLOT: ${{ inputs.release_slot }}
        run: |
          case "$REQUESTED_SLOT" in
            "12:30"|"16:00"|"19:30") ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "STOP: slot richiesto '$REQUESTED_SLOT' non valido."
              exit 0
              ;;
          esac
          now_epoch="$(TZ=Europe/Rome date +%s)"
          target_epoch="$(TZ=Europe/Rome date -d "$(TZ=Europe/Rome date +%F) $REQUESTED_SLOT" +%s)"
          delta=$((now_epoch - target_epoch))
          absolute_delta=$((delta < 0 ? -delta : delta))
          if [ "$absolute_delta" -gt 600 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "STOP: dispatch fuori dalla tolleranza di 10 minuti per lo slot $REQUESTED_SLOT (scarto ${delta}s)."
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "OK: slot $REQUESTED_SLOT Europe/Rome accettato con scarto ${delta}s (tolleranza ±600s)."
  import-and-publish:
    needs: rome-slot-guard
    if: ${{ inputs.publish_now == true || needs.rome-slot-guard.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CF_PAGES_BRANCH: main
      CF_PAGES_URL: https://zazoomtek.it
      EDITORIAL_FORCE_RELEASE: ${{ inputs.publish_now }}
      EDITORIAL_REQUESTED_SLOT: ${{ inputs.release_slot }}
      EDITORIAL_SLOT_GATE_PASSED: ${{ needs.rome-slot-guard.outputs.allowed }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ZAZOOMTEK_SEO_MODEL: gpt-4o-mini
    steps:
      - name: Carica la versione ufficiale di main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parsing Python e JavaScript prima di qualsiasi pubblicazione
        run: |
          python3 -m compileall -q tools
          python3 -m py_compile tools/audit_trace.py
          node --check assets/js/site.js
          node --check assets/js/studio-v2.js
          node --input-type=module --check < 'functions/api/studio/[[path]].js'
          node --input-type=module --check < cloudflare/cron-publisher/src/index.js
      - name: Recupera eventuale coda YouTube senza bloccare il caricamento diretto
        run: git fetch --no-tags origin editorial-queue || echo "Coda non raggiungibile; importazione diretta ancora disponibile"
      - name: IMPORTA ORA i nuovi post Community, video YouTube e notizie RSS
        run: python3 tools/scheduled_editorial_import.py
      - name: Confronta i dati reali con l'ultima pubblicazione riuscita
        run: python3 tools/editorial_slot_gate.py prepare
      - name: Rigenera il sito SpotNews con le notizie appena importate
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: python3 tools/build.py
      - name: Verifica presenza dei file editoriali generati
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: test -s dist/index.html && test -s dist/sitemap.xml && test -s dist/news-sitemap.xml && test -s dist/robots.txt && test -s dist/_routes.json && test -s dist/BingSiteAuth.xml && test -s build-trace-audit.json && cmp -s BingSiteAuth.xml dist/BingSiteAuth.xml
      - name: Conserva il report completo di tracciabilità della build
        if: always() && env.EDITORIAL_NEEDS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ZazoomTek-Editorial-Trace-Audit
          path: build-trace-audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Autorizza la pubblicazione nello slot o su richiesta manuale del proprietario
        if: env.EDITORIAL_NEEDS_RELEASE == 'true'
        run: python3 tools/editorial_slot_gate.py authorize
      - name: Salva i dati verificati in main solo dopo l'autorizzazione
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        run: |
          git add data/community_imported.json data/videos.json data/web.json data/studio_posts.json data/studio_overrides.json
          if test -d assets/uploads; then git add -A assets/uploads; fi
          if ! git diff --cached --quiet; then
            git config user.name "ZazoomTek Scheduled Import"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[CF-Pages-Skip] Importa contenuti editoriali verificati"
            git push origin HEAD:main
          else
            echo "Nessuna modifica editoriale da salvare."
          fi
      - name: Pubblica i nuovi dati su Cloudflare Pages zazoomtek.it
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zazoomtek-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verifica sul sito pubblico ogni articolo Studio e Community di oggi
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        run: python3 tools/verify_editorial_live.py
      - name: Memorizza conferma del deploy editoriale
        if: env.EDITORIAL_RELEASE_AUTHORIZED == 'true'
        run: |
          python3 tools/editorial_slot_gate.py stamp
          git add data/editorial_release_state.json
          git config user.name "ZazoomTek Release Receipt"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[CF-Pages-Skip] Conferma deploy editoriale"
          git push origin HEAD:main
