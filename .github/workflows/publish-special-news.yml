name: Publish approved Tech Impact and Gaming Inside articles
# Starts after verified article approval or manual dispatch.
# Recovery 2026-10-12: rebuild already-approved Tech Impact and Gaming Inside stories, then refresh Home.
on:
  workflow_dispatch:
  # Hourly recovery: approved stories must not remain unpublished when a
  # cross-workflow dispatch is missed or the old archive layout has changed.
  schedule:
    - cron: '53 * * * *'
  push:
    branches: [main]
    paths:
      - 'approved-special-articles.json'
      - 'scripts/publish-special-news.py'
      - 'scripts/build-special-covers.py'
      - '.github/workflows/publish-special-news.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: special-news-independent-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build against the latest published homepage
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Validate Python syntax before touching pages
        run: |
          python3 -m py_compile scripts/publish-special-news.py scripts/build-special-covers.py scripts/update-youtube-posts.py scripts/discover-special-news.py
          python3 -m json.tool approved-special-articles.json >/dev/null
      - name: Validate archive replacement does not erase Community banners
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          for section, archive in (("tech","tech-today.html"),("gaming","gaming-today.html")):
              text=Path(archive).read_text(encoding="utf-8")
              pattern=(r'<div class="news-list" id="newsList" data-auto-articles="'
                       +section+r'">.*?</div>(?=\s*(?:<!-- ZT_COMMUNITY_BANNER_START -->|</section>))')
              found=list(re.finditer(pattern,text,re.S))
              assert len(found)==1,(archive,"invalid archive list marker",len(found))
              assert "<!-- ZT_COMMUNITY_BANNER_START -->" in text[found[0].end():],archive
          from importlib.util import module_from_spec, spec_from_file_location
          spec=spec_from_file_location("special_publisher","scripts/publish-special-news.py")
          publisher=module_from_spec(spec);spec.loader.exec_module(publisher)
          approved=json.loads(Path("approved-special-articles.json").read_text(encoding="utf-8")).get("articles",[])
          assert approved and all(publisher.valid(x) for x in approved),"Approved article invalid"
          print("Both archives safe; Community preserved; approved articles valid:",len(approved))
          PY
      - name: Install free image optimizer
        run: python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Verify original cover generation offline
        run: python3 scripts/build-special-covers.py --self-test
      - name: Find rights-cleared images and prepare lightweight WebP covers
        run: python3 scripts/build-special-covers.py
      - name: Build approved articles and separate archives
        run: python3 scripts/publish-special-news.py
      - name: Refresh homepage with previously scanned independent sources
        run: |
          if [ -s trending-sources.json ]; then
            python3 scripts/trending-crosscheck.py --apply
          fi
      - name: Commit published articles atomically
        id: publish_commit
        run: |
          git config user.name "ZazoomTek Editorial Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- featured-carousel.json trending-match-report.json tech-today.html gaming-today.html special-featured.json special-cover-manifest.json
          # Keep only generated licensed/fallback covers; do not stage unrelated files.
          shopt -s nullglob
          cover_files=(assets/special/*.webp)
          if [ ${#cover_files[@]} -gt 0 ]; then git add -- "${cover_files[@]}"; fi
          shopt -s nullglob
          article_files=(tech-impact-*.html gaming-inside-*.html)
          if [ ${#article_files[@]} -gt 0 ]; then git add -- "${article_files[@]}"; fi
          if ! git diff --cached --quiet; then
            git commit -m "content: publish editorially approved special articles"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "published=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git rebase --abort || true
              sleep "$((attempt * 5))"
            done
            echo "Could not synchronize generated content safely."
            exit 1
          fi
      # Publication always uses the same serialized latest-main deployment queue.
      # The special desk never writes the YouTube-owned index.html or news.html.
      - name: Queue special-news and carousel publication
        if: steps.publish_commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site-live.yml --ref main
