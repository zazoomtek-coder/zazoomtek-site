name: Publish approved standard NEWS
on:
  push:
    paths:
      - standard-news.json
      - scripts/build-standard-news.py
      - .github/workflows/publish-standard-news.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-standard-news
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install free image tooling
        run: python3 -m pip install 'Pillow>=10,<13'
      - name: Publish standalone NEWS and free WebP covers
        run: python3 scripts/build-standard-news.py
      - name: Commit new article pages and images only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- manual-news.json standard-cover-manifest.json news-*.html assets/special/news-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "content: publish four approved standard NEWS and optimized covers"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
