name: Verify live Esplora Video Gameplay once (2026-10-13)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-esplora-gameplay-20261013.yml'
permissions:
  contents: read
jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify actual public HTML, Javascript, video JSON and cache policy
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          base="https://zazoomtek.it"
          suffix="/zt-visual.js?v=20261013gameplayCacheFix2"
          def get(path):
              req=urllib.request.Request(base+path,headers={"User-Agent":"Mozilla/5.0 (ZazoomTek publishing audit)", "Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  return response.read().decode("utf-8"), dict(response.headers.items())
          for attempt in range(1,17):
              try:
                  page,page_headers=get("/")
                  js,js_headers=get(suffix)
                  raw,feed_headers=get("/home-video-feed.json")
                  feed=json.loads(raw)
                  assert suffix in page, "Home still references the old JS version"
                  assert 'const authenticGameplay=clean.filter' in js, "Public JS has old GAMEPLAY selector"
                  assert 'let archive=clean.find(x=>x.completedLive' not in js, "Old completed Live selector persists"
                  assert 'id":"tEkXOj7XOwA"' in js, "Public JS fallback lacks newest Sesame gameplay"
                  assert 'id":"nQ26PED9Rgc","title":"ACE COMBAT 8' not in js, "Ace Combat is still the fallback"
                  assert 'no-store' in js_headers.get('Cache-Control',js_headers.get('cache-control','')).lower(), "Public JS cache policy not updated"
                  assert 'no-store' in feed_headers.get('Cache-Control',feed_headers.get('cache-control','')).lower(), "Public video feed cache policy not updated"
                  videos=[v for v in feed if v.get("category")=="gameplay" and not v.get("short") and not v.get("live")]
                  videos.sort(key=lambda v:v.get("publishedAt",""),reverse=True)
                  assert videos and videos[0]["id"]=="tEkXOj7XOwA", "Wrong public GAMEPLAY video"
                  print("PASS: public site serves fresh JS, no-store policy, and Sesame Street GAMEPLAY in feed")
                  break
              except Exception as err:
                  print("Attempt",attempt,"public-site audit:",repr(err),flush=True)
                  if attempt==16: raise
                  time.sleep(15)
          PY
