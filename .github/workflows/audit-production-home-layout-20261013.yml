name: Audit candidate Home layout before release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-production-home-layout-20261013.yml'
      - 'zt-home-live.js'
      - 'zt-design.css'
      - 'index.html'
permissions:
  contents: read
jobs:
  browser-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current approved Home contract without obsolete screenshot assumptions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          home=Path('index.html').read_text(encoding='utf-8')
          js=Path('zt-home-live.js').read_text(encoding='utf-8')
          css=Path('zt-design.css').read_text(encoding='utf-8')
          for marker in ('ARTICLE_FEED_START','ARTICLE_FEED_END','HOME_GUIDES_INSET_START','FEATURED_NEWS_START'):
              assert home.count('<!-- '+marker+' -->')==1, marker
          assert re.search(r'/zt-home-live\.js\?v=[^"\s]+',home), 'Versioned Home JS missing'
          assert re.search(r'/zt-design\.css\?v=[^"\s]+',home), 'Versioned design CSS missing'
          assert '<h2 id="zt-popular-title">DA NON PERDERE</h2>' in home
          assert 'const pop=side.querySelector("#zt-popular-box")' in js
          assert 'side.querySelector("#zt-popular-box")?.remove()' not in js
          assert 'rail.prepend(pop)' in js
          assert 'child.id==="ztpOtherNews"' in js
          assert 'Math.min(12,available.length)' in js
          assert 'DALLA REDAZIONE|RECENSIONI TECH|ALTRE NEWS' in js
          assert 'ZT_SQUARE_HEADINGS_ENFORCED_20261023_V3' in css
          assert 'noindex,nofollow' not in home
          print('PASS: main Home content anchors, restored popular module, retired mini modules, one bounded Other News module, square headings and versioned assets')
          PY
          node --check zt-home-live.js
          python3 scripts/verify-home-layout-lock.py
