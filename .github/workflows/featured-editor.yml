name: Legacy featured editor (read-only, manual audit)
# Normal six-card refresh is exclusively owned by refresh-static-news-in-evidenza.yml.
# This workflow never generates Tech Impact or Gaming Inside news.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only verification of manually selected featured items
        run: python3 scripts/featured-editor.py --test
