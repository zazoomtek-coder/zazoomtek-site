name: SEO production health - independent read only
on:
  # Independent production smoke checks, every six hours.
  schedule:
    - cron: '23 11,15,19 * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:
  push:
    branches:
      - main
      - seo/public-health-watch-20261014
    paths:
      - 'scripts/seo_public_health_readonly.py'
      - 'scripts/seo_production_performance_watch.py'
      - 'scripts/test_seo_public_health_readonly.py'
      - '.github/workflows/seo-public-health-readonly.yml'
permissions:
  contents: read
concurrency:
  group: zazoomtek-seo-health-independent
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test independent SEO health checks
        run: python3 scripts/test_seo_public_health_readonly.py
      - name: Verify public sitemap News and watch-page video SEO
        run: python3 scripts/seo_public_health_readonly.py --strict

      - name: Check homepage, archives, robots and sitemap response timings (read-only)
        run: python3 scripts/seo_production_performance_watch.py --strict
