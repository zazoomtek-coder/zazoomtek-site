name: Cloudflare Pages - hourly controlled publishing
# Deploy source: GitHub main. Production should watch ONLY
# cloudflare-release-trigger.txt in Cloudflare Pages Build watch paths.
# Scheduled checks are twice hourly for missed-run recovery, but the
# rolling 50-minute cooldown caps normal releases at about one/hour.
# GitHub Actions cron is best effort, not an exact-time SLA.

on:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/site-publish-request.txt'
  workflow_dispatch:
    inputs:
      urgent:
        description: 'Urgent editorial correction (uses reserved builds)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: zazoomtek-controlled-cloudflare-pages-releases
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage at most one release, only after validated content changes
        id: stage_release
        env:
          URGENT: ${{ inputs.urgent || false }}
        run: |
          set -euo pipefail
          git config user.name "ZazoomTek Editorial Publisher"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python3 scripts/cloudflare-release-control.py --self-test
            python3 scripts/verify-live-cloudflare.py --self-test

            # Decide FIRST. No change, recent release, or exhausted budget =
            # no expensive offline rebuild and no Cloudflare Pages build.
            if [ "$URGENT" = "true" ]; then
              python3 scripts/cloudflare-release-control.py --urgent
            else
              python3 scripts/cloudflare-release-control.py --dedupe-hour
            fi
            git add -- cloudflare-release-trigger.txt
            if git diff --cached --quiet; then
              echo "No new Cloudflare Pages build needed (no changes, cooldown or quota guard)."
              last_source="$(sed -n 's/^source_commit=//p' cloudflare-release-trigger.txt)"
              if ! [[ "$last_source" =~ ^[a-f0-9]{40}$ ]]; then
                echo "::error::Existing release trigger has no valid source SHA"
                exit 1
              fi
              echo "source_commit=$last_source" >> "$GITHUB_OUTPUT"
              echo "new_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Validate with the NEW source receipt before touching production.
            # All generated pages, thumbnails and review links must pass.
            python3 scripts/cloudflare-build-site.py
            git commit -m "Cloudflare release: hourly validated editorial batch"
            if git push origin HEAD:main; then
              source="$(sed -n 's/^source_commit=//p' cloudflare-release-trigger.txt)"
              if ! [[ "$source" =~ ^[a-f0-9]{40}$ ]]; then
                echo "::error::Release source SHA missing after push"
                exit 1
              fi
              echo "source_commit=$source" >> "$GITHUB_OUTPUT"
              echo "new_release=true" >> "$GITHUB_OUTPUT"
              echo "New Pages release REQUESTED; waiting for verified public result."
              exit 0
            fi
            echo "Concurrent Git push detected; rechecking fresh main before retry $attempt."
            sleep "$((attempt * 4))"
          done
          echo "::error::Could not safely push a validated Cloudflare release."
          exit 1

      - name: Confirm requested new Cloudflare release is actually public
        if: steps.stage_release.outputs.new_release == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.stage_release.outputs.source_commit }}
        run: |
          python3 scripts/verify-live-cloudflare.py --source-commit "$SOURCE_COMMIT" \
            --base-url "https://zazoomtek.it" --timeout-seconds 420 --interval-seconds 20
          echo "Production verified (new release): $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify existing production on no-change hourly checks
        if: steps.stage_release.outputs.new_release == 'false'
        env:
          SOURCE_COMMIT: ${{ steps.stage_release.outputs.source_commit }}
        run: |
          python3 scripts/verify-live-cloudflare.py --source-commit "$SOURCE_COMMIT" \
            --base-url "https://zazoomtek.it" --timeout-seconds 80 --interval-seconds 20
          echo "Production verified (no new Pages build needed): $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
