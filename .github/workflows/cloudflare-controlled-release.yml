name: Cloudflare Pages - hourly controlled publishing
# Deploy source: GitHub main. Production should watch ONLY
# cloudflare-release-trigger.txt in Cloudflare Pages Build watch paths.
# Fixed publication windows open every hour at :17 UTC.
# :47 is a recovery check for missed hourly windows, not another release slot.
# Each window publishes at most once; no rolling cooldown may postpone it.
# GitHub Actions cron and Cloudflare deployment remain best effort, not exact-time SLAs.

on:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/site-publish-request.txt'
  workflow_dispatch:
    inputs:
      urgent:
        description: 'Urgent editorial correction (uses reserved builds)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: zazoomtek-controlled-cloudflare-pages-releases
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage at most one release, only after validated content changes
        id: stage_release
        env:
          URGENT: ${{ inputs.urgent || false }}
        run: |
          set -euo pipefail
          git config user.name "ZazoomTek Editorial Publisher"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python3 scripts/cloudflare-release-control.py --self-test
            python3 scripts/verify-live-cloudflare.py --self-test
            python3 -m py_compile scripts/protect-home-structure.py scripts/restore-home-last-release.py
            # HOME protection rule: normal editorial/content updates are allowed.
            # If any update damages the approved Home, restore ONLY index.html
            # from the last verified production source, then continue with the
            # unrelated safe changes. Never ship a broken Home.
            if ! python3 scripts/protect-home-structure.py index.html; then
              echo "::warning::Candidate Home is damaged. Rolling index.html back to the last verified production Home."
              python3 scripts/restore-home-last-release.py
              python3 scripts/protect-home-structure.py index.html
              git add -- index.html
              if ! git diff --cached --quiet -- index.html; then
                git commit -m "Protect Home: rollback destructive candidate"
              fi
            fi

            # Changes prepared before a scheduled release are published in
            # the first available two-hour window (even UTC hours at :17).
            # Regular push events queue work; only scheduled checks publish.
            # Manual urgent release is an explicit, separately budgeted override.
            if [ "$URGENT" = "true" ]; then
              python3 scripts/cloudflare-release-control.py --urgent
            elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              python3 scripts/cloudflare-release-control.py --scheduled-slot
            else
              echo "Changes queued for the next scheduled Cloudflare window."
            fi
            git add -- cloudflare-release-trigger.txt
            if git diff --cached --quiet; then
              echo "No new Cloudflare Pages build needed (queued, slot already released, or unchanged)."
              last_source="$(sed -n 's/^source_commit=//p' cloudflare-release-trigger.txt)"
              if ! [[ "$last_source" =~ ^[a-f0-9]{40}$ ]]; then
                echo "::error::Existing release trigger has no valid source SHA"
                exit 1
              fi
              echo "source_commit=$last_source" >> "$GITHUB_OUTPUT"
              echo "new_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Validate with the NEW source receipt before touching production.
            # All generated pages, thumbnails and review links must pass.
            python3 scripts/cloudflare-build-site.py
            # The build itself must not damage the protected Home. If the
            # generated Home is broken, roll source Home back to the last
            # verified production version and rebuild once. If it is STILL
            # broken after rollback, abort the whole release: nothing reaches
            # production until the cause is fixed.
            if ! python3 scripts/protect-home-structure.py dist/index.html; then
              echo "::warning::Built Home failed protection. Restoring last verified Home and rebuilding once."
              python3 scripts/restore-home-last-release.py
              git add -- index.html
              if ! git diff --cached --quiet -- index.html; then
                git commit -m "Protect Home: rollback destructive build"
                # release-control wrote its receipt before the build. Point it
                # at the new rollback-safe source commit before publication.
                safe_source="$(git rev-parse HEAD)"
                sed -i "s/^source_commit=.*/source_commit=$safe_source/" cloudflare-release-trigger.txt
              fi
              rm -rf dist
              python3 scripts/cloudflare-build-site.py
              python3 scripts/protect-home-structure.py dist/index.html
            fi
            # No release may pass with old, duplicated, undated or unbalanced
            # Tech/Gaming columns. Browser-test exactly what Cloudflare ships.
            command -v google-chrome
            node --check scripts/verify-home-browser-columns.cjs
            mkdir -p /tmp/zt-release-gate
            npm install --prefix /tmp/zt-release-gate --no-save --silent playwright-core@1.56.0
            nohup python3 -m http.server 8877 --directory dist --bind 127.0.0.1 >/tmp/zt-release-gate/http.log 2>&1 &
            browser_server_pid=$!
            sleep 2
            NODE_PATH=/tmp/zt-release-gate/node_modules node scripts/verify-home-browser-columns.cjs
            kill "$browser_server_pid" || true
            git commit -m "Cloudflare release: hourly validated editorial batch"
            if git push origin HEAD:main; then
              source="$(sed -n 's/^source_commit=//p' cloudflare-release-trigger.txt)"
              if ! [[ "$source" =~ ^[a-f0-9]{40}$ ]]; then
                echo "::error::Release source SHA missing after push"
                exit 1
              fi
              echo "source_commit=$source" >> "$GITHUB_OUTPUT"
              echo "new_release=true" >> "$GITHUB_OUTPUT"
              echo "New Pages release REQUESTED; waiting for verified public result."
              exit 0
            fi
            echo "Concurrent Git push detected; rechecking fresh main before retry $attempt."
            sleep "$((attempt * 4))"
          done
          echo "::error::Could not safely push a validated Cloudflare release."
          exit 1

      - name: Confirm requested new Cloudflare release is actually public
        if: steps.stage_release.outputs.new_release == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.stage_release.outputs.source_commit }}
        run: |
          python3 scripts/verify-live-cloudflare.py --source-commit "$SOURCE_COMMIT" \
            --base-url "https://zazoomtek.it" --timeout-seconds 420 --interval-seconds 20
          echo "Production verified (new release): $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify existing production on no-change hourly checks
        if: steps.stage_release.outputs.new_release == 'false'
        env:
          SOURCE_COMMIT: ${{ steps.stage_release.outputs.source_commit }}
        run: |
          python3 scripts/verify-live-cloudflare.py --source-commit "$SOURCE_COMMIT" \
            --base-url "https://zazoomtek.it" --timeout-seconds 80 --interval-seconds 20
          echo "Production verified (new public content remains queued for its next slot, if present): $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
