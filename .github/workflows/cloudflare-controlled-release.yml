name: Cloudflare Pages - hourly batched publishing
# Only changes to the guarded trigger file may start a Cloudflare Pages build.
# Cloudflare Pages Settings > Build > Build watch paths:
#   Include: cloudflare-release-trigger.txt
#   Exclude: (none)
on:
  schedule:
    # Warm-up :39, target :44, fallback :54; 30m rolling cooldown plus 450/31-day budget.
    # GitHub cron uses UTC; 05-20 UTC covers Italy's 07-21 local window.
    # The runtime Europe/Rome guard skips out-of-window UTC entries.
    # GitHub schedule is best-effort: runner starts and builds cannot be guaranteed at :44.
    - cron: '39,44,54 5-20 * * *'
  push:
    branches: [main]
    paths:
      - '.github/site-publish-request.txt'
  workflow_dispatch:
    inputs:
      urgent:
        description: 'Urgent editorial correction (uses reserved builds)'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: zazoomtek-controlled-cloudflare-pages-releases
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check local Italy publishing window (handles DST automatically)
        id: rome_window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo
          local_now = dt.datetime.now(ZoneInfo("Europe/Rome"))
          # A manual urgent correction remains possible by explicit dispatch.
          allowed = os.environ["EVENT_NAME"] == "workflow_dispatch" or 7 <= local_now.hour <= 21
          print(f"Europe/Rome time: {local_now.isoformat()}, publish allowed: {allowed}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("allowed=" + str(allowed).lower() + "\n")
          PY
      - name: Hold early runner until minute :44 local (best effort)
        if: steps.rome_window.outputs.allowed == 'true' && github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import datetime as dt
          import time
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(ZoneInfo("Europe/Rome"))
          wait=(44-now.minute)*60-now.second
          if 0 < wait <= 5*60:
              print(f"Pre-warmed runner ready; waiting {wait}s until :44.")
              time.sleep(wait)
          PY
      - uses: actions/checkout@v4
        if: steps.rome_window.outputs.allowed == 'true'
        with:
          fetch-depth: 0
      - name: Stage one atomic Cloudflare publish only when public content changed
        id: stage_release
        if: steps.rome_window.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          git config user.name "ZazoomTek Editorial Publisher"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/cloudflare-release-control.py --self-test
            python3 scripts/verify-live-cloudflare.py --self-test
            # Build exactly the same static snapshot as Cloudflare before
            # spending a Pages build. A failure must block the trigger commit.
            python3 scripts/cloudflare-build-site.py
            if [ "${{ inputs.urgent || false }}" = "true" ]; then
              python3 scripts/cloudflare-release-control.py --urgent
            else
              python3 scripts/cloudflare-release-control.py --dedupe-hour
            fi
            git add -- cloudflare-release-trigger.txt
            if git diff --cached --quiet; then
              echo "No Cloudflare build needed (no new public content or reserve active)."
              exit 0
            fi
            git commit -m "Cloudflare release: batch approved ZazoomTek articles"
            if git push origin HEAD:main; then
              # The commit is NOT proof of deployment; the next step must
              # see this exact source revision on the public domain.
              SOURCE_COMMIT="$(sed -n 's/^source_commit=//p' cloudflare-release-trigger.txt)"
              if ! [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
                echo "::error::Cloudflare trigger missing valid source SHA."
                exit 1
              fi
              echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
              echo "One Pages build REQUESTED (not yet verified)."
              exit 0
            fi
            sleep "$((attempt * 4))"
          done
          echo "::error::Could not safely request the controlled Pages release."
          exit 1
      - name: Verify public Cloudflare deployment (no extra build)
        if: steps.stage_release.outputs.source_commit != ''
        env:
          SOURCE_COMMIT: ${{ steps.stage_release.outputs.source_commit }}
        run: |
          python3 scripts/verify-live-cloudflare.py --source-commit "$SOURCE_COMMIT" \
            --base-url "https://zazoomtek.it" --timeout-seconds 420 --interval-seconds 20
          echo "Published and verified: $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
