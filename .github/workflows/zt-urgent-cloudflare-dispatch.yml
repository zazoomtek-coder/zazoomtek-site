name: ZazoomTek validated urgent Cloudflare release
on:
  push:
    branches: [main]
    paths:
      - '.github/site-publish-request.txt'
permissions:
  actions: write
  contents: read
concurrency:
  group: zt-urgent-cloudflare-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[zt-urgent-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask existing guarded release workflow for one urgent build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cloudflare-controlled-release.yml --repo zazoomtek-coder/zazoomtek-site --ref main --field urgent=true
          echo "Requested one protected urgent release; Cloudflare publication is NOT confirmed here."
