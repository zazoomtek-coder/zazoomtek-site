name: Cloudflare production receipt after release trigger (no build)

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-release-trigger.txt'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Confirm watched trigger contains a valid source commit
        id: source
        run: |
          set -euo pipefail
          source_commit="$(sed -n 's/^source_commit=//p' cloudflare-release-trigger.txt)"
          if ! [[ "$source_commit" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Missing valid Cloudflare release source SHA"
            exit 1
          fi
          echo "sha=$source_commit" >> "$GITHUB_OUTPUT"
      - name: Verify real production after Cloudflare deploy (no extra builds)
        run: |
          python3 scripts/verify-live-cloudflare.py \
            --source-commit "${{ steps.source.outputs.sha }}" \
            --base-url "https://zazoomtek.it" \
            --timeout-seconds 420 --interval-seconds 20
          echo "Verified Cloudflare production source: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
