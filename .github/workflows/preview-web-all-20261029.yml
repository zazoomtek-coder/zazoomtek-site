name: Anteprima finale tutte Notizie Web con correlati - no deploy
on:
  push:
    branches:
      - preview/web-news-all-pages-final-20261029
permissions:
  contents: read
jobs:
  offline-complete-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/web-news-all-pages-final-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify site code is current and valid
        run: |
          node --check assets/js/site.js
          python3 -m py_compile tools/build.py tools/web_editorial.py tools/verify_web_gateway.py
          grep -q 'function fitHomeTitles()' assets/js/site.js
      - name: Import only authentic queued posts in runner without deploying
        run: |
          git fetch --no-tags origin editorial-queue
          python3 tools/scheduled_editorial_import.py
      - name: Build entire ZazoomTek site for offline verification only
        env:
          CF_PAGES_BRANCH: preview/web-news-all-pages-final-20261029
        run: |
          python3 tools/build.py
          python3 - <<'PY'
          from pathlib import Path
          import re,html
          root=Path('dist')
          pages=list(root.glob('notizia-web-*.html'))
          assert len(pages)>=6, ('expected at least 6 genuine Web articles',len(pages))
          for f in pages:
           h=f.read_text(encoding='utf-8')
           assert h.count('class="web-gateway-card"')==3,(f.name,'not 3 related stories')
           assert h.index('class="web-gateway-source-link"')<h.index('class="web-gateway-related"'),f.name
           assert 'class="inner-layout web-gateway-layout"' in h,f.name
           assert 'Ultime news' in h or 'ULTIME NEWS' in h,f.name
           hrefs=re.findall(r'class="web-gateway-card-cover" href="([^"]+)"',h)
           assert len(hrefs)==3 and len(set(hrefs))==3,(f.name,hrefs)
          idx=(root/'index.html').read_text()
          assert 'gaming-magazine-lead-secondary' in idx
          assert 'news-tech-top-grid' in idx
          js=(root/'assets/js/site.js').read_text()
          assert 'function fitHomeTitles()' in js and 'prefix+"..."' in js
          print('ALL WEB PAGES PASS',len(pages),'web news; three unique cards in EACH; Home 3-2-3, Gaming, three dots preserved. NO DEPLOY',flush=True)
          PY
      - name: Build complete offline ZIP
        run: |
          python3 tools/package_offline_preview.py
          mv ZazoomTek_SpotNews_Anteprima_Mobile_Footer_28-10-2026.zip ZazoomTek_TUTTE_NOTIZIE_WEB_CORRELATI_29-10-2026.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          z=Path('ZazoomTek_TUTTE_NOTIZIE_WEB_CORRELATI_29-10-2026.zip')
          with zipfile.ZipFile(z,'a',compression=zipfile.ZIP_DEFLATED) as f:
           f.writestr('LEGGIMI_ANTEPRIMA_NOTIZIE_WEB.txt',
            'ZAZOOMTEK - 29 OTTOBRE 2026 - ANTEPRIMA INTEGRALE NON ONLINE\\n'
            'TUTTE le pagine Notizie dal Web hanno 3 notizie ZazoomTek sotto la fonte e la colonna Ultime News a destra.\\n'
            'Estrarre TUTTO lo ZIP, poi aprire index.html; aprire Notizie dal Web e una notizia.\\n'
            'Non sono stati pubblicati test online. Studio richiede Cloudflare e non funziona da file locale.\\n')
          with zipfile.ZipFile(z) as f:
           names=set(f.namelist())
           assert len(names)>280,len(names)
           assert {'index.html','VISTA_SMARTPHONE.html','notizie-web.html','assets/css/spotnews.css','assets/js/site.js'}<=names
           assert not any(n.endswith('.zip') for n in names)
           assert f.testzip() is None
           print('ZIP COMPLETE VERIFIED',len(names),'files',z.stat().st_size,'bytes; no nested ZIP. NO DEPLOY',flush=True)
          PY
      - name: Provide offline preview artifact only - absolutely no Cloudflare deployment
        uses: actions/upload-artifact@v4
        with:
          name: ZazoomTek-TUTTE-NOTIZIE-WEB-CORRELATI-29-10-2026
          path: ZazoomTek_TUTTE_NOTIZIE_WEB_CORRELATI_29-10-2026.zip
          if-no-files-found: error
          retention-days: 30
