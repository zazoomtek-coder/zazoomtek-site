name: ZazoomTek - AUDIT SEO FIX + ZIP (NO DEPLOY)
on:
  push:
    branches: [seo/quick-fixes-20261029]
permissions:
  contents: read
jobs:
  audit-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/quick-fixes-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controlla sintassi
        run: python3 -m py_compile tools/build.py tools/seo.py tools/verify_seo.py
      - name: Importa contenuti approvati nel runner soltanto, senza push
        run: |
          git fetch --no-tags origin editorial-queue
          python3 tools/scheduled_editorial_import.py
      - name: Genera sito autentico e controlla ogni pagina
        env:
          CF_PAGES_BRANCH: seo/quick-fixes-20261029
        run: python3 tools/build.py
      - name: Verifica miglioramenti su tutte le pagine
        run: |
          python3 - <<'PY'
          import re, json
          from pathlib import Path
          from html.parser import HTMLParser
          class P(HTMLParser):
           def __init__(self):
            super().__init__();self.on=False;self.title='';self.h1=0;self.scripts=[];self.is_ld=False;self.script=''
           def handle_starttag(self,tag,attrs):
            d=dict(attrs)
            if tag=='title':self.on=True
            if tag=='h1':self.h1+=1
            if tag=='script' and d.get('type')=='application/ld+json':self.is_ld=True;self.script=''
           def handle_endtag(self,tag):
            if tag=='title':self.on=False
            if tag=='script' and self.is_ld:
             self.scripts.append(json.loads(self.script));self.is_ld=False
           def handle_data(self,v):
            if self.on:self.title+=v
            if self.is_ld:self.script+=v
          root=Path('dist')
          pages={}
          for f in root.glob('*.html'):
           p=P();p.feed(f.read_text(encoding='utf-8'));pages[f.stem]=p
          assert pages['index'].h1==1
          paged=[(k,p) for k,p in pages.items() if re.search(r'-page-\\d+$',k)]
          for slug,p in paged:
           n=slug.rsplit('-',1)[1]
           assert 'Pagina '+n in p.title,(slug,p.title)
          assert len({p.title for _,p in paged})==len(paged),(len(paged),len({p.title for _,p in paged}))
          home=(root/'index.html').read_text(encoding='utf-8')
          for link in ('/recensioni-tech','/recensioni-gaming','/video'):
           assert 'href="'+link+'"' in home
          total_reviews=sum(any(d.get('@type')=='Review' for d in p.scripts) for p in pages.values())
          print('SEO VERIFIED: generated',len(pages),'HTML pages;',len(paged),'unique paginated titles;',total_reviews,'Review schemas; crawlable archives; Home H1')
          PY
      - name: Crea ZIP offline completo scaricabile
        run: |
          python3 tools/package_offline_preview.py
          mv ZazoomTek_SpotNews_Anteprima_Mobile_Footer_28-10-2026.zip ZazoomTek_SEO_Correzioni_Anteprima_29-10-2026.zip
          python3 - <<'PY'
          import zipfile,os
          from pathlib import Path
          p=Path('ZazoomTek_SEO_Correzioni_Anteprima_29-10-2026.zip')
          readme='ZAZOOMTEK - ANTEPRIMA SEO 29/10/2026 (NON ONLINE)\n\nEstrai tutto lo ZIP e apri index.html.\nControlla Home, Recensioni, pagine 2 e successive delle sezioni e singoli articoli.\nCorrezioni: titoli SEO senza troncamenti inutili, H1 Home, collegamenti interni, metadati unici archivi, schemi Review fedeli ai voti, meta descrizioni legali.\nÈ una copia offline: Studio autenticato richiede Cloudflare, non è operativo da file://.\nI meta noindex e robots Disallow di questa COPIA sono intenzionali e non rappresentano il sito di produzione.\nNessun deploy eseguito.\n'
          with zipfile.ZipFile(p,'a',zipfile.ZIP_DEFLATED) as z:
           z.writestr('LEGGIMI_SEO_29-10-2026.txt',readme)
          with zipfile.ZipFile(p) as z:
           names=set(z.namelist())
           assert 'index.html' in names and 'VISTA_SMARTPHONE.html' in names and 'recensioni-page-2.html' in names
           assert len(names)>250,len(names)
           print('ZIP READY:',len(names),'files;',p.stat().st_size,'bytes; NESSUN DEPLOY')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ZazoomTek-SEO-Anteprima-Completa-29-10-2026
          path: ZazoomTek_SEO_Correzioni_Anteprima_29-10-2026.zip
          retention-days: 30
          if-no-files-found: error
