name: Sync YouTube to site
# manual sync trigger 2026-10-04 16:18
on:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-site-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install video metadata checker
        run: python3 -m pip install --quiet yt-dlp

      - name: Sync public YouTube uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/update-youtube.py
      - name: Sync public YouTube Community posts
        run: python3 scripts/update-youtube-posts.py
      - name: Commit verified changes
        id: commit
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "zazoomtek-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html recensioni.html test.html unboxing.html gaming.html recensioni-scritte.html recensione-*.html .youtube-latest.json .youtube-posts.json
          git commit -m "Auto-sync latest YouTube uploads"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy synced site to Firebase Hosting
        if: steps.commit.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAZOMTEK }}
          channelId: live
          projectId: zazomtek
