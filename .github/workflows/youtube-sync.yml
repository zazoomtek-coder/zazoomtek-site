name: Sync YouTube to site

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-sync.yml'
      - 'scripts/update-youtube-posts.py'
      - 'scripts/update-youtube.py'
      - 'scripts/validate-sync-output.py'
      - 'scripts/build-search-index.py'
      - 'scripts/build-related-content.py'
      - 'scripts/inject-analytics.py'
      - 'zt-analytics.js'
      - 'cerca.html'
  workflow_dispatch:

permissions:
  contents: write

# Never kill a healthy sync just because the next 5-minute check has arrived.
# At most one sync runs at a time; later checks wait for the current one.
concurrency:
  group: zazoomtek-site-publish
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate sync programs
        run: |
          python3 -m py_compile scripts/update-youtube.py scripts/update-youtube-posts.py scripts/validate-sync-output.py scripts/build-search-index.py scripts/build-related-content.py scripts/inject-analytics.py
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Configure Git
        run: |
          git config user.name "zazoomtek-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Sync and validate YouTube Community
        id: community_sync
        continue-on-error: true
        run: |
          python3 scripts/update-youtube-posts.py
          python3 scripts/validate-sync-output.py community

      - name: Discard unsafe Community changes
        if: steps.community_sync.outcome != 'success'
        run: |
          echo "Community sync failed validation; restoring last known-good repository state."
          git reset --hard HEAD
          git clean -fd

      - name: Save validated Community changes locally
        id: community_commit
        if: steps.community_sync.outcome == 'success'
        continue-on-error: true
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-sync YouTube Community reviews"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover from Community commit failure
        if: steps.community_commit.outcome == 'failure'
        run: |
          echo "Community commit failed; discarding uncommitted Community output."
          git reset --hard HEAD
          git clean -fd

      - name: Sync and validate YouTube uploads
        id: video_sync
        if: always()
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 scripts/update-youtube.py
          python3 scripts/validate-sync-output.py videos

      - name: Discard unsafe video changes
        if: always() && steps.video_sync.outcome != 'success'
        run: |
          echo "Video sync failed validation; restoring last known-good local state."
          git reset --hard HEAD
          git clean -fd

      - name: Save validated video changes locally
        id: video_commit
        if: steps.video_sync.outcome == 'success'
        continue-on-error: true
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-sync latest YouTube uploads"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover from video commit failure
        if: steps.video_commit.outcome == 'failure'
        run: |
          echo "Video commit failed; discarding uncommitted video output."
          git reset --hard HEAD
          git clean -fd

      - name: Build automatic related articles
        id: related_sync
        if: always()
        continue-on-error: true
        run: python3 scripts/build-related-content.py

      - name: Save related article links locally
        id: related_commit
        if: steps.related_sync.outcome == 'success'
        continue-on-error: true
        run: |
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update automatic related articles"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover from related article build failure
        if: steps.related_commit.outcome == 'failure'
        run: |
          echo "Related article commit failed; discarding uncommitted related-link output."
          git reset --hard HEAD
          git clean -fd

      - name: Ensure GA4 on every HTML page
        id: analytics_sync
        if: always()
        continue-on-error: true
        run: python3 scripts/inject-analytics.py

      - name: Save GA4 HTML updates locally
        id: analytics_commit
        if: steps.analytics_sync.outcome == 'success'
        continue-on-error: true
        run: |
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Apply GA4 loader across site pages"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover from GA4 injection failure
        if: steps.analytics_commit.outcome == 'failure'
        run: |
          echo "GA4 injection commit failed; discarding uncommitted HTML output."
          git reset --hard HEAD
          git clean -fd

      - name: Build global search index
        id: search_sync
        if: always()
        continue-on-error: true
        run: python3 scripts/build-search-index.py

      - name: Save global search index locally
        id: search_commit
        if: steps.search_sync.outcome == 'success'
        continue-on-error: true
        run: |
          git add search-index.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update global site search index"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover from search index commit failure
        if: steps.search_commit.outcome == 'failure'
        run: |
          echo "Search index commit failed; discarding uncommitted search output."
          git reset --hard HEAD
          git clean -fd

      - name: Push validated site update
        if: always() && steps.search_sync.outcome == 'success' && (steps.community_commit.outputs.changed == 'true' || steps.video_commit.outputs.changed == 'true' || steps.related_commit.outputs.changed == 'true' || steps.analytics_commit.outputs.changed == 'true' || steps.search_commit.outputs.changed == 'true')
        run: |
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "Remote branch changed incompatibly; refusing an unsafe automatic merge."
            exit 1
          fi

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; refreshing main before retry."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to push after 3 attempts."
          exit 1

      - name: Deploy validated site to Firebase
        id: site_deploy
        if: always() && steps.related_sync.outcome == 'success' && steps.analytics_sync.outcome == 'success' && steps.search_sync.outcome == 'success'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAZOMTEK }}
          channelId: live
          projectId: zazomtek

      - name: Report partial source failures
        if: always()
        run: |
          community="${{ steps.community_sync.outcome }}"
          videos="${{ steps.video_sync.outcome }}"
          community_commit="${{ steps.community_commit.outcome }}"
          video_commit="${{ steps.video_commit.outcome }}"
          related="${{ steps.related_sync.outcome }}"
          related_commit="${{ steps.related_commit.outcome }}"
          analytics="${{ steps.analytics_sync.outcome }}"
          analytics_commit="${{ steps.analytics_commit.outcome }}"
          search="${{ steps.search_sync.outcome }}"
          search_commit="${{ steps.search_commit.outcome }}"
          deploy="${{ steps.site_deploy.outcome }}"
          echo "Community result: $community"
          echo "Video result: $videos"
          echo "Related articles result: $related"
          echo "GA4 injection result: $analytics"
          echo "Search index result: $search"
          echo "Community commit: $community_commit"
          echo "Video commit: $video_commit"
          echo "Related articles commit: $related_commit"
          echo "GA4 commit: $analytics_commit"
          echo "Search commit: $search_commit"
          echo "Firebase deploy: $deploy"
          if [ "$community" != "success" ] || [ "$videos" != "success" ] || [ "$related" != "success" ] || [ "$analytics" != "success" ] || [ "$search" != "success" ] || [ "$deploy" != "success" ] || \
             [ "$community_commit" = "failure" ] || [ "$video_commit" = "failure" ] || [ "$related_commit" = "failure" ] || [ "$analytics_commit" = "failure" ] || [ "$search_commit" = "failure" ]; then
            echo "At least one protected sync stage failed. Valid stages were preserved independently."
            exit 1
          fi
