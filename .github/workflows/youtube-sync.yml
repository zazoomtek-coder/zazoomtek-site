name: Sync YouTube to site
# manual sync trigger 2026-10-04 18:00 sitemap
on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-sync.yml'
      - 'scripts/update-youtube-posts.py'
      - 'scripts/update-youtube.py'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-site-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync public YouTube Community posts
        run: python3 scripts/update-youtube-posts.py

      - name: Commit Community changes
        id: community_commit
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "zazoomtek-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html news.html news-*.html recensioni-scritte.html recensione-*.html pagina-*.html sitemap.xml google-sitemap.xml sitemap.txt robots.txt .youtube-posts.json
            git commit -m "Auto-sync YouTube Community reviews"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Community updates to Firebase
        if: steps.community_commit.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAZOMTEK }}
          channelId: live
          projectId: zazomtek

      - name: Sync public YouTube uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/update-youtube.py

      - name: Commit video changes
        id: video_commit
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "zazoomtek-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html recensioni.html test.html unboxing.html gaming.html .youtube-latest.json
            git commit -m "Auto-sync latest YouTube uploads"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy video updates to Firebase
        if: steps.video_commit.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAZOMTEK }}
          channelId: live
          projectId: zazomtek
