name: Sync YouTube to site

on:
  schedule:
    # Check YouTube every five minutes; no content change means no site build/deploy.
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-sync.yml'
      - 'scripts/update-youtube-posts.py'
      - 'scripts/test_review_dedup.py'
      - 'scripts/test_community_freshness.py'
      - 'scripts/test_video_sync_reliability.py'
      - 'scripts/update-youtube.py'
      - 'scripts/validate-sync-output.py'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Rebuild all Community and video HTML even if YouTube content is unchanged'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# Never kill a healthy sync just because the next 5-minute check has arrived.
# At most one sync runs at a time; later checks wait for the current one.
concurrency:
  group: youtube-site-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install optional image comparison dependency
        continue-on-error: true
        run: python3 -m pip install --quiet pillow

      - name: Validate sync programs
        run: |
          python3 -m py_compile scripts/update-youtube.py scripts/update-youtube-posts.py scripts/validate-sync-output.py scripts/test_review_dedup.py scripts/test_community_freshness.py scripts/test_video_sync_reliability.py
          python3 scripts/test_review_dedup.py
          python3 scripts/test_community_freshness.py
          python3 scripts/test_video_sync_reliability.py
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Configure Git
        run: |
          git config user.name "zazoomtek-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Sync and validate YouTube Community
        id: community_sync
        continue-on-error: true
        env:
          ZT_FORCE_SYNC: ${{ inputs.force_sync == true }}
        run: |
          python3 scripts/update-youtube-posts.py
          python3 scripts/validate-sync-output.py community
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Community unchanged; no pages will be rebuilt or deployed."
          fi

      - name: Discard unsafe Community changes
        if: steps.community_sync.outcome != 'success'
        run: |
          echo "Community sync failed validation; restoring last known-good repository state."
          git reset --hard HEAD
          git clean -fd

      - name: Save validated Community changes locally
        id: community_commit
        if: steps.community_sync.outcome == 'success' && steps.community_sync.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-sync YouTube Community reviews"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover from Community commit failure
        if: steps.community_commit.outcome == 'failure'
        run: |
          echo "Community commit failed; discarding uncommitted Community output."
          git reset --hard HEAD
          git clean -fd

      # Publish Community first to protect time-sensitive news from failures in
      # optional downstream builders. Recompute from fresh main after conflicts.
      - name: Publish Community update immediately
        id: community_push
        if: steps.community_commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          ZT_FORCE_SYNC: ${{ inputs.force_sync == true }}
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              python3 scripts/update-youtube-posts.py
              python3 scripts/validate-sync-output.py community
              git add -A
              if git diff --cached --quiet; then
                echo "Community already up to date on main."
                echo "published=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git commit -m "Auto-sync Community from current YouTube posts"
            fi
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Concurrent main change, retrying Community from latest state."
            sleep $((attempt * 2))
          done
          echo "::error::Could not safely publish Community update."
          exit 1

      # Primary content deploy: optional builders cannot block the Community.
      # Dispatch the single deployment queue; this never touches carousel data.
      - name: Queue Community publication
        id: community_deploy
        if: steps.community_push.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site-live.yml --ref main

      # The independent uploads channel is checked after the Community release.
      # after both have been checked (no redundant early Hosting release).
      - name: Sync and validate YouTube uploads
        id: video_sync
        if: always()
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ZT_FORCE_SYNC: ${{ inputs.force_sync == true }}
        run: |
          python3 scripts/update-youtube.py
          python3 scripts/validate-sync-output.py videos
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Videos unchanged; no pages will be rebuilt or deployed."
          fi

      - name: Discard unsafe video changes
        if: always() && steps.video_sync.outcome != 'success'
        run: |
          echo "Video sync failed validation; restoring last known-good local state."
          git reset --hard HEAD
          git clean -fd

      - name: Save validated video changes locally
        id: video_commit
        if: steps.video_sync.outcome == 'success' && steps.video_sync.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-sync latest YouTube uploads"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover from video commit failure
        if: steps.video_commit.outcome == 'failure'
        run: |
          echo "Video commit failed; discarding uncommitted video output."
          git reset --hard HEAD
          git clean -fd

      # Independent uploads release, before any nonessential site scripts.
      - name: Publish validated YouTube uploads directly
        id: video_push
        if: steps.video_commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            git fetch origin main || { sleep "$((attempt * 2))"; continue; }
            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              python3 scripts/update-youtube.py
              python3 scripts/validate-sync-output.py videos
              git add -A
              if git diff --cached --quiet; then
                echo "published=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git commit -m "Auto-sync videos on latest main"
            fi
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          echo "::error::Could not publish videos; recovery workflow will retry."
          exit 1
      - name: Queue YouTube video publication
        id: video_deploy
        if: steps.video_push.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site-live.yml --ref main

      # Only after BOTH import channels are independently committed:
      - name: Remove duplicate images across all existing article pages
        continue-on-error: true
        if: steps.community_sync.outcome == 'success' && steps.community_sync.outputs.changed == 'true'
        run: python3 scripts/remove-duplicate-article-images.py

      - name: Build Facebook RSS from approved new general NEWS
        continue-on-error: true
        if: steps.community_sync.outcome == 'success' && steps.community_sync.outputs.changed == 'true'
        run: python3 scripts/build-news-rss.py

      - name: Rebuild mixed archive sidebars
        continue-on-error: true
        if: steps.community_sync.outcome == 'success' && steps.community_sync.outputs.changed == 'true'
        run: python3 scripts/zt_sidebar_mix.py

      - name: Build automatic related articles
        id: related_sync
        if: always() && (steps.community_sync.outputs.changed == 'true' || steps.video_sync.outputs.changed == 'true')
        continue-on-error: true
        run: python3 scripts/build-related-content.py

      - name: Save related article links locally
        id: related_commit
        if: steps.related_sync.outcome == 'success'
        continue-on-error: true
        run: |
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update automatic related articles"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover from related article build failure
        if: steps.related_commit.outcome == 'failure'
        run: |
          echo "Related article commit failed; discarding uncommitted related-link output."
          git reset --hard HEAD
          git clean -fd

      - name: Ensure GA4 on every HTML page
        id: analytics_sync
        if: always() && (steps.community_sync.outputs.changed == 'true' || steps.video_sync.outputs.changed == 'true')
        continue-on-error: true
        run: python3 scripts/inject-analytics.py

      - name: Save GA4 HTML updates locally
        id: analytics_commit
        if: steps.analytics_sync.outcome == 'success'
        continue-on-error: true
        run: |
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Apply GA4 loader across site pages"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover from GA4 injection failure
        if: steps.analytics_commit.outcome == 'failure'
        run: |
          echo "GA4 injection commit failed; discarding uncommitted HTML output."
          git reset --hard HEAD
          git clean -fd

      - name: Build global search index
        id: search_sync
        if: always() && (steps.community_sync.outputs.changed == 'true' || steps.video_sync.outputs.changed == 'true')
        continue-on-error: true
        run: python3 scripts/build-search-index.py

      - name: Save global search index locally
        id: search_commit
        if: steps.search_sync.outcome == 'success'
        continue-on-error: true
        run: |
          git add search-index.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update global site search index"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover from search index commit failure
        if: steps.search_commit.outcome == 'failure'
        run: |
          echo "Search index commit failed; discarding uncommitted search output."
          git reset --hard HEAD
          git clean -fd

      # YouTube imports are primary: auxiliary related links, analytics or search
      # failures must never hold back already-validated Community/video commits.
      - name: Push validated site update
        id: site_push
        if: always() && ((steps.video_commit.outputs.changed == 'true' && steps.video_push.outputs.published != 'true') || steps.related_commit.outputs.changed == 'true' || steps.analytics_commit.outputs.changed == 'true' || steps.search_commit.outputs.changed == 'true' || (steps.community_commit.outputs.changed == 'true' && steps.community_push.outcome == 'failure'))
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ZT_FORCE_SYNC: ${{ inputs.force_sync == true }}
        run: |
          # Drop unstaged generated files; primary imports have already been committed.
          git reset --hard HEAD
          git clean -fd -- '__pycache__' 'scripts/__pycache__'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              # Never auto-merge hundreds of generated article pages. Instead
              # replay the validated imports onto the latest remote contents.
              git rebase --abort || true
              git reset --hard origin/main
              # Primary Community and video imports were already published
              # independently. Replay ONLY these optional builders after a conflict.
              # Never re-scan all of YouTube just to rebuild related links.
              # Never block published Community news on optional sidebars/search.
              python3 scripts/build-related-content.py || echo 'Related links postponed.'
              python3 scripts/inject-analytics.py || echo 'Analytics refresh postponed.'
              python3 scripts/build-search-index.py || echo 'Search index postponed.'
              git add -A
              if git diff --cached --quiet; then
                echo "Latest remote already contains the imported content."
                echo "published=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git commit -m "Publish validated YouTube changes on latest main"
            fi
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Concurrent update during final push; retrying safely."
            sleep $((attempt * 2))
          done
          echo "::error::Unable to safely publish site update."
          exit 1

      # Supplemental changes are committed independently and only queue deploy.
      # No design/carousel script may gate YouTube imports or Firebase releases.
      - name: Queue optional site improvements
        id: site_deploy
        if: always() && (steps.site_push.outputs.published == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site-live.yml --ref main

      - name: Report partial source failures
        if: always()
        run: |
          community="${{ steps.community_sync.outcome }}"
          videos="${{ steps.video_sync.outcome }}"
          community_commit="${{ steps.community_commit.outcome }}"
          community_push="${{ steps.community_push.outcome }}"
          video_commit="${{ steps.video_commit.outcome }}"
          related="${{ steps.related_sync.outcome }}"
          related_commit="${{ steps.related_commit.outcome }}"
          analytics="${{ steps.analytics_sync.outcome }}"
          analytics_commit="${{ steps.analytics_commit.outcome }}"
          search="${{ steps.search_sync.outcome }}"
          search_commit="${{ steps.search_commit.outcome }}"
          deploy="${{ steps.site_deploy.outcome }}"
          site_push="${{ steps.site_push.outcome }}"
          echo "Community result: $community"
          echo "Video result: $videos"
          echo "Related articles result: $related"
          echo "GA4 injection result: $analytics"
          echo "Search index result: $search"
          echo "Community commit: $community_commit"
          echo "Fast Community push: $community_push"
          echo "Community published: ${{ steps.community_push.outputs.published }}"
          echo "Video commit: $video_commit"
          echo "Related articles commit: $related_commit"
          echo "GA4 commit: $analytics_commit"
          echo "Search commit: $search_commit"
          echo "Final push: $site_push"
          echo "Firebase deploy: $deploy"
          if [ "$community" != "success" ] || [ "$videos" != "success" ] || [ "$related" = "failure" ] || [ "$analytics" = "failure" ] || [ "$search" = "failure" ] || [ "$deploy" = "failure" ] || \
             [ "$community_commit" = "failure" ] || [ "$site_push" = "failure" ] || [ "$community_push" = "failure" -a "$site_push" != "success" ] || [ "$video_commit" = "failure" ] || [ "$related_commit" = "failure" ] || [ "$analytics_commit" = "failure" ] || [ "$search_commit" = "failure" ]; then
            echo "At least one protected sync stage failed. Valid stages were preserved independently."
            exit 1
          fi
