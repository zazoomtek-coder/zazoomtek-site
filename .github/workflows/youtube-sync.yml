name: Sync YouTube to site
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-site-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync public YouTube uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/update-youtube.py
      - name: Commit verified changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "zazoomtek-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html recensioni.html test.html unboxing.html gaming.html .youtube-latest.json
          git commit -m "Auto-sync latest YouTube uploads"
          git push
